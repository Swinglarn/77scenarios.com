function render(){
  const p=new URLSearchParams(window.location.search);
  const pathMatch=window.location.pathname.match(/\/letters\/([a-zA-Z])(?:$|\/)/);
  const l=(pathMatch?pathMatch[1]:p.get('l')||'E').toUpperCase();
  const d=letters[l];
  if(!d){document.getElementById('content').innerHTML='<p style="color:var(--muted)">Letra no encontrada.</p>';return;}
  document.title=`${l} · ${d.name} en Myers-Briggs, 77 Scenarios`;

  // Dynamic SEO
  const keyPhrases={E:'introvert vs extrovert, extraversion definition, what is extraversion',I:'introversion definition, introvert meaning, what is introversion',S:'sensing personality, what is sensing MBTI, sensing vs intuition',N:'intuition personality type, what is intuition MBTI, sensing vs intuition',T:'thinking personality type, MBTI thinking meaning, thinking vs feeling',F:'feeling personality type, MBTI feeling meaning, thinking vs feeling',J:'judging personality type, MBTI judging meaning, judging vs perceiving',P:'perceiving personality type, MBTI perceiving meaning, judging vs perceiving'};
  const seoDesc=`What does ${l} (${d.name}) mean in Myers-Briggs? ${d.p1.slice(0,160).replace(/<[^>]+>/g,'')}...`;
  let dm=document.querySelector('meta[name="description"]');
  if(!dm){dm=document.createElement('meta');dm.name='description';document.head.appendChild(dm);}
  dm.content=seoDesc;
  let km=document.querySelector('meta[name="keywords"]');
  if(!km){km=document.createElement('meta');km.name='keywords';document.head.appendChild(km);}
  km.content=`${l} personality, ${d.name.toLowerCase()} MBTI, ${d.name.toLowerCase()} meaning, Myers-Briggs ${l}, ${keyPhrases[l]||''}`;
  document.getElementById('canonical-url')?.setAttribute('href',`https://77scenarios.com/letters/${l.toLowerCase()}`);
  document.body.dataset.letter = l.toLowerCase();
  document.querySelector('meta[property="og:title"]')?.setAttribute('content',`${l} · ${d.name} en Myers-Briggs, 77 Scenarios`)||
    (()=>{const m=document.createElement('meta');m.setAttribute('property','og:title');m.content=`${l} · ${d.name} en Myers-Briggs, 77 Scenarios`;document.head.appendChild(m);})();
  document.querySelector('meta[property="og:description"]')?.setAttribute('content',seoDesc)||
    (()=>{const m=document.createElement('meta');m.setAttribute('property','og:description');m.content=seoDesc;document.head.appendChild(m);})();
  document.querySelector('meta[property="og:url"]')?.setAttribute('content',`https://77scenarios.com/letters/${l.toLowerCase()}`)||
    (()=>{const m=document.createElement('meta');m.setAttribute('property','og:url');m.content=`https://77scenarios.com/letters/${l.toLowerCase()}`;document.head.appendChild(m);})();
  const h1el=document.getElementById('page-h1');if(h1el)h1el.textContent=`${l} · ${d.name} in Myers-Briggs`;
  document.getElementById('letter-schema').textContent=JSON.stringify({"@context":"https://schema.org","@graph":[{"@type":"Article","@id":`https://77scenarios.com/letters/${l.toLowerCase()}#article`,"headline":`${l} in Myers-Briggs: ${d.name} Explained`,"description":seoDesc,"url":`https://77scenarios.com/letters/${l.toLowerCase()}`,"keywords":`${l} personality, ${d.name.toLowerCase()} MBTI, ${d.name.toLowerCase()} meaning`,"articleSection":"Myers-Briggs Personality Dimensions","inLanguage":"en","dateModified":"2026-05-19","publisher":{"@type":"Organization","@id":"https://77scenarios.com/#organization","name":"77 Scenarios"},"isPartOf":{"@type":"WebSite","@id":"https://77scenarios.com/#website"}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://77scenarios.com"},{"@type":"ListItem","position":2,"name":"8 Letters","item":"https://77scenarios.com/letters"},{"@type":"ListItem","position":3,"name":`${l} — ${d.name}`,"item":`https://77scenarios.com/letters/${l.toLowerCase()}`}]}]});

  const typesHTML=d.types.map(t=>`
    <a href="/es/type?t=${t}" class="type-mini">
      <div class="mini-code">${t.split('').map(c=>c===l?`<span class="hi">${c}</span>`:c).join('')}</div>
      <div class="mini-name">${d.typeNames[t]||''}</div>
    </a>`).join('');

  document.getElementById('content').innerHTML=`
    <div class="hero r" data-d="1">
      <div class="hero-letter">${l}</div>
      <div class="hero-right">
        <div class="hero-dim">${d.dim} dimensión</div>
        <div class="hero-name">${d.name}</div>
        <div class="hero-opp">Opuesto: <a href="/es/letters/${d.opp.toLowerCase()}">${d.opp} · ${d.oppName}</a></div>
      </div>
    </div>
    <div class="section r" data-d="2"><div class="section-label">Qué significa</div><p class="body-text">${d.p1}</p><p class="body-text">${d.p2}</p></div>
    <div class="section r" data-d="3"><div class="section-label">Rasgos</div><div class="traits-row">${d.traits.map(t=>`<span class="trait">${t}</span>`).join('')}</div></div>
    <div class="two-col section r" data-d="4">
      <div class="box"><div class="box-title">Fortalezas</div><ul>${d.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>
      <div class="box"><div class="box-title">En la vida diaria</div><div class="box-text">${d.daily}</div></div>
    </div>
    <div class="growth-box section r" data-d="5"><div class="box-title">Frontera de crecimiento</div><div class="box-text">${d.growth}</div></div>
    <div class="section r" data-d="6"><div class="section-label">Tipos con ${l}</div><div class="types-grid">${typesHTML}</div></div>
    <div class="sep r" data-d="7"></div>
    <div class="section r" data-d="8">
      <div class="section-label">El otro lado</div>
      <div class="opp-block">
        <div class="opp-left">
          <div class="opp-letter">${d.opp}</div>
          <div><div class="opp-name">${d.oppName}</div><div class="opp-sub">${d.oppDesc}</div></div>
        </div>
        <a href="/es/letters/${d.opp.toLowerCase()}" class="btn-outline">Explorar ${d.opp} →</a>
      </div>
    </div>
    <div class="cta-block r" data-d="9">
      <div class="cta-text">Descubre <em>tus</em> letras<br>a través de escenarios reales.</div>
      <a href="/es/" class="btn-gold">Hacer el test →</a>
    </div>`;

  document.querySelectorAll('.r').forEach(el=>obs.observe(el));
}

const ov=document.getElementById('t-overlay');
function fadeIn(){ov.style.opacity='1';ov.animate([{opacity:1},{opacity:0}],{duration:550,delay:60,easing:'cubic-bezier(0.22,1,0.36,1)',fill:'forwards'});}
fadeIn();
window.addEventListener('pageshow',e=>{if(e.persisted)fadeIn();});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const h=a.getAttribute('href');
  if(!h||h.startsWith('#')||h.startsWith('http')||h.startsWith('javascript')||h.startsWith('mailto'))return;
  e.preventDefault();
  ov.animate([{opacity:0},{opacity:1}],{duration:320,easing:'cubic-bezier(0.76,0,0.24,1)',fill:'forwards'}).finished.then(()=>{window.location.href=h;});
});

const obs=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(!en.isIntersecting)return;
    setTimeout(()=>en.target.classList.add('in'),parseFloat(en.target.dataset.d||0)*70);
    obs.unobserve(en.target);
  });
},{threshold:0.155});

render();
</script>
