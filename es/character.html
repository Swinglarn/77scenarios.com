<style>

  .glow-2{width:400px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(120,180,160,0.05) 0%,transparent 70%);}

  /* ── PAGE LAYOUT ── */

  .breadcrumb{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:32px;display:flex;align-items:center;gap:8px;}
  .breadcrumb a{color:var(--muted);transition:color 0.2s;}
  .breadcrumb a:hover{color:var(--gold);}

  .hero-avatar-placeholder{width:120px;height:120px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;}

  .hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5vw,42px);font-weight:300;color:var(--cream);line-height:1.1;margin-bottom:6px;}

  .letter-block{margin-bottom:36px;}
  .letter-block:last-child{margin-bottom:0;}
  .letter-display{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2e3a44;}

  .fn-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--gold);margin-bottom:6px;}
  .fn-desc{font-size:12px;color:var(--muted);line-height:1.6;}

  .verdict{background:#131820;border:1px solid #2a3848;border-left:4px solid var(--gold);border-radius:var(--radius);padding:24px 28px;margin-top:28px;margin-bottom:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 6px 20px rgba(0,0,0,0.5);}

  body.light-mode .letter-word{color:#8a6d2e!important}

  .tag{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #2e3a44;color:var(--muted);background:var(--surface2);}

  /* ── RELATED ── */
  .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
  .related-card{background:#131820;border:1px solid #2a3848;border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color 0.2s,transform 0.25s,box-shadow 0.25s;text-decoration:none;display:block;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}

  .related-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08),0 20px 50px rgba(0,0,0,0.55);}

  .related-ctx{font-size:11px;color:var(--muted);}
  .universe-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .actor-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .actor-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:var(--surface);border:1px solid #2e3a44;border-radius:8px;text-decoration:none;transition:border-color 0.15s,transform 0.15s;font-size:13px;color:var(--muted);}
  .actor-chip:hover{border-color:rgba(201,168,76,0.35);transform:translateY(-1px);}

  .actor-chip-name{color:var(--cream);}
  .universe-chip{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border:1px solid #2e3a44;border-radius:8px;text-decoration:none;transition:border-color 0.15s,transform 0.15s;flex-shrink:0;}
  .universe-chip:hover{border-color:rgba(201,168,76,0.35);transform:translateY(-1px);}
  .universe-chip-type{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:var(--gold);line-height:1;}
  .universe-chip-name{font-size:13px;color:var(--cream);line-height:1;}

  /* ── CTA ── */
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:48px;padding-top:32px;border-top:1px solid var(--border);}
  .cta-btn{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);background:transparent;padding:11px 20px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;text-decoration:none;display:inline-block;}

  .cta-btn.sec{color:var(--muted);border-color:var(--border);}
  .cta-btn.sec:hover{color:var(--cream);border-color:var(--muted);}

  /* ── 404 ── */
  .not-found{text-align:center;padding:96px 0;}
  .not-found h1{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:var(--gold);margin-bottom:16px;}
  .not-found p{font-size:15px;color:var(--muted);margin-bottom:32px;}

  /* ── ANIMATIONS ── */
  .r{opacity:0;transform:translateY(18px);transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),transform 0.55s cubic-bezier(0.22,1,0.36,1);}
  .r.in{opacity:1;transform:none;}

  footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:32px;text-align:center;}
  footer p{font-size:12px;color:var(--muted);}
  footer a{color:var(--muted);transition:color 0.2s;}
  footer a:hover{color:var(--cream);}

  /* Reading progress bar */
  #reading-progress{position:fixed;top:56px;left:0;width:0%;height:2px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));z-index:199;transition:width 0.1s linear;pointer-events:none;}

  /* Light mode - character page specific card overrides */
  body.light-mode .section{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08),0 1px 3px rgba(30,60,100,0.05);}
  body.light-mode .section p{color:#1e2d4a;}
  body.light-mode .letter-block p{color:#1e2d4a;}
  body.light-mode .section-label{border-bottom-color:#b0bcd0;}
  body.light-mode .verdict{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08);}
  body.light-mode .fn-card{background:#e8eef6;border-color:#b0bcd0;box-shadow:0 1px 4px rgba(30,60,100,0.07);}
  body.light-mode .related-card{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08),0 1px 3px rgba(30,60,100,0.05);}
  body.light-mode .actor-chip,body.light-mode .universe-chip{background:#f0f3f8;border-color:#b0bcd0;}
  body.light-mode .tag{background:#e8eef6;border-color:#b0bcd0;}
</style>

}

function renderPage(){
  const ps=getPathSlug();
  if(!ps){renderNotFound();return;}
  const p=people.filter(Boolean).find(x=>slug(x.name)===ps);
  if(!p){renderNotFound();return;}

  // ── SEO meta ──
  const title=`Tipo de personalidad MBTI de ${p.name} (${p.type}) · 77 Scenarios`;
  const desc=`${p.name} es ${p.type}. ${p.desc.slice(0,150).trim()}…`;
  const url=`https://77scenarios.com/es/character/${ps}`;
  document.getElementById('page-title').textContent=title;
  document.getElementById('page-desc').setAttribute('content',desc);
  document.getElementById('page-kw').setAttribute('content',(p.kw||[]).join(', ')+`, tipo de personalidad ${p.type}, ${p.type} MBTI, funciones cognitivas ${p.type}`);
  document.getElementById('og-title').setAttribute('content',title);
  document.getElementById('og-desc').setAttribute('content',desc);
  document.getElementById('og-url').setAttribute('content',url);
  document.getElementById('canonical-url').setAttribute('href',url);
  const charImgUrl=`https://77scenarios.com/images/characters/${ps}.jpg`;
  document.querySelector('meta[property="og:image"]').setAttribute('content',charImgUrl);
  document.querySelector('meta[name="twitter:image"]').setAttribute('content',charImgUrl);

  // ── Schema ──
  const typeLabel = {'INTJ':'El Arquitecto','INTP':'El Lógico','ENTJ':'El Comandante','ENTP':'El Debater','INFJ':'El Abogado','INFP':'El Mediador','ENFJ':'El Protagonist','ENFP':'El Activista','ISTJ':'El Logista','ISFJ':'El Defensor','ESTJ':'El Ejecutivo','ESFJ':'El Cónsul','ISTP':'El Virtuoso','ISFP':'El Aventurero','ESTP':'El Emprendedor','ESFP':'El Animador'}[p.type]||p.type;
  const isFictional = ['Fiction','Film','Anime','Game','Animation'].includes(p.cat);
  const personType = isFictional ? 'Person' : (p.cat === 'Historical' ? 'Person' : 'Person');
  const schema={
    '@context':'https://schema.org',
    '@graph':[
      {
        '@type': personType,
        '@id': url + '#person',
        'name': p.name,
        'description': p.ctx,
        'image': charImgUrl,
        'url': url,
        'sameAs': [],
        'knowsAbout': [p.type, typeLabel, 'funciones cognitivas', 'tipo de personalidad MBTI']
      },
      {
        '@type':'Article',
        '@id': url + '#article',
        'headline': `${p.name} - Análisis de personalidad ${p.type}`,
        'description': desc,
        'image': charImgUrl,
        'url': url,
        'about': { '@id': url + '#person' },
        'author': {
          '@type': 'Organization',
          '@id': 'https://77scenarios.com/#organization',
          'name': '77 Scenarios',
          'url': 'https://77scenarios.com'
        },
        'keywords': (p.kw||[]).join(', '),
        'articleSection': 'Análisis de Tipo de Personalidad',
        'inLanguage': 'es',
        'dateModified': '2026-05-19T00:00:00+00:00',
        'publisher': {
          '@type': 'Organization',
          '@id': 'https://77scenarios.com/#organization',
          'name': '77 Scenarios',
          'url': 'https://77scenarios.com'
        },
        'isPartOf': { '@type': 'WebSite', '@id': 'https://77scenarios.com/#website' }
      },
      {
        '@type': 'BreadcrumbList',
        'itemListElement': [
          { '@type': 'ListItem', 'position': 1, 'name': 'Inicio',    'item': 'https://77scenarios.com/es/' },
          { '@type': 'ListItem', 'position': 2, 'name': 'Archivo', 'item': 'https://77scenarios.com/es/archive' },
          { '@type': 'ListItem', 'position': 3, 'name': p.cat,     'item': `https://77scenarios.com/es/archive?cat=${encodeURIComponent(p.cat)}` },
          { '@type': 'ListItem', 'position': 4, 'name': p.name,    'item': url }
        ]
      }
    ]
  };
  document.getElementById('page-schema').textContent=JSON.stringify(schema);

  // ── Functions ──
  const stack=fnStack[p.type]||{fns:[],labels:[]};
  const fnCardsHTML=stack.fns.map((fn,i)=>`
    <div class="fn-card${i===0?' dominant':''}">
      <div class="fn-label">${stack.labels[i]}</div>
      <div class="fn-name">${fn} <span style="font-family:'DM Sans';font-size:13px;color:var(--muted);font-weight:300;">${fnFullName[fn]||''}</span></div>
      <div class="fn-desc">${fnDesc[fn]||''}</div>
    </div>`).join('');

  // ── Related (same type, different entries) ──
  const related=people.filter(Boolean).filter(x=>x.type===p.type&&slug(x.name)!==ps).sort(()=>Math.random()-0.5).slice(0,6);
  const relatedHTML=related.map(r=>`
    <a class="related-card" href="/es/character/${slug(r.name)}">
      <div class="related-type">${r.type}</div>
      <div class="related-name">${r.name}</div>
      <div class="related-ctx">${r.ctx}</div>
    </a>`).join('');

  // ── Same universe characters ──
  const normCtx=c=>c.split('(')[0].split(',')[0].trim().toLowerCase();
  const universeChars=people.filter(Boolean).filter(x=>normCtx(x.ctx)===normCtx(p.ctx)&&slug(x.name)!==ps&&!x.knownFor&&!x.playedBy);
  const universeHTML=universeChars.length?`
    <div class="section-label" style="margin-bottom:12px;">También de ${p.ctx.split('(')[0].trim()}</div>
    <div class="universe-strip">
      ${universeChars.map(u=>`<a class="universe-chip" href="/es/character/${slug(u.name)}"><span class="universe-chip-type">${u.type}</span><span class="universe-chip-name">${u.name.split('/')[0].trim()}</span></a>`).join('')}
    </div>`:'';

  // ── Played by / Known for ──
  const playedByPerson=p.playedBy?people.filter(Boolean).find(x=>slug(x.name)===p.playedBy):null;
  const knownForChar=p.knownFor?people.filter(Boolean).find(x=>slug(x.name)===p.knownFor):null;
  const actorStripHTML=(playedByPerson||knownForChar)?`
    <div class="actor-strip">
      ${playedByPerson?`<a class="actor-chip" href="/es/character/${p.playedBy}"><span class="actor-chip-label">Interpretado por</span><span class="actor-chip-name">${playedByPerson.name} (${playedByPerson.type})</span></a>`:''}
      ${knownForChar?`<a class="actor-chip" href="/es/character/${p.knownFor}"><span class="actor-chip-label">Conocido por</span><span class="actor-chip-name">${knownForChar.name}</span></a>`:''}
    </div>`:'';

  // ── Avatar ──
  const avatarHTML=`<img class="hero-avatar" id="hero-avatar" alt="${p.name}" style="opacity:0;transition:opacity 0.3s;">`;

  // ── Keywords / tags ──
  const tagsHTML=(p.kw&&p.kw.length)?`<div class="tag-row">${p.kw.map(k=>`<span class="tag">${k}</span>`).join('')}</div>`:'';

  // ── Full body HTML ──
  document.getElementById('page-body').innerHTML=`
    <div class="breadcrumb r" data-d="0">
      <a href="/es/archive">Archivo</a>
      <span>/</span>
      <span>${p.cat}</span>
      <span>/</span>
      <span>${p.name}</span>
    </div>

    <div class="hero r" data-d="1">
      ${avatarHTML}
      <div class="hero-info">
        <div class="hero-type">${p.type}</div>
        <h1 class="hero-name">${p.name}</h1>
        <div class="hero-ctx">${p.ctx}</div>
        <span class="hero-cat-badge">${p.cat}</span>
      </div>
    </div>

    ${universeHTML?`<div class="r" data-d="1b">${universeHTML}</div>`:''}
    ${actorStripHTML?`<div class="r" data-d="1b2">${actorStripHTML}</div>`:''}


    <div class="verdict r" data-d="2">
      <div class="verdict-label">El veredicto</div>
      <p>${p.desc}</p>
    </div>

    <div class="section r" data-d="3">
      <div class="section-label">Quién es</div>
      <h2>${p.name} y la mente ${p.type}</h2>
      <p id="who-they-are-text">Cargando análisis detallado…</p>
    </div>

    <div class="section r" data-d="4">
      <div class="section-label">Pila de funciones cognitivas</div>
      <h2>Cómo procesa el mundo un ${p.type}</h2>
      <p>Cada ${p.type} opera a través de la misma jerarquía de funciones cognitivas. Así es como esa pila se refleja en la forma en que ${p.name} realmente piensa, decide y actúa.</p>
      <div class="fn-grid" style="margin-top:20px;">${fnCardsHTML}</div>
    </div>

    <div class="section r" data-d="5">
      <div class="section-label">La trayectoria</div>
      <h2 id="journey-heading">Historia, elecciones y tipo</h2>
      <p id="journey-text">Cargando análisis de la trayectoria…</p>
    </div>

    <div class="section r" data-d="5b" id="letters-section" style="display:none">
      <div class="section-label">Letra por letra</div>
      <h2 id="letters-heading">Desglosando el tipo</h2>
      <div id="letters-text"></div>
    </div>

    <div class="section r" data-d="6">
      <div class="section-label">¿Por qué no otro tipo?</div>
      <h2 id="mistype-heading">Argumentos comunes de tipificación errónea</h2>
      <p id="mistype-text">Cargando análisis de tipificación…</p>
    </div>

    <div class="section r" data-d="7">
      <div class="section-label">Acerca de ${p.type}</div>
      <h2>La personalidad ${p.type}</h2>
      <p>${typeDesc[p.type]||''}</p>
      <div style="margin-top:16px;">
        <a class="cta-btn" href="/es/type?t=${p.type}" style="display:inline-block;">Desglose completo de ${p.type} &#8594;</a>
      </div>
    </div>

    ${related.length?`
    <div class="section r" data-d="8">
      <div class="section-label">Mismo tipo</div>
      <h2>Otros personajes y figuras ${p.type}</h2>
      <div class="related-grid">${relatedHTML}</div>
    </div>`:''}

    ${tagsHTML?`<div class="r" data-d="9" style="margin-top:16px;">${tagsHTML}</div>`:''}

    <div class="cta-row r" data-d="10">
      <a class="cta-btn" href="/es/">Realizar el test &#8594;</a>
      <a class="cta-btn sec" href="/es/archive">Volver al archivo</a>
      <a class="cta-btn sec" href="/es/compatibility">Compatibilidad</a>
    </div>
  `;

  // ── Avatar lazy load (jpg → gif → wikipedia) ──
  {
    const jpgSrc=`/images/characters/${ps}.jpg`;
    const gifSrc=`/images/characters/${ps}.gif`;
    const img=document.getElementById('hero-avatar');

    function updateOgImage(src){
      const full=src.startsWith('http')?src:`https://77scenarios.com${src}`;
      const om=document.querySelector('meta[property="og:image"]');
      const tm=document.querySelector('meta[name="twitter:image"]');
      if(om)om.setAttribute('content',full);
      if(tm)tm.setAttribute('content',full);
      try{
        const s=JSON.parse(document.getElementById('page-schema').textContent);
        if(s['@graph']){const per=s['@graph'].find(n=>n['@id']&&n['@id'].endsWith('#person'));if(per){per.image=full;document.getElementById('page-schema').textContent=JSON.stringify(s);}}
      }catch(e){}
    }

    function tryWikipedia(){
      if(p.wiki){
        fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.wiki))
          .then(r=>r.ok?r.json():null)
          .then(data=>{
            const img2=document.getElementById('hero-avatar');
            if(!img2)return;
            const src=data&&data.thumbnail&&data.thumbnail.source;
            if(src){img2.src=src;img2.onload=function(){img2.style.opacity='1';};updateOgImage(src);}
            else{img2.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;}
          })
          .catch(()=>{
            const img2=document.getElementById('hero-avatar');
            if(img2)img2.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;
          });
      } else {
        img.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;
      }
    }

    if(img){
      const tryJpg=new Image();
      tryJpg.onload=function(){img.src=jpgSrc;img.onload=function(){img.style.opacity='1';};updateOgImage(jpgSrc);};
      tryJpg.onerror=function(){
        const tryGif=new Image();
        tryGif.onload=function(){img.src=gifSrc;img.onload=function(){img.style.opacity='1';};updateOgImage(gifSrc);};
        tryGif.onerror=function(){tryWikipedia();};
        tryGif.src=gifSrc;
      };
      tryJpg.src=jpgSrc;
    }
  }

  // ── Animate in ──
  requestAnimationFrame(()=>{
    document.querySelectorAll('.r').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('in'),i*60);
    });
  });

  // ── Load expanded AI content (deferred, non-blocking) ──
  loadExpandedContent(p);
}

/* ── EXPANDED CONTENT ──────────────────────────────────────────────
   Deterministic, character-aware content generation.
   Uses p.name, p.type, p.ctx, p.desc and per-type lookup tables
   to produce content that feels specific to this character and world,
   not just the generic MBTI type. Zero API calls, zero latency.
   ─────────────────────────────────────────────────────────────── */
function loadExpandedContent(p){
  const name=p.name.split('/')[0].trim();
  const type=p.type;
  const ctx=p.ctx||'their source material';
  const stack=fnStack[type]||{fns:['?','?','?','?'],labels:[]};
  const dom=stack.fns[0]||'?';
  const aux=stack.fns[1]||'?';
  const ter=stack.fns[2]||'?';
  const inf=stack.fns[3]||'?';
  const sl=p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

  /* ── Character-specific Journey + Mistype content ── */
  // Externalized to /data/char-content-{lang}.js

  /* ── Per-type: what this cognitive stack looks like in practice ── */
  const typeProfile={
    INTJ:`${name} operates from a private internal model that most people around them never fully see. The dominant function is Ni (Introverted Intuition) - a pattern-synthesis process that works beneath the surface, assembling observations into long-range convictions that arrive complete rather than argued. ${name} often knows where something is heading before anyone else does, and acts on that knowledge without needing to explain it, because the Ni process is not easily externalised. Te (Extraverted Thinking) as the auxiliary channels the vision into structure, systems, and decisive action: the model produces a plan, the plan produces results, and the results are evaluated against the model rather than against what anyone else expected. The result is a character who appears certain, independent, and difficult to redirect - because they usually are. The vulnerability is the inferior Se (Extraverted Sensing): ${name} can be blindsided by present-tense physical realities that the model did not account for, or become dangerously detached from the immediate world while living entirely inside the internal architecture.`,
    INTP:`${name}'s mind is a precision instrument. Ti (Introverted Thinking) is the dominant function - it builds rigorous internal logical frameworks that are more important to ${name} than external consensus, social approval, or received wisdom. The framework is primary; everything else is input to be tested against it. Ne (Extraverted Intuition) as the auxiliary generates the possibilities, alternatives, and angles that Ti then analyses with full rigour. The result is a character who is endlessly curious, genuinely difficult to satisfy with simple answers, and deeply uncomfortable with conclusions that cannot be fully justified. The inferior Fe (Extraverted Feeling) is the tell: in moments of stress or genuine depth, ${name} reveals a need for connection and acknowledgment that sits in visible tension with their usual detachment - the function they rarely use, suddenly making claims the dominant function is not equipped to address.`,
    ENTJ:`${name} leads by default - not from ego but from Te (Extraverted Thinking) dominant, the function that scans every situation for what needs to be organised, who is capable of doing it, and what system will produce the best outcome. Ni (Introverted Intuition) as the auxiliary provides the long-range vision that makes ${name}'s command more than mere management: they are moving toward something specific and comprehensive, and the people around them are expected to keep up. The combination produces a character who is strategically intelligent, visibly confident, and capable of building institutions that outlast their participation. The weakness is the inferior Fi (Introverted Feeling): ${name} can run roughshod over what people actually value and need, not from cruelty but from a genuine difficulty in weighting personal feeling as heavily as the strategic outcome the Te is optimising for.`,
    ENTP:`${name} runs on Ne (Extraverted Intuition) - the constant generation of angles, possibilities, arguments, and connections that nobody else has made yet. Every conversation is an opportunity to find the edge of an idea; every settled position is something to be tested against its own contradictions. Ti (Introverted Thinking) provides the analytical rigour that prevents ${name}'s ideas from being merely entertaining: the Ne generates the hypothesis, the Ti evaluates it, and the combination produces someone who is stimulating, intellectually formidable, and occasionally exhausting. The inferior Si (Introverted Sensing) is the shadow: ${name} can be remarkably bad at the mundane, the routine, and the past-as-reference - they prefer the next idea to the last commitment, and pay a recurring price for it.`,
    INFJ:`${name} holds two things simultaneously that most people cannot: a long-range vision of how things should be, and a precise sensitivity to how people actually feel right now. Ni (Introverted Intuition) is the dominant function - it works beneath the surface, synthesising observations and patterns into convictions that arrive complete and are difficult to dislodge once formed. Fe (Extraverted Feeling) is the auxiliary - it ensures that the vision is always held in relation to people, not just to abstract principles. The combination produces someone who is both visionary and deeply empathic, often to the point of exhaustion. The inferior Se (Extraverted Sensing) is where ${name} is most vulnerable: the immediate physical and present-tense reality can ambush them in ways the long-range pattern-recognition never modelled.`,
    INFP:`${name}'s inner life is the primary reality. Fi (Introverted Feeling) is the dominant function - a deeply personal value system that ${name} uses to evaluate everything, quietly and constantly. It is not visible on the surface, which is why ${name} is often misread as passive or vague: the intensity is entirely internal. Ne (Extraverted Intuition) as the auxiliary generates the possibilities, connections, and alternative framings that allow ${name} to imagine how things could be rather than just how they are. The inferior Te (Extraverted Thinking) is the consistent weak point: execution, structure, external accountability, and the translation of the interior vision into concrete outcomes are where ${name} loses ground and where growth, when it comes, is most visible.`,
    ENFJ:`${name} reads the room before entering it. Fe (Extraverted Feeling) is the dominant function - a social and emotional attunement so precise that ${name} often knows what people need before those people can articulate it themselves. Ni (Introverted Intuition) as the auxiliary means this attunement is strategic as well as empathic: ${name} is working toward something specific, and the warmth is both genuine and directional. The result is a character who is inspiring, relationally perceptive, and capable of moving groups toward shared vision. The inferior Ti (Introverted Thinking) is the weak spot: ${name} can be remarkably inconsistent in their internal logic, rationalising decisions that are primarily emotional, and becoming defensive when those rationalisations are closely examined.`,
    ENFP:`${name} is driven by Ne (Extraverted Intuition) - a perpetual enthusiasm for what could be, what connections nobody else has made yet, and what possibilities the current moment contains. Fi (Introverted Feeling) as the auxiliary anchors this in genuine personal values: ${name} is not merely interested in possibilities - they care about which ones actually matter. The result is a character who is warm, creatively generative, and capable of real depth - but who struggles with the gap between enthusiasm and follow-through, and between the vision and the structure required to realise it. The inferior Si (Introverted Sensing) is the recurring liability: ${name} tends to undervalue the past, the established, the routine, and the accumulated - and pays for it regularly.`,
    ISTJ:`${name} is built around Si (Introverted Sensing) - a comprehensive internal library of accumulated experience, precedent, and established procedure. What has worked before is the most reliable guide to what will work now, and ${name} trusts that library above almost anything else. Te (Extraverted Thinking) as the auxiliary translates this into clear action: defined duties, measurable expectations, and unambiguous accountability. The result is someone who is reliable, thorough, and deeply trustworthy - the person who will still be there when everyone else has moved on. The inferior Ne (Extraverted Intuition) is where ${name} is least comfortable: in the face of novelty, ambiguity, and change, they can become rigid or catastrophise in ways that seem disproportionate to outside observers.`,
    ISFJ:`${name} is oriented toward the people in their world with a consistency that can be invisible precisely because it never stops. Si (Introverted Sensing) as the dominant function means ${name} maintains detailed internal records of what people need, what they have been promised, and what the established norms of care require. Fe (Extraverted Feeling) as the auxiliary directs all of this outward into accommodation, attentiveness, and the maintenance of harmony. The result is someone whose care is structural rather than performed - available before it is needed, sustained long after it has been acknowledged. The inferior Ne (Extraverted Intuition) is where the shadow lives: ${name} can catastrophise about future possibilities, resist change beyond what is necessary, or accommodate to the point of self-erasure when the Ne cannot generate alternatives.`,
    ESTJ:`${name} imposes structure on every situation they enter - not from a desire for control but because Te (Extraverted Thinking) dominant cannot function efficiently in disorder. Si (Introverted Sensing) as the auxiliary grounds the organisation in precedent: ${name} does not reinvent the wheel; they apply what has been proven to work, improve it where necessary, and maintain it against the entropy that constant revision introduces. The result is someone who is reliable, effective, and sometimes inflexible in the specific way that any system tuned for reliability becomes inflexible. The inferior Fi (Introverted Feeling) is what ${name} most struggles to access: personal values, individual exceptions, and the full weight of how someone actually feels rather than what they should do in the given situation.`,
    ESFJ:`${name} holds the social fabric of their world together through relational attentiveness that never fully turns off. Fe (Extraverted Feeling) is the dominant function - ${name} is continuously reading the emotional register of every situation and adjusting their behaviour accordingly. Si (Introverted Sensing) as the auxiliary grounds this attunement in continuity: ${name} honours what was promised, values tradition, and maintains the norms of care because those norms are what make people feel held and safe. The inferior Ti (Introverted Thinking) is the consistent weak point: internal logical consistency is not ${name}'s primary concern, and they can be genuinely surprised - and defensive - when the reasoning that produced a caring action is examined too closely.`,
    ISTP:`${name} thinks in systems and acts in the physical world. Ti (Introverted Thinking) is the dominant function - a precise internal logical framework that ${name} builds and refines constantly, usually in silence. Se (Extraverted Sensing) as the auxiliary means this framework is always in contact with concrete reality: ${name} is not a theorist but someone who applies their logic to what is actually happening right now, with their hands or their body or both. The inferior Fe (Extraverted Feeling) is where ${name} is most exposed: emotional situations, vulnerability, the social register of a room - these require a function they rarely use, and the rarity shows in the moments when it is needed.`,
    ISFP:`${name} acts from personal feeling in the present moment. Fi (Introverted Feeling) is the dominant function - a deep, private value system that ${name} does not usually articulate but consistently acts from. Se (Extraverted Sensing) as the auxiliary means the feeling is always grounded in the immediate, physical, real world: ${name} is not abstract or theoretical about what matters, they are present-tense about it in a way that produces actions that are direct, embodied, and often impossible to fully explain. The inferior Te (Extraverted Thinking) is the tell: external structure, long-range planning, and the kind of systematic accountability that other types find natural are where ${name} consistently loses ground.`,
    ESTP:`${name} reads the immediate situation faster than anyone around them. Se (Extraverted Sensing) is the dominant function - full, alert engagement with what is actually happening right now, processed and acted upon before most people have finished assessing. Ti (Introverted Thinking) as the auxiliary provides the analytical precision that makes ${name} more than merely reactive: they are quick, they are precise, and they are operating with a logical framework that the speed makes invisible. The inferior Ni (Introverted Intuition) is the consistent blind spot: long-range consequences, patterns that only emerge over time, and the shape of things years from now are where ${name} most reliably underestimates.`,
    ESFP:`${name} is entirely present. Se (Extraverted Sensing) is the dominant function - ${name} engages with the immediate world with more openness and less defensiveness than almost any other type. Fi (Introverted Feeling) as the auxiliary means this engagement is grounded in genuine personal warmth: ${name} cares, and the caring is visible and specific rather than performed. The inferior Ni (Introverted Intuition) is where ${name} struggles most: long-range vision, abstract patterns that haven't yet manifested, and consequences that are not yet visible are the domains where ${name} is most likely to be genuinely blindsided.`,
  };

  /* ── Per-type: common mistypes with character-specific framing ── */
  const mistypeProfile={
    INTJ:{alt:'INFJ or ENTJ',conf:`${name} can appear to have INFJ's private depth or ENTJ's commanding external drive`,tell:`the decisive evidence is the Te-Ni axis: ${name}'s judgments are systematic and results-oriented, not primarily relational (which would indicate INFJ's Fe) or grounded in present-tense sensory data. The private vision runs ahead of the action, which is Ni-Te and not the other way around`},
    INTP:{alt:'INTJ or INFP',conf:`${name} can seem as directed as an INTJ or as values-anchored as an INFP`,tell:`Ti dominant is the decisive marker: the framework ${name} builds is internally consistent first, and only secondarily concerned with external execution or personal feeling. INTJ drives toward a vision; INFP acts from values; ${name} is constructing a logical architecture that neither fully describes`},
    ENTJ:{alt:'INTJ or ESTJ',conf:`${name} can appear as strategically private as an INTJ or as procedurally reliable as an ESTJ`,tell:`Te dominant running outward is the key: ${name}'s energy is directed toward organising the external world, not inward toward refining a private model (INTJ) or backward toward established procedure (ESTJ). The external organisation is primary from the start`},
    ENTP:{alt:'ENFP or INTJ',conf:`${name} can seem as warm and idealistic as an ENFP or as strategically certain as an INTJ`,tell:`Ne dominant is the signature: ${name}'s primary mode is generating angles, arguments, and possibilities - not leading with personal values (ENFP's Fi leads) or converging on a single comprehensive vision (INTJ's Ni converges). The exploration is primary`},
    INFJ:{alt:'INFP or INTJ',conf:`${name} can seem as deeply personal as an INFP or as strategically withdrawn as an INTJ`,tell:`Ni-Fe is the decisive combination: the vision is always held in relation to people, which is what separates INFJ from INTJ's Te-driven execution and INFP's purely personal Fi. The intuition is oriented through empathy, not away from it`},
    INFP:{alt:'ISFP or INFJ',conf:`${name} can seem as physically present and instinct-driven as an ISFP or as quietly visionary as an INFJ`,tell:`Fi-Ne is the tell: the values are internal and personal, and the perception is possibility-based and future-facing. ISFP's Fi pairs with present-tense Se, not with Ne's abstract imagination; INFJ synthesises and converges rather than exploring alternatives`},
    ENFJ:{alt:'INFJ or ENFP',conf:`${name} can seem as privately visionary as an INFJ or as enthusiastically possibility-focused as an ENFP`,tell:`Fe dominant running outward is the key: the primary orientation is toward the emotional reality of other people in real time - INFJ leads with private Ni, ENFP leads with idea-generating Ne. The social attunement is primary, not secondary`},
    ENFP:{alt:'ENTP or INFP',conf:`${name} can seem as argument-driven as an ENTP or as values-anchored as an INFP`,tell:`Ne-Fi is the signature pairing: ${name} generates possibilities (Ne) anchored in personal warmth and values (Fi) - ENTP pairs Ne with Ti for analysis, INFP reverses the order with Fi dominant. The warmth and the idealism are both genuine and both present`},
    ISTJ:{alt:'ISFJ or INTJ',conf:`${name} can seem as quietly caring as an ISFJ or as strategically far-sighted as an INTJ`,tell:`Si-Te is the decisive axis: the primary reference is accumulated experience and established procedure, directed toward external results - ISFJ's Te is replaced by Fe (warmth-oriented), INTJ's Si is replaced by Ni (vision-oriented). The reliability is grounded in precedent, not feeling or vision`},
    ISFJ:{alt:'ISTJ or INFJ',conf:`${name} can seem as procedurally reliable as an ISTJ or as quietly perceptive as an INFJ`,tell:`Si-Fe is the combination that settles it: the orientation toward people runs through the lens of established norms and accumulated care - ISTJ's Fe is replaced by Te (results-oriented), INFJ leads with Ni not Si. The care is grounded in the accumulated record, not in strategic vision`},
    ESTJ:{alt:'ENTJ or ISTJ',conf:`${name} can seem as strategically ambitious as an ENTJ or as quietly dutiful as an ISTJ`,tell:`Te-Si is the diagnostic: external organisation grounded in precedent - ENTJ's Si is replaced by Ni (vision-driven), ISTJ's Te is auxiliary not dominant, meaning ${name} initiates structure where ISTJ maintains existing structure`},
    ESFJ:{alt:'ENFJ or ISFJ',conf:`${name} can seem as charismatically relational as an ENFJ or as quietly devoted as an ISFJ`,tell:`Fe-Si is the combination: social attunement grounded in established norms and continuity - ENFJ's Si is replaced by Ni (strategic vision), ISFJ's Fe is auxiliary not dominant, so ${name} leads outward relationally where ISFJ works within existing relational structures`},
    ISTP:{alt:'ISTJ or ESTP',conf:`${name} can seem as duty-oriented as an ISTJ or as boldly action-first as an ESTP`,tell:`Ti-Se is the tell: the internal logical framework is the engine and Se is what keeps it in contact with reality - ISTJ leads with Si (precedent-based), ESTP reverses the order with Se dominant and Ti auxiliary. The framework comes first; the physical engagement serves it`},
    ISFP:{alt:'INFP or ISTP',conf:`${name} can seem as idea-driven as an INFP or as physically tactical as an ISTP`,tell:`Fi-Se is the combination: the values are present-tense and embodied, not abstract and future-facing (INFP's Ne) - and the physical engagement is in service of feeling rather than logical analysis (ISTP's Ti). The body and the value are the same expression`},
    ESTP:{alt:'ENTP or ISTP',conf:`${name} can seem as conceptually sharp as an ENTP or as internally framework-focused as an ISTP`,tell:`Se dominant is what settles it: the primary engagement is with the immediate physical reality, read and acted upon in real time - ENTP leads with Ne (ideas and possibilities), ISTP reverses the order with Ti primary and Se secondary. The situational reading is primary`},
    ESFP:{alt:'ENFP or ESTP',conf:`${name} can seem as idea-focused as an ENFP or as tactically sharp as an ESTP`,tell:`Se-Fi is the signature: dominant engagement is physical and present-tense, anchored not by logic (ESTP's Ti) or abstract possibility (ENFP's Ne) but by genuine personal warmth in the immediate moment. The presence and the warmth arrive together`},
  };

  const tp=typeProfile[type]||`${name} opera a través de la pila de funciones cognitivas de ${type}, con ${dom} (${fnFullName[dom]}) como el motor de cada decisión importante.`;
  const mt=mistypeProfile[type]||{alt:'otros tipos',conf:`los comportamientos superficiales pueden apuntar a otra parte`,tell:`la pila completa de funciones, examinada a lo largo de los momentos definitorios de ${name}, es lo que determina el tipo`};
  const cc=charContent[sl];

  // ── Who They Are ──
  const whoEl=document.getElementById('who-they-are-text');
  if(whoEl) whoEl.outerHTML=`
    <p>${name} es ${type}. El tipo está definido por una jerarquía de funciones cognitivas; no por una lista de rasgos, sino por una pila ordenada de procesos mentales que determina cómo alguien percibe el mundo y toma decisiones. Para ${name}, esa pila está liderada por ${dom} (${fnFullName[dom]}) y respaldada por ${aux} (${fnFullName[aux]}). Comprender ese orden explica no solo qué hace ${name}, sino por qué, y cómo responde bajo presión, en sus relaciones y en los puntos de inflexión de su historia.</p>
    <p>${tp}</p>
    <p>Lo que hace de ${name} un ejemplo convincente de ${type} no es que demuestre cada elemento de la descripción del tipo, sino que la pila de funciones se mantiene bajo presión. En los momentos que definen su historia en ${ctx} (las decisiones bajo estrés, los fallos de juicio, los raros momentos de crecimiento genuino), el patrón es consistente. La función dominante es a lo que ${name} recurre primero. La función inferior es la que le toma por sorpresa.</p>
  `;

  // ── Journey ──
  const journeyEl=document.getElementById('journey-text');
  const journeyH=document.getElementById('journey-heading');
  if(journeyH) journeyH.textContent=`${name}: Lo que explica el perfil de ${type}`;
  if(journeyEl){
    if(cc&&cc.journey){
      journeyEl.outerHTML=`<div id="journey-text">${cc.journey}</div>`;
    } else {
      journeyEl.outerHTML=`
        <p>En ${ctx}, el perfil de ${type} de ${name} no es incidental para la historia: es la arquitectura de cada decisión importante que toma. La función dominante ${dom} (${fnFullName[dom]}) es en la que ${name} más confía y a la que recurre primero. Es la fuente de su competencia característica, la razón por la que es eficaz cuando lo es, y la función que define cómo aborda cada situación que importa.</p>
        <p>La función inferior, ${inf} (${fnFullName[inf]}), es la otra cara de esa moneda. Es la función menos desarrollada en la pila de ${name}: la que surge bajo estrés, en momentos de vulnerabilidad genuina o en los puntos de inflexión de su historia donde la competencia que proporciona la función dominante es de repente insuficiente. Donde ${name} falla, donde se sorprende, donde está genuinamente fuera de su elemento: esos momentos casi siempre involucran a la función inferior rompiendo la estructura que normalmente la contiene.</p>
        <p>La función terciaria, ${ter} (${fnFullName[ter]}), opera en segundo plano. Es lo que ${name} utiliza cuando la dominante está bajo tensión: un soporte parcial que puede hacerle parecer un tipo diferente para los observadores casuales. La aparente flexibilidad, la calidez ocasional o la estructura que parece fuera de lugar: eso es la función terciaria en acción. Reconocerla como terciaria en lugar de dominante es parte de leer correctamente la pila de funciones a lo largo de todo el arco de ${name} en ${ctx}.</p>
      `;
    }
  }

  // ── Mistype ──
  /* ── Letter breakdown section ── */
  const lettersSection=document.getElementById('letters-section');
  const lettersEl=document.getElementById('letters-text');
  const lettersH=document.getElementById('letters-heading');
  if(cc&&cc.letters&&lettersSection&&lettersEl){
    lettersSection.style.display='';
    if(lettersH) lettersH.textContent=`${name}: ${type} Letra por Letra`;
    lettersEl.innerHTML=cc.letters;
  } else if(lettersSection){
    lettersSection.style.display='none';
  }

  const mistypeEl=document.getElementById('mistype-text');
  const mistypeH=document.getElementById('mistype-heading');
  if(mistypeH) mistypeH.textContent=`Por qué ${name} es ${type}, no ${mt.alt}`;
  if(mistypeEl){
    if(cc&&cc.mistype){
      mistypeEl.outerHTML=`<div id="mistype-text">${cc.mistype}</div>`;
    } else {
      mistypeEl.outerHTML=`
        <p>${name} a veces es clasificado como ${mt.alt}. La confusión es comprensible: ${mt.conf}. Pero la correspondencia superficial de rasgos es cómo se acumulan los errores de tipificación. La pila de funciones cognitivas es lo que los resuelve.</p>
        <p>El diagnóstico clave es la función dominante. Para ${name}, esa es ${dom} (${fnFullName[dom]}). Cada decisión importante en la historia de ${name} en ${ctx} se puede rastrear hasta esta función ejecutándose primero: la confianza, los puntos ciegos característicos, la textura específica de cómo ${name} tiene éxito y cómo falla. El patrón se asigna consistentemente a una pila liderada por ${dom}, no a las alternativas.</p>
        <p>La evidencia decisiva: ${mt.tell}. Una vez que sigues el comportamiento de ${name} no a través de momentos casuales, sino a través de sus momentos definitorios (las decisiones de mayor importancia, las fallas más características, los instintos que surgen bajo una presión genuina), la lectura de ${type} es consistente, y las lecturas alternativas requieren descartar demasiado de lo que realmente está allí.</p>
      `;
    }
  }
}

function renderNotFound(){
  document.getElementById('page-body').innerHTML=`
    <div class="not-found r">
      <h1>404</h1>
      <p>No se encontró ningún personaje en esta URL. Es posible que haya sido renombrado o eliminado.</p>
      <a class="cta-btn" href="/es/archive">Explorar el archivo</a>
    </div>`;
  requestAnimationFrame(()=>document.querySelector('.not-found')?.classList.add('in'));
}

// ── Page transition ──
window.addEventListener('DOMContentLoaded',()=>{
  renderPage();
  const ov=document.getElementById('t-overlay');
  if(ov){requestAnimationFrame(()=>{ov.style.transition='opacity 0.45s ease';ov.style.opacity='0';});}
});

// ── Intercept internal links for smooth transition ──
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const href=a.getAttribute('href');
  if(!href||href.startsWith('http')||href.startsWith('#')||href.startsWith('mailto:'))return;
  e.preventDefault();
  const ov=document.getElementById('t-overlay');
  if(ov){ov.style.transition='opacity 0.3s ease';ov.style.opacity='1';}
  setTimeout(()=>window.location.href=href,300);
});
</script>
<script>
(function(){
  var bar = document.getElementById('reading-progress');
  if(!bar) return;
  window.addEventListener('scroll', function(){
    var doc = document.documentElement;
    var pct = doc.scrollHeight <= doc.clientHeight ? 0 : (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
    bar.style.width = Math.min(100, pct) + '%';
  }, {passive:true});
})();
</script>
