<script>
const ov=document.getElementById('t-overlay');
function fadeIn(){ov.style.opacity='1';ov.animate([{opacity:1},{opacity:0}],{duration:550,delay:60,easing:'cubic-bezier(0.22,1,0.36,1)',fill:'forwards'});}
fadeIn();
window.addEventListener('pageshow',e=>{if(e.persisted)fadeIn();});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const h=a.getAttribute('href');
  if(!h||h.startsWith('#')||h.startsWith('http')||h.startsWith('javascript')||h.startsWith('mailto'))return;
  e.preventDefault();
  ov.animate([{opacity:0},{opacity:1}],{duration:320,easing:'cubic-bezier(0.76,0,0.24,1)',fill:'forwards'}).finished.then(()=>{window.location.href=h;});
});
const obs=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(!en.isIntersecting)return;
    setTimeout(()=>en.target.classList.add('in'),parseFloat(en.target.dataset.d||0)*80);
    obs.unobserve(en.target);
  });
},{threshold:0.155});
document.querySelectorAll('.r').forEach(el=>obs.observe(el));
</script>

function renderDetail(d){
  if(!d) return '';
  let html = '';
  if(d.description) html += `<div class="rp-intro">${esc(d.description)}</div>`;
  if(d.rarity != null) html += `<div><span class="rp-rarity">${d.rarity<=4?'Raro &middot; ':''}~${esc(d.rarity)}% de las personas comparten este tipo</span></div>`;
  if(Array.isArray(d.stack) && d.stack.length){
    html += `<div class="rp-section"><div class="rp-label">Cómo está cableada esta mente</div>`;
    html += d.stack.map((s,i)=>{
      const c = (i<2 && s.count>0) ? `<div class="rp-fn-count">Activado ${esc(s.count)} ${s.count===1?'vez':'veces'} en este test</div>` : '';
      return `<div class="rp-fn-row"><div class="rp-fn-rank">${esc(s.rank)}</div><div><div class="rp-fn-name">${esc(s.name)}<span>${esc(s.fn)}</span></div><div class="rp-fn-desc">${esc(s.desc)}</div>${c}</div></div>`;
    }).join('');
    html += `</div>`;
  }
  if(Array.isArray(d.moments) && d.moments.length){
    html += `<div class="rp-section"><div class="rp-label">Momentos definitorios${d.modeLabel?' &middot; '+esc(d.modeLabel):''}</div>`;
    html += d.moments.map(m=>{
      const read = m.fn ? `Ese instinto es <b>${esc(m.fnName)} (${esc(m.fn)})</b> &mdash; ${esc(m.fnDesc)}.` : '';
      return `<div class="rp-moment"><div class="rp-moment-scene">${esc(m.scene||'A moment')}</div><div class="rp-moment-choice">&ldquo;${esc(m.choice)}&rdquo;</div>${read?`<div class="rp-moment-read">${read}</div>`:''}</div>`;
    }).join('');
    html += `</div>`;
  }
  if(Array.isArray(d.neighbours) && d.neighbours.length){
    html += `<div class="rp-section"><div class="rp-label">Tus tipos vecinos más cercanos</div>`;
    html += d.neighbours.map(n=>`<a class="rp-neighbour" href="${esc(n.href)}"><div><div class="rp-neighbour-ax">${esc(n.axisLabel)} &middot; ${esc(n.pct)}%</div><div class="rp-neighbour-txt">Cómo divergen <b>${esc(n.type)}</b> y <b>${esc(n.neighbour)}</b></div></div><div class="rp-neighbour-arrow">&rarr;</div></a>`).join('');
    html += `</div>`;
  }
  return html;
}

function toggleDetail(btn){
  const panel = btn.nextElementSibling;
  if(!panel) return;
  const open = panel.style.display === 'block';
  panel.style.display = open ? 'none' : 'block';
  btn.classList.toggle('open', !open);
  const lbl = btn.querySelector('.lbl');
  if(lbl) lbl.textContent = open ? 'Desglose completo' : 'Ocultar desglose';
}

function renderCard(r) {
  const ep = pct(r.ei_e, r.ei_i);
  const sp = pct(r.sn_s, r.sn_n);
  const tp = pct(r.tf_t, r.tf_f);
  const jp = pct(r.jp_j, r.jp_p);
  const t = r.personality_type;
  const detailHtml = r.details ? renderDetail(r.details) : '';
  const expand = detailHtml
    ? `<button class="result-expand" onclick="toggleDetail(this)"><span class="chev">&#9662;</span><span class="lbl">Full breakdown</span></button><div class="rp-detail" style="display:none">${detailHtml}</div>`
    : '';
  return `
    <div class="result-card">
      <div>
        <div class="result-type">${t}</div>
        <div class="result-meta">${typeNames[t] || ''} &nbsp;·&nbsp; ${fmt(r.created_at)}</div>
      </div>
      <div class="result-bars">
        <div class="bar-row">
          <div class="bar-letters"><span>E</span><span>I</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${ep}%"></div></div>
          <span>${ep}%</span>
        </div>
        <div class="bar-row">
          <div class="bar-letters"><span>S</span><span>N</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${sp}%"></div></div>
          <span>${sp}%</span>
        </div>
        <div class="bar-row">
          <div class="bar-letters"><span>T</span><span>F</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${tp}%"></div></div>
          <span>${tp}%</span>
        </div>
        <div class="bar-row">
          <div class="bar-letters"><span>J</span><span>P</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${jp}%"></div></div>
          <span>${jp}%</span>
        </div>
      </div>
      <a class="result-link" href="/es/type?t=${t.toLowerCase()}">Ver perfil de ${t} →</a>
      <div class="result-ctas">
        <a class="result-cta-btn" href="/es/archive?q=${t}">Personajes ${t} →</a>
        <a class="result-cta-btn" href="/es/compatibility">Compatibilidad →</a>
        <a class="result-cta-btn" href="/es/">Repetir test →</a>
      </div>
      ${expand}
    </div>`;
}

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/es/login'; return; }
  document.getElementById('profile-email').textContent = session.user.email;
  // Load avatar + username
  const { data: profile } = await sb.from('profiles').select('username, avatar_url').eq('id', session.user.id).single();
  const avatarEl = document.getElementById('profile-avatar');
  const usernameEl = document.getElementById('profile-username');
  if (profile) {
    avatarEl.src = profile.avatar_url || 'https://77scenarios.com/og-image.png';
    if (profile.username) usernameEl.textContent = '@' + profile.username;
  } else {
    avatarEl.src = 'https://77scenarios.com/og-image.png';
  }
  const { data: results, error } = await sb
    .from('results')
    .select('*')
    .eq('user_id', session.user.id)
    .order('created_at', { ascending: false });
  const container = document.getElementById('results-container');
  if (error || !results || results.length === 0) {
    container.innerHTML = `<div class="results-empty">Aún no tienes resultados guardados.<br><a href="/es/">Hacer el test →</a></div>`;
    return;
  }
  container.innerHTML = results.map(renderCard).join('');
}

async function handleSignOut() {
  await sb.auth.signOut();
  window.location.href = '/es/';
}

load();
</script>
