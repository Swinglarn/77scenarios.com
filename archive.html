<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" id="modal"><button class="modal-close" onclick="closeModalDirect()">&#10005;</button><div id="modal-content"></div></div>
</div>
<script>
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

var people = []; // Externalized to /data/characters-{lang}.js;

const categories=['All','Historical','Politics','Business','Science','Music','Arts','Film','Sport','Fiction','Actors'];
const types16=['INFP','ENFP','INFJ','ENFJ','INTJ','ENTJ','INTP','ENTP','ISFP','ESFP','ISTP','ESTP','ISFJ','ESFJ','ISTJ','ESTJ'];

let activeCategory='All', activeType=null, currentModal=null;

function checkURLParam(){
  const params=new URLSearchParams(window.location.search);
  const q=params.get('q');
  const p=params.get('p');
  if(!p) return;
  const found=people.find(x=>slug(x.name)===p);
  if(!found) return;
  const title=`${found.name} MBTI Personality Type (${found.type}) · 77 Scenarios`;
  const desc=`What is ${found.name}'s MBTI personality type? ${found.name} is ${found.type}. ${found.desc.slice(0,140)}...`;
  document.getElementById('page-title').textContent=title;
  document.getElementById('page-desc').setAttribute('content',desc);
  document.getElementById('og-title').setAttribute('content',title);
  document.getElementById('og-desc').setAttribute('content',desc);
  document.getElementById('og-url').setAttribute('content',`https://77scenarios.com/archive?p=${p}`);
  document.getElementById('canonical-url').setAttribute('href',`https://77scenarios.com/archive?p=${p}`);
  const charUrl=`https://77scenarios.com/character/${slug(found.name)}`;
  document.getElementById('canonical-url').setAttribute('href', charUrl);
  document.getElementById('og-url').setAttribute('content', charUrl);
  document.getElementById('page-schema').textContent=JSON.stringify({
    "@context":"https://schema.org","@type":"ProfilePage",
    "name":title,"description":desc,
    "url":charUrl,
    "mainEntity":{"@type":"Person","name":found.name,"description":found.ctx},
    "publisher":{"@type":"Organization","name":"77 Scenarios","url":"https://77scenarios.com"}
  });
  window.location.replace(charUrl);
}

function buildCatFilters(){
  const wrap=document.getElementById('cat-filters');
  categories.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='filter-btn'+(c==='All'?' active':'');
    btn.textContent=c;
    btn.onclick=()=>{
      activeCategory=c;
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    wrap.appendChild(btn);
  });
}

function buildTypeFilters(){
  const wrap=document.getElementById('type-filters');
  const all=document.createElement('button');
  all.className='type-btn active'; all.id='type-all-btn'; all.textContent='All Types';
  all.onclick=()=>{activeType=null;document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));all.classList.add('active');render();};
  wrap.appendChild(all);
  types16.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='type-btn'; btn.textContent=t;
    btn.onclick=()=>{
      activeType=activeType===t?null:t;
      document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
      if(activeType) btn.classList.add('active');
      else document.getElementById('type-all-btn').classList.add('active');
      render();
    };
    wrap.appendChild(btn);
  });
}

function filtered(){
  return people.filter(p=>{
    const matchCat=activeCategory==='All'||p.cat===activeCategory;
    const matchType=!activeType||p.type===activeType;
    return matchCat&&matchType;
  });
}

function render(){
  const results=filtered();
  const tags=[];
  if(activeCategory!=='All') tags.push(activeCategory);
  if(activeType) tags.push(activeType);
  const tagsHtml=tags.length
    ? `<span class="results-info-filters">${tags.map(t=>`<span class="results-info-tag">${t}</span>`).join('')}</span>`
    : '';
  document.getElementById('results-info').innerHTML=
    `<span class="results-info-count">${results.length} ${results.length===1?'entry':'entries'}</span>${tagsHtml}`;
  const grid=document.getElementById('db-grid');
  grid.innerHTML='';
  if(!results.length){
    grid.innerHTML=`<div class="empty-state">No results for <em>"${query}"</em>.<br>Try a different name, type, or clear the filters.</div>`;
    return;
  }
  results.forEach(p=>{
    const card=document.createElement('a');
    card.className='db-card';
    card.href='/character/'+slug(p.name);
    card.innerHTML=`<div class="db-card-type">${p.type}</div><div class="db-card-name">${p.name}</div><div class="db-card-ctx">${p.ctx}</div><div class="db-card-cat">${p.cat}</div>`;
    card.addEventListener('click', e => { e.preventDefault(); const ov=document.getElementById('t-overlay'); if(ov){ov.style.transition='opacity 0.3s ease';ov.style.opacity='1';} setTimeout(()=>window.location.href=card.href,280); });
    grid.appendChild(card);
  });
}

function openModal(p){
  currentModal=p;
  const ps=slug(p.name);
  document.getElementById('modal-content').innerHTML=`
    <div class="modal-header-row">
      ${p.wiki?`<img id="modal-avatar" class="modal-avatar" alt="${p.name}" loading="lazy">`:''}
      <div class="modal-header-info">
        <div class="modal-type">${p.type}</div>
        <div class="modal-name">${p.name}</div>
        <div class="modal-ctx">${p.ctx} · ${p.cat}</div>
      </div>
    </div>
    <div class="modal-desc">${p.desc}</div>
    ${p.kw&&p.kw.length?`<div class="modal-tags">${p.kw.map(k=>`<span class="modal-tag">${k}</span>`).join('')}</div>`:''}
    <div class="modal-actions">
      <button class="modal-btn" onclick="window.location='/type?t=${p.type}'">About ${p.type} \u2192</button>
      <button class="modal-btn sec" onclick="window.location='/compatibility'">Compatibility \u2192</button>
      <button class="modal-share" onclick="shareEntry('${ps}','${p.name.replace(/'/g,"\\'")}','${p.type}')">Share \u2197</button>
    </div>`;
  history.replaceState(null,'',`/archive?p=${ps}`);
  document.getElementById('modal-bg').classList.add('open');
  document.body.style.overflow='hidden';
  if(p.wiki){
    fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.wiki))
      .then(r=>r.ok?r.json():null)
      .then(data=>{
        const img=document.getElementById('modal-avatar');
        if(!img)return;
        const src=data&&data.thumbnail&&data.thumbnail.source;
        if(src){img.src=src;img.onload=function(){img.classList.add('loaded');};}
        else{img.style.display='none';}
      })
      .catch(function(){
        const img=document.getElementById('modal-avatar');
        if(img)img.style.display='none';
      });
  }
}
function shareEntry(ps,name,type){
  const url=`https://77scenarios.com/archive?p=${ps}`;
  if(navigator.share){navigator.share({title:`${name} is ${type}`,url}).catch(()=>{});}
  else{navigator.clipboard.writeText(url).then(()=>alert('Link copied!')).catch(()=>{});}
}

function closeModal(e){if(e.target===document.getElementById('modal-bg'))closeModalDirect();}
function closeModalDirect(){
  document.getElementById('modal-bg').classList.remove('open');
  document.body.style.overflow='';
  history.replaceState(null,'','/archive');
  currentModal=null;
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalDirect();});

const obs=new IntersectionObserver(en=>{
  en.forEach(e=>{if(e.isIntersecting){setTimeout(()=>e.target.classList.add('in'),parseFloat(e.target.dataset.d||0)*80);obs.unobserve(e.target);}});
},{threshold:0.12});
document.querySelectorAll('.r').forEach(el=>obs.observe(el));

  if(!href||href.startsWith('#')||href.startsWith('mailto')||a.target==='_blank')return;
  if(href.startsWith('http')&&!href.includes('77scenarios.com'))return;

  ov.animate([{opacity:0},{opacity:1}],{duration:300,easing:'ease-in',fill:'forwards'}).onfinish=()=>{window.location=href;};
});
