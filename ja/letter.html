<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0c0e10;--surface:#13161a;--surface2:#1a1e24;--gold:#c9a84c;--gold-dim:#8a6d2e;--cream:#ede8df;--muted:#ccc6bf;--border:#252a30;--radius:14px;}

  #t-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#0c0e10;opacity:1;}

  .glow-2{width:400px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(120,180,160,0.05) 0%,transparent 70%);}
  main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:64px 32px 96px;}

  /* REVEAL */

  .back-link{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:48px;transition:color 0.2s;}

  .hero{display:flex;align-items:flex-end;gap:24px;margin-bottom:48px;flex-wrap:wrap;}
  .hero-letter{font-family:'Cormorant Garamond',serif;font-size:clamp(110px,18vw,160px);font-weight:300;line-height:1;color:var(--gold);letter-spacing:-0.05em;}

  .hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4.5vw,46px);font-weight:300;color:var(--cream);line-height:1.1;margin-bottom:8px;}
  .hero-opp{font-size:17px;color:var(--muted);}
  .hero-opp a{color:var(--gold);text-decoration:none;}

  /* ── Per-letter hero letter color ── */
  body[data-letter="e"] .hero-letter{color:rgba(248,40,40,1);}

  /* ── Per-letter page accent (opp link, active nav underline) ── */

  body[data-letter="t"] .hero-opp a{color:rgba(40,205,248,1);}
  body[data-letter="f"] .hero-opp a{color:rgba(38,210,85,1);}

  .section{margin-bottom:48px;}

  .traits-row{display:flex;flex-wrap:wrap;gap:10px;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  .box{background:#131820;border:1px solid #2a3848;border-radius:var(--radius);padding:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .box-title{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
  .box-text{font-size:14px;color:#cdc7c0;line-height:1.85;}
  .box ul{list-style:none;}
  .box ul li{font-size:14px;color:#c8c0b8;line-height:1.75;padding:9px 0;border-bottom:1px solid #2a3848;display:flex;gap:12px;align-items:flex-start;}
  .box ul li:last-child{border-bottom:none;}
  .box ul li::before{content:'–';color:var(--gold-dim);flex-shrink:0;margin-top:2px;}

  .growth-box{background:#131820;border:1px solid #2a3848;border-left:3px solid var(--gold-dim);border-radius:var(--radius);padding:24px 28px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .growth-box .box-title{color:var(--gold);}

  .types-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:580px){.types-grid{grid-template-columns:repeat(2,1fr);}}
  .type-mini{display:block;text-decoration:none;background:#131820;border:1px solid #2a3848;border-radius:10px;padding:14px 16px;transition:border-color 0.2s,transform 0.25s,box-shadow 0.25s;box-shadow:inset 0 1px 0 rgba(255,255,255,0.04),0 2px 8px rgba(0,0,0,0.35);}
  .type-mini:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,0.5);}
  .type-mini:hover{border-color:var(--gold-dim);transform:translateY(-2px);}
  .mini-code{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--cream);letter-spacing:-0.02em;}
  .mini-code .hi{color:var(--gold);}
  .mini-name{font-size:12px;color:var(--muted);letter-spacing:0.05em;margin-top:3px;}

  .opp-block{background:#131820;border:1px solid #2a3848;border-radius:var(--radius);padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .opp-left{display:flex;align-items:center;gap:18px;}
  .opp-letter{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;line-height:1;color:var(--muted);}
  .opp-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--cream);margin-bottom:3px;}
  .opp-sub{font-size:12px;color:var(--muted);}
  .btn-outline{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;border:1px solid var(--border);border-radius:60px;padding:12px 22px;cursor:pointer;text-decoration:none;transition:all 0.2s;}
  .btn-outline:hover{border-color:var(--gold-dim);color:var(--gold);}

  .cta-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .cta-text{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--cream);line-height:1.4;}
  .cta-text em{font-style:italic;color:var(--gold);}
  .btn-gold{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#0c0e10;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;border:none;border-radius:60px;padding:14px 28px;cursor:pointer;text-decoration:none;transition:all 0.25s;}
  .btn-gold:hover{background:var(--cream);transform:translateY(-2px);}
  .sep{height:1px;background:var(--border);margin:48px 0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  body.light-mode .body-text{color:#1e2d4a;}
  body.light-mode .opp-desc{color:#1e2d4a;}

<script>
const letters={
  E:{
    name:"外向型",dim:"エネルギー",opp:"I",oppName:"内向型",
    oppDesc:"内面の世界、熟考、深さ、一人の時間からエネルギーを得ます。",
    p1:"外向型の人は、単に人が好きというだけではありません。他者との関わりを通じて思考を巡らせるのです。会話とは、頭の中で完成した考えを発表する場ではなく、アイデアを試行錯誤し、研ぎ澄ましていくプロセスそのものです。悩んでいるときは言葉にすることで心が軽くなり、ワクワクするときは声に出して伝えることで、その感情がよりリアルなものになります。",
    p2:"広いネットワークを築くことが自然にでき、意識して努力しなくても人間関係を維持できます。新しい人との出会いは、乗り越えるべきハードルではなく、多くの場合楽しく、刺激的な経験です。他の人がテキストで返すような場面でも、あなたは電話をかけます。グループでの集まりを自ら提案するのもあなたです。他の人が社交で消費するエネルギーを、あなたはそこから得ることができるのです。だからこそ、自分から一歩を踏み出す役割を自然と担うことができます。",
    traits:["社交的","情熱的","コミュ力抜群","行動指向","自己表現豊か"],
    strengths:["人脈を自然に築き、義務感を感じることなく関係を維持できる","頭に浮かぶアイデアを熱意を持って伝えることができ、思考と対話が同時に進む","その場にいて関わることで、グループ全体を活気づける","社交的な状況を素早く察知し、臨機応変に適応できる"],
    daily:"メールで返信するよりも、直接電話をかけるほうを選びます。初対面の相手でも、数分以内にその人がどんな仕事をしているかを聞き出せます。会話をしているときに最も思考が冴え渡ります。予定が全くない週末は、日曜日を迎える頃にはひどく退屈に感じられます。",
    growth:"素晴らしいアイデアの中には、まだ形成途中のものもあります。他人の意見や反応、グループの総意といった外部のノイズが入る前に、自分の中でじっくり育てる時間を持つことで、アイデアはさらに研ぎ澄まされます。発言する前に一歩立ち止まることには、想像以上の価値があります。",
    types:["ESTJ","ESFJ","ENFJ","ENTJ","ESTP","ESFP","ENFP","ENTP"],
    typeNames:{ESTJ:"幹部",ESFJ:"領事",ENFJ:"主人公",ENTJ:"指揮官",ESTP:"起業家",ESFP:"エンターテイナー",ENFP:"広報運動家",ENTP:"討論者"}
  },
  I:{
    name:"内向型",dim:"エネルギー",opp:"E",oppName:"外向型",
    oppDesc:"外部の世界、人々、活動、会話からエネルギーを得ます。",
    p1:"内向型とは、人見知りや内気ということではありません。この違いは極めて重要です。内向的な人でも自信に満ち、人を惹きつけ、魅力的な存在になることができます。ただ、社交的な関わりには『エネルギーのコスト』がかかるという点が異なります。人々と（たとえ大好きな人たちであっても）長い時間を過ごした後は、本質的な回復時間が必要になります。その一人の時間は、人嫌いによる『回避』ではなく、健全な『メンテナンス』なのです。",
    p2:"リアルタイムで口から出る言葉よりも、一人でじっくり練り上げたもののほうが、より洗練されている傾向があります。それについて長く考え、多角的に検証し、弱点に気づいているからです。あなたが共有するアイデアは、目に見えないところで何度も推敲されています。そのため、あなたの言葉には思慮深さがあり、会議などの場で発言した際には、発言回数が少ないこともあって、より重みを持って受け止められます。",
    traits:["熟考型","プライベート重視","深さを求める","自立的","慎重"],
    strengths:["他人の評価を必要とせず、自分の中でインディペンデントに思考を発展させられる","自分の話す番を待つのではなく、相手の言葉に真剣に耳を傾ける","狭くても深い人間関係を築き、そこに全力でコミットする","脳内のプロセスを経てからアウトプットするため、意見や表現が極めて洗練されている"],
    daily:"電話をかける前に、まずテキストを送ります。社交的なイベントが続いた後は、エネルギーを回復するために1日か2日の休息が必要です。お風呂の中、散歩中、あるいは夜の11時などに最も良いアイデアが浮かびます。まだ心を許していない相手からは「物静かな人」と思われがちです。",
    growth:"誰かに自分を理解してもらうためには、自分の存在を示す必要があります。完全に準備ができる前に一歩を踏み出し、未完成のアイデアを共有し、プロセスを終える前にその場に関わることで初めて、開かれる関係やチャンスが存在します。人生において大切にしたい人々のためなら、多少の居心地の悪さを引き受ける価値は十分にあります。",
    types:["ISTJ","ISFJ","INFJ","INTJ","ISTP","ISFP","INFP","INTP"],
    typeNames:{ISTJ:"管理者",ISFJ:"擁護者",INFJ:"提唱者",INTJ:"建築家",ISTP:"巨匠",ISFP:"冒険家",INFP:"仲介者",INTP:"論理学者"}
  },
  S:{
    name:"感覚型",dim:"認識",opp:"N",oppName:"直観型",
    oppDesc:"パターン、可能性、そして推測できることを信頼します。",
    p1:"あなたは自分の目で確認できる確かなことを信頼します。それは想像力が乏しいからではなく、理論と実践のギャップこそが多くのアイデアが破綻する場所であることを、経験的に知っているからです。他の人が通り過ぎてしまうような具体的なディテール、言葉遣いの細部、実際の数値、そこで何が起きたかといった具体的事実が、あなたの記憶に強く残ります。",
    p2:"感覚型はより多数派の好みであり、日常生活の基盤を支えています。計画はしっかりと実行され、細部は忘れず記憶され、仕事は求められた通りの高い水準で完了します。あなたの周囲の人々は、あなたがそこにいることで恩恵を受けていますが、あなたがいないときに初めて、その大切さに気づくことが多いでしょう。",
    traits:["現実的","詳細重視","今に集中","信頼できる","観察眼鋭い"],
    strengths:["他の人が見落としてしまうようなミスや矛盾に素早く気づく","大局的なビジョンが常に見えていなくても、計画を徹底的に実行できる","相手の正確な発言、日付、出来事など、曖昧になりがちなディテールを鮮明に記憶している","地に足が着いており、周囲の人々に本物の安心感と安定感を提供する"],
    daily:"契約書に署名する前に、必ず利用規約を読みます。単なる全体的な印象だけでなく、誰が何を言ったかを正確に記憶しています。初めて作る料理はレシピ通りに進め、2回目からアレンジを加えます。次のことに移る前に、今やっていることを最後まで終わらせます。",
    growth:"この世で最も重要なことのいくつかは、まだ起きていません。物事の方向性を予測するパターン、まだ目に見えない可能性、そして結果的に正しくなる推測なども、極めて重要な情報源です。直接の観察だけでなく、推測できることをもう少し信頼してみることで、直接的な経験だけでは到達できない新しい視野が開かれます。",
    types:["ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"],
    typeNames:{ISTJ:"管理者",ISFJ:"擁護者",ESTJ:"幹部",ESFJ:"領事",ISTP:"巨匠",ISFP:"冒険家",ESTP:"起業家",ESFP:"エンターテイナー"}
  },
  N:{
    name:"直観型",dim:"認識",opp:"S",oppName:"感覚型",
    oppDesc:"具体的で、観察可能で、目に見える現実を信頼します。",
    p1:"あなたは情報を取り込むと同時に、その下にあるパターンを無意識に探し始めます。物事がどこへ向かっているのか、何と結びついているのか、言葉の裏に何が暗示されているのか。あなたにとって今この瞬間よりも、それが未来について何を物語っているかのほうが興味深いのです。これは集中していないのではなく、異なる種類の注意を払っているのです。",
    p2:"アイデアは驚くべき速さで、次々と湧き上がってきます。プロジェクトのどこが間違っているのか、相手が本当に言いたいことは何か、どのような決断を下すべきかなどを、その場にいる他の誰よりも早く見抜いた経験があるはずです。あなたにとっての課題はビジョンを持つことではなく、そのビジョンが形になるまでじっくりと留まり続けることです。",
    traits:["想像力豊か","未来志向","パターン追及","概念的","先見の明あり"],
    strengths:["物事がそこに到達する前に、どこへ向かっているのかを察知する","異なる分野のアイデアを結びつけ、今までにない斬新な結論を導き出す","他の全員が目先の問いに答えている中で、その根底にある本質的な問いを投げかける","単なる作業の実行にとどまらず、戦略や抽象的な意味のレベルで自然に機能する"],

function render(){

  if(!d){document.getElementById('content').innerHTML='<p style="color:var(--muted)">指標が見つかりませんでした。</p>';return;}

  if(!dm){dm=document.createElement('meta');dm.name='description';document.head.appendChild(dm);}
  dm.content=seoDesc;
  let km=document.querySelector('meta[name="keywords"]');
  if(!km){km=document.createElement('meta');km.name='keywords';document.head.appendChild(km);}
  km.content=`${l} 性格, MBTI ${l}, ${d.name} 意味, マイヤーズ・ブリッグス ${l}, ${keyPhrases[l]||''}`;
  document.getElementById('canonical-url')?.setAttribute('href',`https://77scenarios.com/ja/letters/${l.toLowerCase()}`);

  const typesHTML=d.types.map(t=>`

    <div class="section r" data-d="3"><div class="section-label">特徴・キーワード</div><div class="traits-row">${d.traits.map(t=>`<span class="trait">${t}</span>`).join('')}</div></div>

    <div class="sep r" data-d="7"></div>
    <div class="section r" data-d="8">
      <div class="section-label">もう一方の側面</div>
      <div class="opp-block">
        <div class="opp-left">
          <div class="opp-letter">${d.opp}</div>
          <div><div class="opp-name">${d.oppName}</div><div class="opp-sub">${d.oppDesc}</div></div>
        </div>
        <a href="/ja/letters/${d.opp.toLowerCase()}" class="btn-outline">${d.opp} について知る →</a>
      </div>
    </div>
    <div class="cta-block r" data-d="9">
      <div class="cta-text">実際のシナリオを通じて、<br>あなたの<em>アルファベット</em>を診断しましょう。</div>
      <a href="/ja/" class="btn-gold">テストを受ける →</a>
    </div>`;

  document.querySelectorAll('.r').forEach(el=>obs.observe(el));
}

const ov=document.getElementById('t-overlay');
function fadeIn(){ov.style.opacity='1';ov.animate([{opacity:1},{opacity:0}],{duration:550,delay:60,easing:'cubic-bezier(0.22,1,0.36,1)',fill:'forwards'});}
fadeIn();
window.addEventListener('pageshow',e=>{if(e.persisted)fadeIn();});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const h=a.getAttribute('href');
  if(!h||h.startsWith('#')||h.startsWith('http')||h.startsWith('javascript')||h.startsWith('mailto'))return;
  e.preventDefault();
  ov.animate([{opacity:0},{opacity:1}],{duration:320,easing:'cubic-bezier(0.76,0,0.24,1)',fill:'forwards'}).finished.then(()=>{window.location.href=h;});
});

const obs=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(!en.isIntersecting)return;
    setTimeout(()=>en.target.classList.add('in'),parseFloat(en.target.dataset.d||0)*70);
    obs.unobserve(en.target);
  });
},{threshold:0.155});

render();
</script>
