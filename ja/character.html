<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  a{color:inherit;text-decoration:none;}
  :root{--bg:#0c0e10;--surface:#13161a;--surface2:#1a1e24;--gold:#c9a84c;--gold-dim:#8a6d2e;--cream:#ede8df;--muted:#b5ada6;--border:#252a30;--radius:14px;}
  html,body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6;}
  #t-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#0c0e10;opacity:1;}
  .glow{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0;}
  .glow-1{width:600px;height:600px;top:-200px;left:-150px;background:radial-gradient(circle,rgba(201,168,76,0.07) 0%,transparent 70%);}
  .glow-2{width:400px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(120,180,160,0.05) 0%,transparent 70%);}

  /* ── PAGE LAYOUT ── */
  main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:56px 24px 96px;}
  .breadcrumb{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:32px;display:flex;align-items:center;gap:8px;}
  .breadcrumb a{color:var(--muted);transition:color 0.2s;}
  .breadcrumb a:hover{color:var(--gold);}
  .breadcrumb span{opacity:0.4;}

  /* ── HERO ── */
  .hero{display:flex;gap:32px;align-items:flex-start;margin-bottom:48px;}
  .hero-avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0;background:var(--surface2);}
  .hero-avatar-placeholder{width:120px;height:120px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;}
  .hero-avatar-placeholder span{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:var(--gold-dim);}
  .hero-info{flex:1;min-width:0;}
  .hero-type{font-family:'Cormorant Garamond',serif;font-size:64px;font-weight:300;color:var(--gold);line-height:1;margin-bottom:8px;}
  .hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5vw,42px);font-weight:300;color:var(--cream);line-height:1.1;margin-bottom:6px;}
  .hero-ctx{font-size:14px;color:var(--muted);margin-bottom:16px;}
  .hero-cat-badge{display:inline-block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);border-radius:20px;padding:3px 12px;background:rgba(201,168,76,0.07);}
  @media(max-width:560px){.hero{flex-direction:column;gap:20px;}.hero-avatar,.hero-avatar-placeholder{width:80px;height:80px;}.hero-avatar-placeholder span{font-size:26px;}.hero-type{font-size:48px;}}

  /* ── CONTENT SECTIONS ── */
  .section{margin-bottom:20px;background:#131820;border:1px solid #2a3848;border-radius:14px;padding:28px 32px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 4px 16px rgba(0,0,0,0.45);}
  .section-label{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #2e3a44;}
  .section p{font-size:15px;color:#c8c0b8;line-height:1.85;margin-bottom:16px;}
  .section p:last-child{margin-bottom:0;}
  .letter-block{margin-bottom:36px;}
  .letter-block:last-child{margin-bottom:0;}
  .letter-display{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2e3a44;}
  .letter-big{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:700;color:var(--gold);line-height:1;}
  .letter-word{font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold-dim);font-weight:500;}
  .letter-block p{font-size:15px;color:#c8c0b8;line-height:1.85;margin-bottom:16px;}
  .section h2{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--cream);margin-bottom:20px;line-height:1.2;}
  .section h3{font-size:14px;font-weight:500;color:var(--cream);margin-bottom:10px;margin-top:24px;letter-spacing:0.04em;}

  /* ── FUNCTION GRID ── */
  .fn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:8px;}
  .fn-card{background:#0f1620;border:1px solid #273444;border-radius:10px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 8px rgba(0,0,0,0.4);}
  .fn-card.dominant{border-color:var(--gold-dim);background:rgba(201,168,76,0.04);}
  .fn-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .fn-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--gold);margin-bottom:6px;}
  .fn-desc{font-size:12px;color:var(--muted);line-height:1.6;}

  /* ── VERDICT BOX ── */
  .verdict{background:#131820;border:1px solid #2a3848;border-left:4px solid var(--gold);border-radius:var(--radius);padding:24px 28px;margin-top:28px;margin-bottom:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 6px 20px rgba(0,0,0,0.5);}
  .verdict-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .verdict p{font-size:15px;color:var(--cream);line-height:1.8;}
  /* static light-mode overrides — fires before nav.js injection */
  body.light-mode .verdict{background:#1e2d4a!important;border-color:#2d4168!important;border-left-color:#c9a84c!important}
  body.light-mode .verdict-label{color:#c9a84c!important}
  body.light-mode .verdict p{color:#ffffff!important}
  body.light-mode .section p{color:#1e2d4a!important}
  body.light-mode .section h2,body.light-mode .section h3{color:#1e2d4a!important}
  body.light-mode .fn-card .fn-name *{color:#1e2d4a!important}
  body.light-mode .letter-big{color:#1e2d4a!important}
  body.light-mode .letter-word{color:#8a6d2e!important}

  /* ── KEYWORDS / TAGS ── */
  .tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .tag{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #2e3a44;color:var(--muted);background:var(--surface2);}

  /* ── RELATED ── */
  .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
  .related-card{background:#131820;border:1px solid #2a3848;border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color 0.2s,transform 0.25s,box-shadow 0.25s;text-decoration:none;display:block;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .related-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,0.07),transparent);opacity:0;transition:opacity 0.25s;pointer-events:none;}
  .related-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08),0 20px 50px rgba(0,0,0,0.55);}
  .related-card:hover::after{opacity:1;}
  .related-type{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--gold);margin-bottom:4px;}
  .related-name{font-size:13px;color:var(--cream);font-weight:400;margin-bottom:2px;line-height:1.3;}
  .related-ctx{font-size:11px;color:var(--muted);}
  .universe-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .actor-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .actor-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:var(--surface);border:1px solid #2e3a44;border-radius:8px;text-decoration:none;transition:border-color 0.15s,transform 0.15s;font-size:13px;color:var(--muted);}
  .actor-chip:hover{border-color:rgba(201,168,76,0.35);transform:translateY(-1px);}
  .actor-chip-label{font-size:11px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;margin-right:2px;}
  .actor-chip-name{color:var(--cream);}
  .universe-chip{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border:1px solid #2e3a44;border-radius:8px;text-decoration:none;transition:border-color 0.15s,transform 0.15s;flex-shrink:0;}
  .universe-chip:hover{border-color:rgba(201,168,76,0.35);transform:translateY(-1px);}
  .universe-chip-type{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:var(--gold);line-height:1;}
  .universe-chip-name{font-size:13px;color:var(--cream);line-height:1;}

  /* ── CTA ── */
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:48px;padding-top:32px;border-top:1px solid var(--border);}
  .cta-btn{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);background:transparent;padding:11px 20px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;text-decoration:none;display:inline-block;}
  .cta-btn:hover{background:rgba(201,168,76,0.1);}
  .cta-btn.sec{color:var(--muted);border-color:var(--border);}
  .cta-btn.sec:hover{color:var(--cream);border-color:var(--muted);}

  /* ── 404 ── */
  .not-found{text-align:center;padding:96px 0;}
  .not-found h1{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:var(--gold);margin-bottom:16px;}
  .not-found p{font-size:15px;color:var(--muted);margin-bottom:32px;}

  /* ── ANIMATIONS ── */
  .r{opacity:0;transform:translateY(18px);transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),transform 0.55s cubic-bezier(0.22,1,0.36,1);}
  .r.in{opacity:1;transform:none;}

  footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:32px;text-align:center;}
  footer p{font-size:12px;color:var(--muted);}
  footer a{color:var(--muted);transition:color 0.2s;}
  footer a:hover{color:var(--cream);}

  /* Reading progress bar */
  #reading-progress{position:fixed;top:56px;left:0;width:0%;height:2px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));z-index:199;transition:width 0.1s linear;pointer-events:none;}

  /* Light mode - character page specific card overrides */
  body.light-mode .section{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08),0 1px 3px rgba(30,60,100,0.05);}
  body.light-mode .section p{color:#1e2d4a;}
  body.light-mode .letter-block p{color:#1e2d4a;}
  body.light-mode .section-label{border-bottom-color:#b0bcd0;}
  body.light-mode .verdict{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08);}
  body.light-mode .fn-card{background:#e8eef6;border-color:#b0bcd0;box-shadow:0 1px 4px rgba(30,60,100,0.07);}
  body.light-mode .related-card{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08),0 1px 3px rgba(30,60,100,0.05);}
  body.light-mode .actor-chip,body.light-mode .universe-chip{background:#f0f3f8;border-color:#b0bcd0;}
  body.light-mode .tag{background:#e8eef6;border-color:#b0bcd0;}
</style>

<script>
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
</script>
<script>
/* ── RENDER ── */
function getPathSlug(){
  const parts=location.pathname.split('/').filter(Boolean);
  // expects /character/slug
  if(parts[0]==='character'&&parts[1])return parts[1];
  return null;
}

function renderPage(){
  const ps=getPathSlug();
  if(!ps){renderNotFound();return;}
  const p=people.filter(Boolean).find(x=>slug(x.name)===ps);
  if(!p){renderNotFound();return;}

  // ── SEO meta ──
  const title=`${p.name}の性格タイプ（MBTI：${p.type}）の分析 · 77 Scenarios`;
  const desc=`${p.name}の性格タイプは${p.type}です。${p.desc.slice(0,150).trim()}…`;
  const url=`https://77scenarios.com/ja/character/${ps}`;
  document.getElementById('page-title').textContent=title;
  document.getElementById('page-desc').setAttribute('content',desc);
  document.getElementById('page-kw').setAttribute('content',(p.kw||[]).join(', ')+`, ${p.type} personality type, ${p.type} MBTI, cognitive functions ${p.type}`);
  document.getElementById('og-title').setAttribute('content',title);
  document.getElementById('og-desc').setAttribute('content',desc);
  document.getElementById('og-url').setAttribute('content',url);
  document.getElementById('canonical-url').setAttribute('href',url);
  const charImgUrl=`https://77scenarios.com/images/characters/${ps}.jpg`;
  document.querySelector('meta[property="og:image"]').setAttribute('content',charImgUrl);
  document.querySelector('meta[name="twitter:image"]').setAttribute('content',charImgUrl);

  // ── Schema ──
  const typeLabel = {'INTJ':'The Architect','INTP':'The Logician','ENTJ':'The Commander','ENTP':'The Debater','INFJ':'The Advocate','INFP':'The Mediator','ENFJ':'The Protagonist','ENFP':'The Campaigner','ISTJ':'The Logistician','ISFJ':'The Defender','ESTJ':'The Executive','ESFJ':'The Consul','ISTP':'The Virtuoso','ISFP':'The Adventurer','ESTP':'The Entrepreneur','ESFP':'The Entertainer'}[p.type]||p.type;
  const isFictional = ['Fiction','Film','Anime','Game','Animation'].includes(p.cat);
  const personType = isFictional ? 'Person' : (p.cat === 'Historical' ? 'Person' : 'Person');
  const schema={
    '@context':'https://schema.org',
    '@graph':[
      {
        '@type': personType,
        '@id': url + '#person',
        'name': p.name,
        'description': p.ctx,
        'image': charImgUrl,
        'url': url,
        'sameAs': [],
        'knowsAbout': [p.type, typeLabel, 'cognitive functions', 'MBTI personality type']
      },
      {
        '@type':'Article',
        '@id': url + '#article',
        'headline': `${p.name} - ${p.type}の性格タイプ分析`,
        'description': desc,
        'image': charImgUrl,
        'url': url,
        'about': { '@id': url + '#person' },
        'author': {
          '@type': 'Organization',
          '@id': 'https://77scenarios.com/#organization',
          'name': '77 Scenarios',
          'url': 'https://77scenarios.com'
        },
        'keywords': (p.kw||[]).join(', '),
        'articleSection': 'Personality Type Analysis',
        'inLanguage': 'ja',
        'dateModified': '2026-05-19T00:00:00+00:00',
        'publisher': {
          '@type': 'Organization',
          '@id': 'https://77scenarios.com/#organization',
          'name': '77 Scenarios',
          'url': 'https://77scenarios.com'
        },
        'isPartOf': { '@type': 'WebSite', '@id': 'https://77scenarios.com/#website' }
      },
      {
        '@type': 'BreadcrumbList',
        'itemListElement': [
          { '@type': 'ListItem', 'position': 1, 'name': 'ホーム',    'item': 'https://77scenarios.com/ja/' },
          { '@type': 'ListItem', 'position': 2, 'name': 'アーカイブ', 'item': 'https://77scenarios.com/ja/archive' },
          { '@type': 'ListItem', 'position': 3, 'name': p.cat,     'item': `https://77scenarios.com/ja/archive?cat=${encodeURIComponent(p.cat)}` },
          { '@type': 'ListItem', 'position': 4, 'name': p.name,    'item': url }
        ]
      }
    ]
  };
  document.getElementById('page-schema').textContent=JSON.stringify(schema);

  // ── Functions ──
  const stack=fnStack[p.type]||{fns:[],labels:[]};
  const fnCardsHTML=stack.fns.map((fn,i)=>`
    <div class="fn-card${i===0?' dominant':''}">
      <div class="fn-label">${stack.labels[i]}</div>
      <div class="fn-name">${fn} <span style="font-family:'DM Sans';font-size:13px;color:var(--muted);font-weight:300;">${fnFullName[fn]||''}</span></div>
      <div class="fn-desc">${fnDesc[fn]||''}</div>
    </div>`).join('');

  // ── Related (same type, different entries) ──
  const related=people.filter(Boolean).filter(x=>x.type===p.type&&slug(x.name)!==ps).sort(()=>Math.random()-0.5).slice(0,6);
  const relatedHTML=related.map(r=>`
    <a class="related-card" href="/ja/character/${slug(r.name)}">
      <div class="related-type">${r.type}</div>
      <div class="related-name">${r.name}</div>
      <div class="related-ctx">${r.ctx}</div>
    </a>`).join('');

  // ── Same universe characters ──
  const normCtx=c=>c.split('(')[0].split(',')[0].trim().toLowerCase();
  const universeChars=people.filter(Boolean).filter(x=>normCtx(x.ctx)===normCtx(p.ctx)&&slug(x.name)!==ps&&!x.knownFor&&!x.playedBy);
  const universeHTML=universeChars.length?`
    <div class="section-label" style="margin-bottom:12px;">${p.ctx.split('(')[0].trim()} の他のキャラクター</div>
    <div class="universe-strip">
      ${universeChars.map(u=>`<a class="universe-chip" href="/ja/character/${slug(u.name)}"><span class="universe-chip-type">${u.type}</span><span class="universe-chip-name">${u.name.split('/')[0].trim()}</span></a>`).join('')}
    </div>`:'';

  // ── Played by / Known for ──
  const playedByPerson=p.playedBy?people.filter(Boolean).find(x=>slug(x.name)===p.playedBy):null;
  const knownForChar=p.knownFor?people.filter(Boolean).find(x=>slug(x.name)===p.knownFor):null;
  const actorStripHTML=(playedByPerson||knownForChar)?`
    <div class="actor-strip">
      ${playedByPerson?`<a class="actor-chip" href="/ja/character/${p.playedBy}"><span class="actor-chip-label">キャスト</span><span class="actor-chip-name">${playedByPerson.name} (${playedByPerson.type})</span></a>`:''}
      ${knownForChar?`<a class="actor-chip" href="/ja/character/${p.knownFor}"><span class="actor-chip-label">代表作</span><span class="actor-chip-name">${knownForChar.name}</span></a>`:''}
    </div>`:'';

  // ── Avatar ──
  const avatarHTML=`<img class="hero-avatar" id="hero-avatar" alt="${p.name}" style="opacity:0;transition:opacity 0.3s;">`;

  // ── Keywords / tags ──
  const tagsHTML=(p.kw&&p.kw.length)?`<div class="tag-row">${p.kw.map(k=>`<span class="tag">${k}</span>`).join('')}</div>`:'';

  // ── Full body HTML ──
  document.getElementById('page-body').innerHTML=`
    <div class="breadcrumb r" data-d="0">
      <a href="/ja/archive">アーカイブ</a>
      <span>/</span>
      <span>${p.cat}</span>
      <span>/</span>
      <span>${p.name}</span>
    </div>

    <div class="hero r" data-d="1">
      ${avatarHTML}

  // ── Avatar lazy load (jpg → gif → wikipedia) ──
  {
    const jpgSrc=`/images/characters/${ps}.jpg`;
    const gifSrc=`/images/characters/${ps}.gif`;
    const img=document.getElementById('hero-avatar');

    function updateOgImage(src){
      const full=src.startsWith('http')?src:`https://77scenarios.com${src}`;
      const om=document.querySelector('meta[property="og:image"]');
      const tm=document.querySelector('meta[name="twitter:image"]');
      if(om)om.setAttribute('content',full);
      if(tm)tm.setAttribute('content',full);
      try{
        const s=JSON.parse(document.getElementById('page-schema').textContent);
        if(s['@graph']){const per=s['@graph'].find(n=>n['@id']&&n['@id'].endsWith('#person'));if(per){per.image=full;document.getElementById('page-schema').textContent=JSON.stringify(s);}}
      }catch(e){}
    }

    function tryWikipedia(){
      if(p.wiki){
        fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.wiki))
          .then(r=>r.ok?r.json():null)
          .then(data=>{
            const img2=document.getElementById('hero-avatar');
            if(!img2)return;
            const src=data&&data.thumbnail&&data.thumbnail.source;
            if(src){img2.src=src;img2.onload=function(){img2.style.opacity='1';};updateOgImage(src);}
            else{img2.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;}
          })
          .catch(()=>{
            const img2=document.getElementById('hero-avatar');
            if(img2)img2.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;
          });
      } else {
        img.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;
      }
    }

    if(img){
      const tryJpg=new Image();
      tryJpg.onload=function(){img.src=jpgSrc;img.onload=function(){img.style.opacity='1';};updateOgImage(jpgSrc);};
      tryJpg.onerror=function(){
        const tryGif=new Image();
        tryGif.onload=function(){img.src=gifSrc;img.onload=function(){img.style.opacity='1';};updateOgImage(gifSrc);};
        tryGif.onerror=function(){tryWikipedia();};
        tryGif.src=gifSrc;
      };
      tryJpg.src=jpgSrc;
    }
  }

  // ── Animate in ──

/* ── EXPANDED CONTENT ──────────────────────────────────────────────
   Deterministic, character-aware content generation.
   Uses p.name, p.type, p.ctx, p.desc and per-type lookup tables
   to produce content that feels specific to this character and world,
   not just the generic MBTI type. Zero API calls, zero latency.
   ─────────────────────────────────────────────────────────────── */
function loadExpandedContent(p){
  const name=p.name.split('/')[0].trim();
  const type=p.type;
  const ctx=p.ctx||'their source material';
  const stack=fnStack[type]||{fns:['?','?','?','?'],labels:[]};
  const dom=stack.fns[0]||'?';
  const aux=stack.fns[1]||'?';
  const ter=stack.fns[2]||'?';
  const inf=stack.fns[3]||'?';
  const sl=p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

  /* ── Character-specific Journey + Mistype content ── */
  // Externalized to /data/char-content-{lang}.js

  /* ── Per-type: what this cognitive stack looks like in practice ── */
  const typeProfile={
    INTJ:`\${name}は、周囲のほとんどの人が完全には見ることのできない、極めてプライベートな「内なるモデル（洞察の体系）」に基づいて行動します。主機能はNi（内向的直観）であり、これは水面下で情報を処理し、断片的な観察から長期的な確信へと一歩一歩論理を積み上げるのではなく、直感的に一瞬で統合するプロセスです。\${name}は多くの場合、他の誰よりも先に状況がどこに向かっているかを察知し、それを他人にわざわざ説明することなく行動に移します。なぜなら、Niのプロセスを言語化して他人に伝えるのは容易ではないからです。補助機能のTe（外向的思考）は、その内なるビジョンを具体的な構造、システム、そして果断な実行へと落とし込みます。内なるモデルから計画が生まれ、計画から結果が生まれ、その結果は他人の期待ではなく、自分自身のモデルに照らし合わせて評価されます。その結果、周囲からは確信に満ち、自立していて、説得が極めて難しい人物に見えます（実際にその通りです）。弱点は劣等機能であるSe（外向的感覚）です。\${name}は、自身のモデルが考慮していなかった目の前の即時的な物理的現実に足元をすくわれたり、内なる思考構造の中に引きこもるあまり、現実世界から危険なほど乖離してしまうことがあります。`,
    INTP:`\${name}の頭脳は極めて精密な測定器のようです。主機能はTi（内向的思考）であり、これは外部の合意や社会的承認、あるいは受け売りの知識よりも、自分にとって圧倒的に重要となる厳密な「内なる論理的フレームワーク」を構築します。このフレームワークこそが最優先であり、他のすべてはそれをテストするための入力データに過ぎません。補助機能であるNe（外向的直観）は、Tiが徹底的に分析するための可能性、選択肢、多角的な視点を次々と生成します。その結果、知的好奇心が旺盛で、単純な答えには決して満足せず、論理的に完全に納得できない結論を受け入れることに強い抵抗を感じるキャラクターになります。劣等機能であるFe（外向的感情）は、彼らの「隠れた本音」として現れます。極度のストレス下や、真に感情的な深い瞬間において、\${name}は普段の超然とした態度とは裏腹に、他者との繋がりや認められたいという欲求をのぞかせます。これは主機能であるTiだけでは処理しきれない、心の奥底からの呼びかけです。`,
    ENTJ:`\${name}は自然とリーダーシップを握ります。それはエゴからではなく、主機能であるTe（外向的思考）の働きによるものです。Teは周囲の状況を常にスキャンし、何を整理すべきか、誰に何ができるか、確実に成果を出すシステムへと仕立て上げます。補助機能のNi（内向的直観）は、単なる管理者（マネージャー）に留まらない「長期的なビジョン」を提供します。彼らは明確で包括的な目標に向かって進んでおり、周囲の人々にも同じペースでついてくることを期待します。この組み合わせにより、戦略的に極めて知的で、明確な自信を持ち、自分が去った後も長く機能し続けるような組織や体制を構築できるキャラクターが生まれます。弱点は劣等機能のFi（内向的感情）です。\ref{name}は、他人が本当に大切にしている価値観や感情を軽視してしまうことがあります。これは悪意からではなく、Teが最適化しようとしている戦略的成果に比べて、個人的な感情の優先度を低く見積もりがちだからです。`,
    ENTP:`\ref{name}は、主機能のNe（外向的直観）によって突き動かされています。これは、まだ誰も気づいていないようなアングル、可能性、議論、あるいはアイデアの結びつきを絶えず生み出すプロセスです。彼らにとって、あらゆる会話はアイデアの可能性を試す冒険であり、確定した事実やルールは、その矛盾や限界をテストするための対象に過ぎません。補助機能のTi（内向的思考）は、Neが生み出すアイデアが単なるおしゃべりに終わらないよう、厳密な論理分析を提供します。Neが仮説を生み出し、Tiがそれを評価する。この連携により、知的刺激に満ち、討論に強く、時に周囲を疲れさせるほどエネルギッシュなキャラクターになります。劣等機能のSi（内向的感覚）は彼らの影です。\${name}は日常の雑務、決まったルーティン、過去のデータに基づく判断などが極めて苦手な傾向があります。過去の約束や実績よりも「次の新しいアイデア」を優先し、そのためにツケを払うことがよくあります。`,
    INFJ:`\${name}は、多くの人が両立できない2つの要素を同時に抱えています。それは「物事があるべき姿についての長期的なビジョン」と、「目の前の人々が実際にどう感じているかに対する極めて鋭い感受性」です。主機能はNi（内向的直観）であり、これは水面下で働き、観察やパターンを一つの強固な信念へと統合します。この確信は一度形成されると、容易に揺らぐことはありません。補助機能のFe（外向的感情）は、そのビジョンが単なる抽象論に終わらず、常に「人々との関係」において機能することを保証します。この組み合わせにより、先見の明がありながらも他者への深い共感力を持つ、非常に魅力的な（そして時に共感疲れに陥りやすい）人物になります。弱点は劣等機能のSe（外向的感覚）です。長期的なパターン認識では決して予測できなかったような、突発的な物理的現実や、今この瞬間のアクシデントに直面した際、激しく動揺してしまうことがあります。`,
    INFP:`\${name}にとって、自身の内面世界こそが最もリアルな現実です。主機能はFi（内向的感情）であり、これは自分自身の深い個人的な価値体系に基づいて、周囲のすべてを静かに、そして絶えず評価するプロセスです。このプロセスは表には見えにくいため、\${name}は一見、受動的で曖昧な人物に見えることがあります。しかし、その情熱は完全に内面で燃え上がっています。補助機能のNe（外向的直観）は、現状のままではなく「こうであるかもしれない」という可能性、接続、オルタナティブな枠組みを描き出す力を与えます。劣等機能のTe（外向的思考）は、彼らの一貫した課題です。現実的な実行、社会的な構造化、外部へのアカウンタビリティ（説明責任）、そして内なるビジョンを具体的な成果へと翻訳することは、\${name}が最も苦手とする領域であり、それゆえに最も成長が感じられる部分でもあります。`,
    ENFJ:`\${name}は部屋に入る前に、その場の空気を瞬時に読み取ります。主機能はFe（外向的感情）であり、これは他者の感情や関係性に対する非常に精密な同調能力であり、本人が自覚する前に周囲のニーズを察知することすらあります。補助機能のNi（内向的直観）は、この同調能力を単なる共感ではなく「戦略的」なものにします。彼らは明確なビジョンを持っており、その温かさは人々を特定の方向へと導く力を持っています。その結果、他者を鼓舞し、人間関係の機微を見抜き、集団を共通のビジョンへと導くことのできるキャラクターが生まれます。劣等機能のTi（内向的思考）は彼らの盲点です。\${name}は時に、極めて主観的な感情に基づく決断を、あたかも普遍的な論理であるかのように合理化し、その矛盾を他者から突かれると感情的に防衛的になることがあります。`,
    ENFP:`\${name}は、主機能のNe（外向的直観）によって動いています。これは「こうあるかもしれない」という未来への情熱、誰も気づかなかったアイデアの繋がり、そして今この瞬間に眠る無数の可能性に対する尽きないワクワク感です。補助機能のFi（内向的感情）は、この奔放な情熱を個人的な倫理や本物の価値観へと繋ぎ止めます。彼らはただ可能性に興味があるのではなく、「本当に価値のある可能性」を追求します。これにより、温かく、創造性に溢れ、深い精神性を持つキャラクターになりますが、一方で「湧き上がる熱意」と「それを実行に移すための持続力・構造化」との間のギャップに悩まされることがよくあります。劣等機能のSi（内向的感覚）は繰り返される弱点であり、過去のルール、ルーティン、実証済みのデータなどを軽視しがちで、そのために定期的にトラブルを経験します。`,
    ISTJ:`\${name}は、主機能であるSi（内向的感覚）を中心に構築されています。何が機能してきたかを蓄積した、頭の中の巨大な「参照用ライブラリ」です。彼らにとって、過去にうまくいった方法は、今何が有効であるかを示す最も信頼できる道標であり、このライブラリを何よりも信頼します。補助機能のTe（外向的思考）は、これを明確な行動へと翻訳します。定義された義務、測定可能な期待値、そして曖昧さのない責任体制です。その結果、極めて誠実で、細部まで徹底しており、他のすべての人が去った後も現場を支え続ける、深く信頼できる人物になります。劣等機能のNe（外向的直観）は最も苦手な領域です。前例のない変化、曖昧な状況、急激な変革に直面すると、頑なになったり、最悪のシナリオを想像して過剰に不安になったりすることがあります。`,
    ISFJ:`\${name}は、周囲の人々に対して驚くほど一貫した姿勢で寄り添い続けます。その配慮は、当たり前のように日常に溶け込んでいるため、時に見落とされてしまうほどです。主機能はSi（内向的感覚）であり、これは「他者が何を必要としているか」「かつて何を約束したか」「歴史的に培われた気遣いのルール」を詳細に記録する、内なるデータベースとして機能します。補助機能のFe（外向的感情）は、この蓄積された記憶と配慮を、日々の細やかなサポートや調和の維持といった形へ具体的に外へと向けさせます。その結果、彼らのケアは一時的なパフォーマンスではなく、生活に根差した本物となり、相手が必要と気づく前に差し出されます。劣等機能のNe（外向的直観）は影の部分です。\ref{name}は急な変化や未来の不確実な可能性に対して極度に悲観的になったり、自身のケアが他者に依存しすぎて自己犠牲に陥ることがあります。`,
    ESTJ:`\${name}は、どんな状況にあっても、自分が足を踏み入れた場所に明確な構造と規律をもたらします。それは支配欲からではなく、主機能のTe（外向的思考）が、無秩序や非効率の中で機能することを本能的に嫌うからです。補助機能のSi（内向的感覚）は、その組織化の手法を実績のある「前例」へと結びつけます。彼らは無駄に新しいルールを発明するのではなく、実証済みの最も確実なやり方を適用し、それを維持します。その結果、極めて信頼でき、有能であり、時には規律と効率を徹底するあまり融通の利かない印象を与えるシステム指向のキャラクターになります。劣等機能のFi（内向的感情）は、彼らが最もアクセスしにくい領域です。個人的な感情、個別の例外的な事情、あるいはルールよりも「その人が本当はどう感じているか」という生身の感情を汲み取ることに、大きな困難を抱えています。`,
    ESFJ:`\${name}は、人間関係へのきめ細やかな配慮によって、コミュニティの絆をしっかりとつなぎとめます。主機能はFe（外向的感情）であり、周囲の人々の感情的なコンディションを常に感じ取り、全員が調和していられるよう自分の振る舞いを絶えず調整します。補助機能のSi（内向的感覚）は、その関係性への配慮を「継続性」へと根付かせます。交わした約束を重んじ、共通の伝統や気遣いのマナーを守ることで、人々が安心して属せる居場所を作ります。劣等機能のTi（内向的思考）は彼らの課題です。論理的な整合性を突き詰めることにはあまり関心がなく、他者への善意に基づく行動の背景にある論理を厳しく問いただされると、ひどく当惑し、感情的な防衛に走ることがあります。`,
    ISTP:`\${name}は、頭の中でシステムの仕組みを解き明かし、それを現実の物理的な世界で実践します。主機能はTi（内向的思考）であり、これは物事が実際にどう機能しているかについての精密な論理モデルを、頭の中で静かに構築し、磨き続けるプロセスです。補助機能のSe（外向的感覚）は、その論理を常に「目の前の具体的な現実」と結びつけます。彼らは単なる理論家ではなく、自分の手や体を使って、今起きている問題に極めて正確に対処します。劣等機能であるFe（外向的感情）は、彼らが最も無防備になる領域です。複雑な感情表現、情緒的な衝突、その場の社交的なルールなどは、彼らにとって最も不慣れな言語であり、急にそのような対応を求められると立ち往生してしまいます。`,
    ISFP:`\${name}は、今この瞬間における「自分自身の真実の感情」に基づいて行動します。主機能はFi（内向的感情）であり、これは他人の意見に流されない、自分だけの極めて深い個人的な価値観であり、彼らはこれをあえて言葉で説明することなく、静かに日々の行動で示します。補助機能のSe（外向的感覚）は、その感情を目の前の具体的な世界へと表現させます。彼らは抽象的な倫理を語るのではなく、ダイレクトで、実践的で、身体的な行動を通して自らの価値観を世界に投影します。その行動は美しく、強烈ですが、時に論理的な言葉で説明するのが難しいものです。劣等機能のTe（外向的思考）は明確な弱点です。外部の厳しい管理システム、長期的な計画の構築、合理的な説明責任などは、彼らが最も苦手とし、ストレスを感じやすい領域です。`,
    ESTP:`\${name}は、目の前の状況を誰よりも早く読み取ります。主機能はSe（外向的感覚）であり、今まさに現実で起きていることに全身で同調し、他人がまだ状況を分析している間に、すでに身体が反応して行動を起こしています。補助機能のTi（内向的思考）は、その驚異的なスピードに「分析的な正確さ」をもたらします。彼らは単に衝動的なのではなく、極めてシャープで、瞬時に最も効果的なアングルを計算して動いています。劣等機能のNi（内向的感覚）は、彼らが最も見落としがちな盲点です。長期的な影響、時間が経たなければ見えてこない隠れたパターン、あるいは「数年後にどうなるか」といった長期的な予測において、重大な過小評価をしてしまうことが多々あります。`,
    ESFP:`\${name}は、「今、ここ」に完全に生きています。主機能はSe（外向的感覚）であり、目の前の世界や人々に対して、他のどのタイプよりもオープンで、一切の防壁を作らずにダイレクトに関わります。補助機能のFi（内向的感情）は、そのリアルな世界への関わりを「本物の個人的な温かさ」へと結びつけます。彼らの優しさは作られたパフォーマンスではなく、目の前の相手に向けられた本物です。劣等機能のNi（内向的直観）は最も苦労する領域です。長期的な将来設計、目に見えない抽象的なパターン、あるいは今すぐには現れない行動のツケなどに対して非常に疎く、それゆえに人生の予期せぬ局面で大きな不意打ちを食らうことがあります。`,
  };

  /* ── Per-type: common mistypes with character-specific framing ── */
  const mistypeProfile={
    INTJ:{alt:'INFJまたはENTJ',conf:`\${name}は、INFJのような神秘的な内面の深さや、ENTJのような強力な統率力を持っているように見えることがあります`,tell:`決定的な証拠はTe-Ni軸にあります。\${name}の判断は体系的かつ結果重視であり、人間関係の調和（INFJのFe）を最優先にすることや、目の前の感覚データだけに流されることはありません。何よりも「内なるプライベートなビジョン」が現実の行動に先行する、これこそがNi-Teの明確な特徴であり、その逆ではありません`},
    INTP:{alt:'INTJまたはINFP',conf:`\${name}は、INTJのように目標へ突き進む姿や、INFPのように強い信念を抱く姿を見せることがあります`,tell:`主機能であるTiが一貫した判別基準となります。\${name}が構築する思考フレームワークは、何よりも「内なる論理的整合性」を最優先とし、外部での実行可能性や個人の感情は二の次です。INTJはビジョンの実現に邁進し、INFPは自己の価値観に従って動きますが、\${name}はそれらとは異なる、極めて精密な論理の構築そのものを目的としています`},
    ENTJ:{alt:'INTJまたはESTJ',conf:`\${name}は、INTJのように思慮深くプライベートな姿や、ESTJのように手順を厳密に守る姿を見せることがあります`,tell:`主機能のTeが常に外へ向かって機能していることが鍵です。\${name}のエネルギーは「外部世界を組織化する」ことに注がれており、内なるモデルを静かに洗練させること（INTJ）や、既存のルールを守り続けること（ESTJ）が本質ではありません。外部の組織化と実行力こそが、最初から最後まで彼らの核となっています`},
    ENTP:{alt:'ENFPまたはINTJ',conf:`\${name}は、ENFPのように温かく理想主義的な姿や、INTJのように冷徹で戦略的な姿を見せることがあります`,tell:`主機能のNeによる「可能性の追求」こそがその真骨頂です。\${name}の最も自然なモードは、新しいアングルや議論、可能性を生み出し続けることであり、個人的な感情を何よりも優先すること（ENFPの主機能Fi）や、一つの完璧なビジョンへと収束させること（INTJの主機能Ni）ではありません。探索そのものが彼らの最大の動機です`},
    INFJ:{alt:'INFPまたはINTJ',conf:`\${name}は、INFPのように豊かな精神世界を持つ姿や、INTJのように戦略的に身を引く姿を見せることがあります`,tell:`Ni-Feという独特の組み合わせが彼らを定義します。その直観的ビジョンは常に「人々との関係性や成長」に向けて発揮され、これこそがINTJのTeによるシステム実行や、INFPの極めてパーソナルな価値観（Fi）との決定的な違いです。彼らの洞察は共感を通じて世界に関わります`},
    INFP:{alt:'ISFPまたはINFJ',conf:`\${name}は、ISFPのように今この瞬間の感覚に身を委ねる姿や、INFJのように静かに未来を見据える姿を見せることがあります`,tell:`Fi-Neのペアこそがその証明です。価値観は完全に内面で培われた極めて個人的なものであり、認知プロセスは未来の可能性や抽象的なアイデア（Ne）へと開かれています。ISFPは目の前の現実に即した感覚（Se）と感情を結びつけ、INFJは可能性を広げるよりも一つの結論へと収束（Ni）させます。彼らは常に可能性を探索し続けます`},
    ENFJ:{alt:'INFJまたはENFP',conf:`\${name}は、INFJのようにプライベートな洞察を抱く姿や、ENFPのように無邪気に可能性を語る姿を見せることがあります`,tell:`主機能のFeが外に向かって全開で機能している点です。彼らの最も自然な意識は、リアルタイムで周囲の人々がどう感じているかという「感情的現実」に向けられており、INFJのように個人的なNiに引きこもることも、ENFPのようにアイデアの生成（Ne）そのものに没頭することとも異なります。他者との感情的繋がりが常に最優先されます`},
    ENFP:{alt:'ENTPまたはINFP',conf:`\${name}は、ENTPのように議論を楽しむ姿や、INFPのように静かに価値観を守る姿を見せることがあります`,tell:`Ne-Fiという絶妙なバランスがその本質です。\${name}は新しい可能性を絶えず追い求め（Ne）つつ、それが「自分の温かい感情や個人的価値観（Fi）」に真に合致しているかを重視します。ENTPはTiを使って論理的に分析し、INFPはFiを主機能としてまず内面に引きこもりますが、彼らは外向的な熱意と本物の理想主義が完全に一体となっています`},
    ISTJ:{alt:'ISFJまたはINTJ',conf:`\${name}は、ISFJのように静かに人々を支える姿や、INTJのように長期的なシステムを構築する姿を見せることがあります`,tell:`Si-Teという堅実な軸がその正体です。彼らの判断基準は、蓄積された具体的な前例と確立されたルール（Si）であり、それを合理的な実行結果（Te）へと向けます。ISFJの判断は人間関係の調和（Fe）に配慮し、INTJは前例ではなく未来のビジョン（Ni）を追います。彼らの信頼性は、感情やビジョンではなく、確固たる前例に基づいています`},
    ISFJ:{alt:'ISTJまたはINFJ',conf:`\${name}は、ISTJのように実務的で確実な姿や、INFJのように静かに本質を見抜く姿を見せることがあります`,tell:`Si-Feの組み合わせがすべてを物語っています。他者へのケアは、共通の社会的マナーや蓄積された記憶（Si）を通して細やかに届けられます。ISTJのケアは義務や実行結果（Te）に置き換わり、INFJは具体的な過去の記憶ではなく抽象的な直観（Ni）から他者を理解します。彼らの優しさは、長年積み重ねられた「気遣いの歴史」そのものです`},
    ESTJ:{alt:'ENTJまたはISTJ',conf:`\${name}は、ENTJのように野心的に組織を率いる姿や、ISTJのように静かに義務を果たす姿を見せることがあります`,tell:`Te-Siの強固な連携がそれを示しています。実績のある前例（Si）に基づいて、外部の構造やルールを強制的に組織化（Te）します。ENTJは前例を壊して新たなビジョン（Ni）を追い、ISTJは自ら率先して組織を仕切るよりは、既存の義務を忠実に果たします。彼らは新しい規律を自ら打ち立て、効率的に回す司令官です`},
    ESFJ:{alt:'ENFJまたはISFJ',conf:`\${name}は、ENFJのように魅力的に人間関係を率いる姿や、ISFJのように静かに献身する姿を見せることがあります`,tell:`Fe-Siの軸がその本質です。彼らの社会的配慮は、共通のルールや習慣、そして過去の約束（Si）にしっかりとしがみついています。ENFJは習慣よりも未来のビジョン（Ni）によって人々を導き、ISFJは自分が表に立つよりも、一歩引いて人間関係を支えます。彼らはみんなが集まれる確かなルールを守る、コミュニティの中心です`},
    ISTP:{alt:'ISTJまたはESTP',conf:`\${name}は、ISTJのように実直に職務を遂行する姿や、ESTPのように恐れを知らず行動する姿を見せることがあります`,tell:`Ti-Seのシャープな関係性こそがその答えです。頭の中の精密な論理モデル（Ti）がエンジンであり、それを現実世界（Se）で直接試すことを好みます。ISTJは論理よりも過去の規律（Si）を重んじ、ESTPは内なる思考を煮詰める前に、まず行動（Se）が先行します。彼らは頭で考え抜いた極限の論理を、体現する実践者です`},
    ISFP:{alt:'INFPまたはISTP',conf:`\${name}は、INFPのように夢想的でアイデアに溢れる姿や、ISTPのように身体能力に優れ戦術的な姿を見せることがあります`,tell:`Fi-Seの調和にあります。彼らの価値観は常に「今この瞬間」の物理的な世界で身体的に表現され、INFPのような抽象的な未来の妄想（Ne）ではありません。また、彼らの具体的なアクションは、純粋な論理分析（ISTPのTi）ではなく、自らのハートの羅針盤（Fi）に突き動かされています。体と心が完全にシンクロしています`},
    ESTP:{alt:'ENTPまたはISTP',conf:`\ref{name}は、ENTPのように概念的に極めて鋭い姿や、ISTPのように自己完結した姿を見せることがあります`,tell:`主機能のSeによる「圧倒的な現実への没頭」が決定打です。目の前の現実に全力でぶつかり、瞬時にその場の力学を読み取って体が動きます。ENTPは目の前の現実よりも抽象的な可能性（Ne）に惹かれ、ISTPは動く前にまず自分の頭の中で論理モデル（Ti）を完成させようとします。彼らにとって、今この瞬間こそが唯一の真実です`},
    ESFP:{alt:'ENFPまたはESTP',conf:`\${name}は、ENFPのように豊かなアイデアに胸を躍らせる姿や、ESTPのように果敢に現実と渡り合う姿を見せることがあります`,tell:`Se-Fiの生き生きとしたダイナミズムです。彼らの今この瞬間に対するアプローチは、冷徹な論理の計算（ESTPのTi）でも抽象的な未来の可能性（ENFPのNe）でもなく、その場にいる生身の人々に対する「本物の、飾らない温かさ（Fi）」に満ちています。その場のエネルギーと彼らのハートは、常に直結しています`},
  };

  const tp=typeProfile[type]||`${name} operates through the ${type} function stack, with ${dom} (${fnFullName[dom]}) as the engine of every major decision.`;
  const mt=mistypeProfile[type]||{alt:'other types',conf:`surface behaviours can point elsewhere`,tell:`the full function stack, examined across ${name}'s defining moments, is what settles the type`};
  const cc=charContent[sl];

  // ── Who They Are ──
  const whoEl=document.getElementById('who-they-are-text');
  if(whoEl) whoEl.outerHTML=`
    <p>${name}の性格タイプは${type}です。この性格タイプは、単なる行動特徴のチェックリストではなく、世界をどのように認識し、どのように意思決定を行うかを決定づける心理機能（認知プロセス）の階層構造によって定義されます。${name}の場合、その機能スタックは主機能の${dom}（${fnFullName[dom]}）を核とし、補助機能の${aux}（${fnFullName[aux]}）によって支えられています。この順序を理解することで、${name}の行動だけでなく、その背後にある動機、そしてプレッシャーがかかった時、人間関係、あるいは物語の転換点においてなぜそのように反応するのかという理由が明確になります。</p>
    <p>${tp}</p>
    <p>${name}が${type}の優れた実例である理由は、彼らが性格記述のすべての項目に当てはまるからではなく、物語の重要な局面でこの心理機能スタックの力学が極めて一貫して機能しているからです。${ctx}における彼らの物語を決定づける瞬間（ストレス下での決断、判断ミス、そして真の成長を遂げる稀な瞬間）において、そのパターンは常に一貫しています。彼らが最も自然に、真っ先に頼るのが「主機能」であり、彼らを不意打ちし、混乱に陥れるのが「劣等機能」です。</p>
  `;

  // ── Journey ──
  const journeyEl=document.getElementById('journey-text');
  const journeyH=document.getElementById('journey-heading');
  if(journeyH) journeyH.textContent=`${name}：${type}のプロファイルが解き明かすもの`;
  if(journeyEl){
    if(cc&&cc.journey){
      journeyEl.outerHTML=`<div id="journey-text">${cc.journey}</div>`;
    } else {
      journeyEl.outerHTML=`
        <p>${ctx}において、${name}が${type}であることは単なる設定の一部ではなく、彼らが下すすべての重大な選択の設計図となっています。最も信頼し、真っ先に手を伸ばす主機能の${dom}（${fnFullName[dom]}）は、彼らの並外れた有能さの源であり、直面するあらゆる課題に対する彼ら独自の切り札です。</p>
        <p>一方で、劣等機能の${inf}（${fnFullName[inf]}）は、そのコインの裏返しです。これはスタックの中で最も未発達な領域であり、深刻なストレス下や、無防備になる瞬間、あるいは主機能の有能さだけでは対応しきれない物語の決定的な局面で不器用な形で表面化します。${name}が過ちを犯し、驚き、途方に暮れる瞬間は、ほぼ例外なく、この劣等機能が防壁を破って暴走した結果です。</p>
        <p>また、代替機能の${ter}（${fnFullName[ter]}）は、水面下で緩やかに機能します。主機能が過度な負荷にさらされた際の一時的な逃げ場やサポートとして機能し、時に周囲へ通常とは異なる印象（一時的な温かさや論理性など）を与えることがあります。この一過性の変化を代替機能の働きとして捉えることは、${name}のキャラクターの全貌を正確に理解する上で不可欠です。</p>
      `;
    }
  }

  // ── Mistype ──
  /* ── Letter breakdown section ── */
  const lettersSection=document.getElementById('letters-section');
  const lettersEl=document.getElementById('letters-text');
  const lettersH=document.getElementById('letters-heading');
  if(cc&&cc.letters&&lettersSection&&lettersEl){
    lettersSection.style.display='';
    if(lettersH) lettersH.textContent=`${name}：${type} 指標ごとの分析`;
    lettersEl.innerHTML=cc.letters;
  } else if(lettersSection){
    lettersSection.style.display='none';
  }

  const mistypeEl=document.getElementById('mistype-text');
  const mistypeH=document.getElementById('mistype-heading');
  if(mistypeH) mistypeH.textContent=`なぜ${name}は${mt.alt}ではなく${type}なのか？`;
  if(mistypeEl){
    if(cc&&cc.mistype){
      mistypeEl.outerHTML=`<div id="mistype-text">${cc.mistype}</div>`;
    } else {
      mistypeEl.outerHTML=`
        <p>${name}は時に${mt.alt}と誤認されることがあります。表面的な特徴だけをなぞれば、そのような誤解（${mt.conf}）が生じるのも無理はありません。しかし、表層的な振る舞いのマッチングだけでは誤診を生むだけです。心理機能のスタックこそが、その矛盾を明確に解き明かします。</p>
        <p>最も重要な判別基準は、最優先で機能する「主機能」です。${name}の場合、それは${dom}（${fnFullName[dom]}）です。${ctx}における彼のすべての重大な選択（強み、特有の盲点、成功と失敗の具体的なプロセス）は、一貫してこの主機能が起点となっています。このパターンは、他のどのタイプよりも、${dom}を主機能とするスタックに完璧に合致します。</p>
        <p>決定的な証拠として、${mt.tell}が挙げられます。日常の些細な場面ではなく、人生を左右する極限状態の決断や、決定的な失敗、あるいは極度のプレッシャー下で露呈する本能的な行動を精査すれば、彼が${type}であることは疑いようがなく、他の解釈は不自然なこじつけを必要とします。</p>
      `;
    }
  }
}

function renderNotFound(){
  document.getElementById('page-body').innerHTML=`
    <div class="not-found r">
      <h1>404</h1>
      <p>このURLに該当するキャラクターは見つかりませんでした。名前が変更されたか、削除された可能性があります。</p>
      <a class="cta-btn" href="/ja/archive">アーカイブを閲覧する</a>
    </div>`;
  requestAnimationFrame(()=>document.querySelector('.not-found')?.classList.add('in'));
}

// ── Page transition ──
window.addEventListener('DOMContentLoaded',()=>{
  renderPage();
  const ov=document.getElementById('t-overlay');
  if(ov){requestAnimationFrame(()=>{ov.style.transition='opacity 0.45s ease';ov.style.opacity='0';});}
});

// ── Intercept internal links for smooth transition ──
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const href=a.getAttribute('href');
  if(!href||href.startsWith('http')||href.startsWith('#')||href.startsWith('mailto:'))return;
  e.preventDefault();
  const ov=document.getElementById('t-overlay');
  if(ov){ov.style.transition='opacity 0.3s ease';ov.style.opacity='1';}
  setTimeout(()=>window.location.href=href,300);
});
</script>

  }, {passive:true});
})();

<script>
document.addEventListener('DOMContentLoaded',function(){
  if(document.getElementById('page-lm'))return;
