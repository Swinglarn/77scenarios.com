<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0c0e10;--surface:#13161a;--surface2:#1a1e24;--gold:#c9a84c;--gold-dim:#8a6d2e;--cream:#ede8df;--muted:#ccc6bf;--border:#252a30;--radius:14px;}
  html,body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:400;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6;}
  #t-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#0c0e10;opacity:1;}
  .glow{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0;}
  .glow-1{width:600px;height:600px;top:-200px;left:-150px;background:radial-gradient(circle,rgba(201,168,76,0.07) 0%,transparent 70%);}
  .glow-2{width:400px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(120,180,160,0.05) 0%,transparent 70%);}
  main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:64px 32px 96px;}

  /* REVEAL */
  .r{opacity:0;transform:translateY(24px);transition:opacity 0.65s cubic-bezier(0.22,1,0.36,1),transform 0.65s cubic-bezier(0.22,1,0.36,1);}
  .r.in{opacity:1;transform:none;}

  .back-link{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:48px;transition:color 0.2s;}
  .back-link:hover{color:var(--gold);}

  .hero{display:flex;align-items:flex-end;gap:24px;margin-bottom:48px;flex-wrap:wrap;}
  .hero-letter{font-family:'Cormorant Garamond',serif;font-size:clamp(110px,18vw,160px);font-weight:300;line-height:1;color:var(--gold);letter-spacing:-0.05em;}
  .hero-right{padding-bottom:14px;}
  .hero-dim{font-size:12px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4.5vw,46px);font-weight:300;color:var(--cream);line-height:1.1;margin-bottom:8px;}
  .hero-opp{font-size:17px;color:var(--muted);}
  .hero-opp a{color:var(--gold);text-decoration:none;}
  .hero-opp a:hover{text-decoration:underline;}

  /* ── Per-letter hero letter color ── */
  body[data-letter="e"] .hero-letter{color:rgba(248,40,40,1);}
  body[data-letter="i"] .hero-letter{color:rgba(92,72,240,1);}
  body[data-letter="n"] .hero-letter{color:rgba(188,95,255,1);}
  body[data-letter="s"] .hero-letter{color:rgba(252,220,30,1);}
  body[data-letter="t"] .hero-letter{color:rgba(40,205,248,1);}
  body[data-letter="f"] .hero-letter{color:rgba(38,210,85,1);}
  body[data-letter="j"] .hero-letter{color:rgba(240,245,255,1);}
  body[data-letter="p"] .hero-letter{color:rgba(252,148,28,1);}

  /* ── Per-letter page accent (opp link, active nav underline) ── */
  body[data-letter="e"] .hero-opp a{color:rgba(248,40,40,1);}
  body[data-letter="i"] .hero-opp a{color:rgba(92,72,240,1);}
  body[data-letter="n"] .hero-opp a{color:rgba(188,95,255,1);}
  body[data-letter="s"] .hero-opp a{color:rgba(252,220,30,1);}
  body[data-letter="t"] .hero-opp a{color:rgba(40,205,248,1);}
  body[data-letter="f"] .hero-opp a{color:rgba(38,210,85,1);}
  body[data-letter="j"] .hero-opp a{color:rgba(240,245,255,1);}
  body[data-letter="p"] .hero-opp a{color:rgba(252,148,28,1);}

  .section{margin-bottom:48px;}
  .section-label{font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:10px;}
  .section-label::after{content:'';display:block;flex:1;height:1px;background:var(--border);}
  .body-text{font-size:16px;line-height:1.9;color:#cdc7c0;}
  .body-text+.body-text{margin-top:16px;}

  .traits-row{display:flex;flex-wrap:wrap;gap:10px;}
  .trait{font-size:12px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;padding:8px 16px;border-radius:30px;border:1px solid var(--border);color:var(--muted);background:var(--surface);}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:580px){.two-col{grid-template-columns:1fr;}}
  .box{background:#131820;border:1px solid #2a3848;border-radius:var(--radius);padding:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .box-title{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
  .box-text{font-size:14px;color:#cdc7c0;line-height:1.85;}
  .box ul{list-style:none;}
  .box ul li{font-size:14px;color:#c8c0b8;line-height:1.75;padding:9px 0;border-bottom:1px solid #2a3848;display:flex;gap:12px;align-items:flex-start;}
  .box ul li:last-child{border-bottom:none;}
  .box ul li::before{content:'–';color:var(--gold-dim);flex-shrink:0;margin-top:2px;}

  .growth-box{background:#131820;border:1px solid #2a3848;border-left:3px solid var(--gold-dim);border-radius:var(--radius);padding:24px 28px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .growth-box .box-title{color:var(--gold);}

  .types-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:580px){.types-grid{grid-template-columns:repeat(2,1fr);}}
  .type-mini{display:block;text-decoration:none;background:#131820;border:1px solid #2a3848;border-radius:10px;padding:14px 16px;transition:border-color 0.2s,transform 0.25s,box-shadow 0.25s;box-shadow:inset 0 1px 0 rgba(255,255,255,0.04),0 2px 8px rgba(0,0,0,0.35);}
  .type-mini:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,0.5);}
  .type-mini:hover{border-color:var(--gold-dim);transform:translateY(-2px);}
  .mini-code{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--cream);letter-spacing:-0.02em;}
  .mini-code .hi{color:var(--gold);}
  .mini-name{font-size:12px;color:var(--muted);letter-spacing:0.05em;margin-top:3px;}

  .opp-block{background:#131820;border:1px solid #2a3848;border-radius:var(--radius);padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .opp-left{display:flex;align-items:center;gap:18px;}
  .opp-letter{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;line-height:1;color:var(--muted);}
  .opp-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--cream);margin-bottom:3px;}
  .opp-sub{font-size:12px;color:var(--muted);}
  .btn-outline{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;border:1px solid var(--border);border-radius:60px;padding:12px 22px;cursor:pointer;text-decoration:none;transition:all 0.2s;}
  .btn-outline:hover{border-color:var(--gold-dim);color:var(--gold);}

  .cta-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .cta-text{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--cream);line-height:1.4;}
  .cta-text em{font-style:italic;color:var(--gold);}
  .btn-gold{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#0c0e10;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;border:none;border-radius:60px;padding:14px 28px;cursor:pointer;text-decoration:none;transition:all 0.25s;}
  .btn-gold:hover{background:var(--cream);transform:translateY(-2px);}
  .sep{height:1px;background:var(--border);margin:48px 0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  body.light-mode .body-text{color:#1e2d4a;}
  body.light-mode .opp-desc{color:#1e2d4a;}

<script>
const letters={
  E:{
    name:"Extroversão",dim:"Energia",opp:"I",oppName:"Introversão",
    oppDesc:"Energizado pelo mundo interior, reflexão, profundidade, tempo a sós.",
    p1:"Os extrovertidos não apenas gostam de pessoas, eles pensam através delas. A conversa é onde as ideias são testadas e refinadas, não onde os pensamentos finalizados são relatados. Quando algo o está incomodando, falar sobre isso faz com que pareça menor. Quando algo é emocionante, dizer em voz alta torna-o mais real.",
    p2:"Grandes redes de contatos surgem naturalmente e você as mantém sem esforço. Conhecer alguém novo não é uma tarefa a ser superada; costuma ser bom, muitas vezes excelente. Você atende chamadas telefônicas que outras pessoas responderiam por mensagem. Você sugere atividades em grupo. O que custa energia social para os outros, você costuma ganhar, o que é bom saber, pois significa que você frequentemente pode ser quem dá o primeiro passo.",
    traits:["Comunicativo","Caloroso","Socialmente fluído","Orientado à ação","Expressivo"],
    strengths:["Constrói conexões naturalmente e as mantém sem que pareça um esforço de manutenção","Comunica ideias com energia, com o pensamento e a fala acontecendo juntos","Energiza grupos através de sua presença e engajamento","Lê situações sociais rapidamente e se adapta de acordo"],
    daily:"Você atende a ligação em vez de responder por mensagem. Descobre o que alguém faz da vida nos primeiros minutos de conversa. Seu melhor raciocínio acontece conversando. Fins de semana sem planos sociais começam a parecer pesados na tarde de domingo.",
    growth:"Algumas de suas melhores ideias ainda estão se formando. Dar a elas espaço para se desenvolverem antes que outras vozes entrem, antes das reações, das reformulações e do consenso do grupo, pode torná-las mais nítidas. A pausa antes de falar tem mais valor do que costuma receber.",
    types:["ESTJ","ESFJ","ENFJ","ENTJ","ESTP","ESFP","ENFP","ENTP"],
    typeNames:{ESTJ:"Diretor",ESFJ:"Cuidador",ENFJ:"Professor",ENTJ:"Comandante",ESTP:"Dínamo",ESFP:"Animador",ENFP:"Campeão",ENTP:"Visionário"}
  },
  I:{
    name:"Introversão",dim:"Energia",opp:"E",oppName:"Extroversão",
    oppDesc:"Energizado pelo mundo exterior, pessoas, atividade, conversa.",
    p1:"Introversão não é timidez. A distinção importa. Os introvertidos podem ser confiantes, persuasivos, até magnéticos; a diferença é que o engajamento social tem um custo. Após uma longa noite com pessoas, mesmo pessoas de quem você gosta, há um esgotamento que exige um tempo de recuperação real. Esse tempo não é evitação. É manutenção.",
    p2:"O que você produz sozinho tende a ser mais refinado do que o que surge em tempo real. Você pensou sobre isso por mais tempo, analisou mais profundamente, percebeu os pontos fracos. As ideias que você compartilha geralmente passaram por várias rodadas de edição interna que ninguém vê. Isso torna sua contribuição mais ponderada, e significa que as coisas que você diz em uma sala tendem a ter mais peso, em parte porque você diz menos delas.",
    traits:["Reflexivo","Reservado","Busca profundidade","Autossuficiente","Deliberado"],
    strengths:["Pensamento independente que não precisa de validação externa para se desenvolver","Escuta com atenção real, não esperando para falar, mas ouvindo de verdade","Poucos, mas profundos relacionamentos, nos quais se investe totalmente","O resultado costuma ser mais refinado por conta do processo interno pelo qual passa primeiro"],
    daily:"Você envia mensagem antes de ligar. Precisa de um dia ou dois para descompressão após um período de intensa atividade social. Suas melhores ideias surgem no banho, em uma caminhada ou às 23h. Você já foi chamado de 'quieto' por pessoas que ainda não o tinham visto com a pessoa certa.",
    growth:"Ser conhecido exige ser visível. Existem relacionamentos e oportunidades que só se abrem para pessoas que se apresentam antes de se sentirem totalmente prontas, que compartilham o pensamento semi-formado, que estão presentes antes de terem processado tudo. As pessoas que vale a pena ter em sua vida compensam parte desse desconforto.",
    types:["ISTJ","ISFJ","INFJ","INTJ","ISTP","ISFP","INFP","INTP"],
    typeNames:{ISTJ:"Inspetor",ISFJ:"Protetor",INFJ:"Conselheiro",INTJ:"Arquiteto",ISTP:"Artesão",ISFP:"Artista",INFP:"Mediador",INTP:"Pensador"}
  },
  S:{
    name:"Sensação",dim:"Percepção",opp:"N",oppName:"Intuição",
    oppDesc:"Confia em padrões, possibilidades e no que pode ser inferido.",
    p1:"Você confia no que pode verificar. Não porque lhe falte imaginação, mas porque o espaço entre a teoria e a prática é onde a maioria das ideias desmorona silenciosamente, e você aprendeu a notar isso. Os detalhes concretos que os outros ignoram, a redação específica, o número real, o que aconteceu exatamente, tendem a ficar com você.",
    p2:"A sensação é a preferência mais comum e sustenta a infraestrutura da vida diária. Os planos são executados. Detalhes são lembrados. O trabalho é feito de acordo com o padrão esperado. As pessoas ao seu redor se beneficiam disso de maneiras que muitas vezes não valorizam totalmente até que esteja ausente.",
    traits:["Prático","Detalhista","Focado no presente","Confiável","Observador"],
    strengths:["Detecta erros e inconsistências que outros teriam deixado passar","Executes planos minuciosamente sem precisar que a visão geral esteja visível a todo momento","Memória para detalhes específicos, palavras exatas, datas e eventos que os outros deixam apagar","Pés no chão de uma maneira que proporciona estabilidade real para as pessoas ao seu redor"],
    daily:"Você lê os termos antes de assinar. Lembra-se do que alguém disse, não apenas da impressão geral. Segue uma receita na primeira vez e a ajusta na segunda. Termina o que começa antes de passar para a próxima coisa.",
    growth:"Algumas das coisas mais importantes ainda não aconteceram. O padrão que prevê para onde algo está indo, a possibilidade que ainda não está visível, a inferência que se mostra correta — essas são fontes reais de informação. Confiar um pouco mais no que pode ser inferido, e não apenas observado, abre territórios que a experiência direta por si só não consegue alcançar.",
    types:["ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"],
    typeNames:{ISTJ:"Inspetor",ISFJ:"Protetor",ESTJ:"Diretor",ESFJ:"Cuidador",ISTP:"Artesão",ISFP:"Artista",ESTP:"Dínamo",ESFP:"Animador"}
  },
  N:{
    name:"Intuição",dim:"Percepção",opp:"S",oppName:"Sensação",
    oppDesc:"Confia no que é concreto, observável e presente.",
    p1:"Você absorve informações e imediatamente começa a identificar o padrão subjacente. Para onde as coisas estão indo, com o que se conectam, o que está implícito, mas não dito. O momento presente tende a lhe interessar menos do que o que ele sugere sobre o futuro. Isso não é falta de atenção. É um tipo diferente de atenção.",
    p2:"As ideias surgem rapidamente e em grupos. Você provavelmente já teve a experiência de ver algo com clareza — onde um projeto está dando errado, o que uma pessoa realmente está dizendo, qual decisão precisa ser tomada — bem antes de qualquer outra pessoa na sala. O desafio geralmente não é a visão. É permanecer com a visão tempo suficiente para que ela se torne algo real.",
    traits:["Imaginativo","Focado no futuro","Busca padrões","Conceitual","Visionário"],
    strengths:["Vê para onde as coisas estão caminhando antes que elas cheguem lá","Conecta ideias entre diferentes áreas de formas que produzem conclusões genuinamente novas","Faz a pergunta subjacente que está por trás da pergunta que todos os outros estão respondendo","Opera naturalmente no nível de estratégia e significado, e não apenas de execução"],
    daily:"Você lê nas entrelinhas habitualmente. Fica entediado em conversas que permanecem na superfície. Já começou muitas coisas que não terminou. Geralmente há algo que você está processando mentalmente em segundo plano.",
    growth:"O presente também é real. A pessoa à sua frente, a tarefa em suas mãos, o que é realmente verdade agora — tudo isso também merece sua total atenção, e nem sempre a recebe. Alguns dos padrões que você vê são projeções. Não todos, mas o suficiente para que manter-se próximo ao que é verificável seja um contrapeso útil.",
    types:["INFJ","INTJ","ENFJ","ENTJ","INFP","INTP","ENFP","ENTP"],
    typeNames:{INFJ:"Conselheiro",INTJ:"Arquiteto",ENFJ:"Professor",ENTJ:"Comandante",INFP:"Mediador",INTP:"Pensador",ENFP:"Campeão",ENTP:"Visionário"}
  },
  T:{
    name:"Pensamento",dim:"Julgamento",opp:"F",oppName:"Sentimento",
    oppDesc:"Decide através de valores, harmonia e impacto humano.",
    p1:"Quando avalia algo, você o passa por uma estrutura de lógica e consistência. Isso faz sentido? Há alguma contradição aqui? O que esse princípio implicaria em outros casos? Isso acontece de forma rápida e automática. O que parece bom senso para você é, na verdade, uma estrutura interna altamente desenvolvida que a maioria das pessoas não usa da mesma maneira.",
    p2:"A franqueza é uma forma de respeito em sua opinião. Dizer a verdade difícil com clareza é mais gentil do que florear, porque florear faz a outra pessoa perder tempo e geralmente significa que ela ainda não terá a informação de que precisa. Você se cobra o mesmo padrão que cobra dos outros, o que é genuinamente justo, mesmo que nem sempre pareça assim visto de fora.",
    traits:["Analítico","Objetivo","Direto","Pautado por princípios","Consistente"],
    strengths:["Avalia com precisão e não se contenta com a resposta mais confortável","Aplica padrões consistentemente, sem casos especiais ou exceções baseadas em quem está assistindo","Mantém a cabeça fria sob pressão, quando os outros se tornam reativos","Comunicação que não faz as pessoas adivinharem sua posição"],
    daily:"Você dá feedback sem suavizá-lo a ponto de perder a utilidade. Espera a mesma franqueza de volta. Um argumento que você considera logicamente fraco não se torna mais persuasivo porque a pessoa que o apresenta está chateada. Já lhe disseram que você é muito direto quando tentava ajudar.",
    growth:"A lógica é poderosa e incompleta ao mesmo tempo. A informação emocional em uma situação é dado, não ruído a ser filtrado. Como algo repercute, o que isso causa na confiança ao longo do tempo, do que a camada oculta de uma conversa realmente trata — tudo isso é real e afeta os resultados. Aprender a considerar esses fatores não compromete seu rigor. O expande.",
    types:["ISTJ","INTJ","ESTJ","ENTJ","ISTP","INTP","ESTP","ENTP"],
    typeNames:{ISTJ:"Inspetor",INTJ:"Arquiteto",ESTJ:"Diretor",ENTJ:"Comandante",ISTP:"Artesão",INTP:"Pensador",ESTP:"Dínamo",ENTP:"Visionário"}
  },
  F:{
    name:"Sentimento",dim:"Julgamento",opp:"T",oppName:"Pensamento",
    oppDesc:"Decide através de lógica, objetividade e princípios consistentes.",
    p1:"Você toma decisões pesando o impacto humano juntamente com os fatos. Quem é afetado, o que importa para essas pessoas, se o resultado é consistente com o que você acredita ser o correto. Esse não é um processo simples ou fraco. Exige manter em mente as experiências de várias pessoas simultaneamente e encontrar um caminho que respeite a todas, o que é mais difícil do que aplicar um único padrão objetivo.",

function render(){
  const p=new URLSearchParams(window.location.search);
  const pathMatch=window.location.pathname.match(/\/letters\/([a-zA-Z])(?:$|\/)/);
  const l=(pathMatch?pathMatch[1]:p.get('l')||'E').toUpperCase();
  const d=letters[l];
  if(!d){document.getElementById('content').innerHTML='<p style="color:var(--muted)">Letra não encontrada.</p>';return;}
  document.title=`${l} · ${d.name} no Myers-Briggs, 77 Scenarios`;

  // Dynamic SEO
  const keyPhrases={E:'introvert vs extrovert, extraversion definition, what is extraversion',I:'introversion definition, introvert meaning, what is introversion',S:'sensing personality, what is sensing MBTI, sensing vs intuition',N:'intuition personality type, what is intuition MBTI, sensing vs intuition',T:'thinking personality type, MBTI thinking meaning, thinking vs feeling',F:'feeling personality type, MBTI feeling meaning, thinking vs feeling',J:'judging personality type, MBTI judging meaning, judging vs perceiving',P:'perceiving personality type, MBTI perceiving meaning, judging vs perceiving'};
  const seoDesc=`O que significa a letra ${l} (${d.name}) no Myers-Briggs? ${d.p1.slice(0,160).replace(/<[^>]+>/g,'')}...`;
  let dm=document.querySelector('meta[name="description"]');
  if(!dm){dm=document.createElement('meta');dm.name='description';document.head.appendChild(dm);}
  dm.content=seoDesc;
  let km=document.querySelector('meta[name="keywords"]');
  if(!km){km=document.createElement('meta');km.name='keywords';document.head.appendChild(km);}
  km.content=`personalidade ${l}, ${d.name.toLowerCase()} mbti, significado ${d.name.toLowerCase()}, myers-briggs ${l}, ${keyPhrases[l]||''}`;
  document.getElementById('canonical-url')?.setAttribute('href',`https://77scenarios.com/letters/${l.toLowerCase()}`);
  document.body.dataset.letter = l.toLowerCase();
  document.querySelector('meta[property="og:title"]')?.setAttribute('content',`${l} · ${d.name} no Myers-Briggs, 77 Scenarios`)||
    (()=>{const m=document.createElement('meta');m.setAttribute('property','og:title');m.content=`${l} · ${d.name} no Myers-Briggs, 77 Scenarios`;document.head.appendChild(m);})();
  document.querySelector('meta[property="og:description"]')?.setAttribute('content',seoDesc)||
    (()=>{const m=document.createElement('meta');m.setAttribute('property','og:description');m.content=seoDesc;document.head.appendChild(m);})();
  document.querySelector('meta[property="og:url"]')?.setAttribute('content',`https://77scenarios.com/letters/${l.toLowerCase()}`)||
    (()=>{const m=document.createElement('meta');m.setAttribute('property','og:url');m.content=`https://77scenarios.com/letters/${l.toLowerCase()}`;document.head.appendChild(m);})();
  const h1el=document.getElementById('page-h1');if(h1el)h1el.textContent=`${l} · ${d.name} no Myers-Briggs`;
  document.getElementById('letter-schema').textContent=JSON.stringify({"@context":"https://schema.org","@graph":[{"@type":"Article","@id":`https://77scenarios.com/letters/${l.toLowerCase()}#article`,"headline":`A Letra ${l} no Myers-Briggs: ${d.name} Explicada`,"description":seoDesc,"url":`https://77scenarios.com/letters/${l.toLowerCase()}`,"keywords":`${l} personality, ${d.name.toLowerCase()} MBTI, ${d.name.toLowerCase()} meaning`,"articleSection":"Myers-Briggs Personality Dimensions","inLanguage":"en","dateModified":"2026-05-19","publisher":{"@type":"Organization","@id":"https://77scenarios.com/#organization","name":"77 Scenarios"},"isPartOf":{"@type":"WebSite","@id":"https://77scenarios.com/#website"}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Início","item":"https://77scenarios.com"},{"@type":"ListItem","position":2,"name":"8 Letras","item":"https://77scenarios.com/letters"},{"@type":"ListItem","position":3,"name":`${l} — ${d.name}`,"item":`https://77scenarios.com/letters/${l.toLowerCase()}`}]}]});

  const typesHTML=d.types.map(t=>`
    <a href="/pt/types/${t.toLowerCase()}" class="type-mini">
      <div class="mini-code">${t.split('').map(c=>c===l?`<span class="hi">${c}</span>`:c).join('')}</div>
      <div class="mini-name">${d.typeNames[t]||''}</div>
    </a>`).join('');

  document.getElementById('content').innerHTML=`
    <div class="hero r" data-d="1">
      <div class="hero-letter">${l}</div>
      <div class="hero-right">
        <div class="hero-dim">Dimensão ${d.dim}</div>
        <div class="hero-name">${d.name}</div>
        <div class="hero-opp">Oposto: <a href="/pt/letters/${d.opp.toLowerCase()}">${d.opp} · ${d.oppName}</a></div>
      </div>
    </div>
    <div class="section r" data-d="2"><div class="section-label">O que significa</div><p class="body-text">${d.p1}</p><p class="body-text">${d.p2}</p></div>
    <div class="section r" data-d="3"><div class="section-label">Traços</div><div class="traits-row">${d.traits.map(t=>`<span class="trait">${t}</span>`).join('')}</div></div>
    <div class="two-col section r" data-d="4">
      <div class="box"><div class="box-title">Pontos fortes</div><ul>${d.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>
      <div class="box"><div class="box-title">No dia a dia</div><div class="box-text">${d.daily}</div></div>
    </div>
    <div class="growth-box section r" data-d="5"><div class="box-title">Caminho de crescimento</div><div class="box-text">${d.growth}</div></div>
    <div class="section r" data-d="6"><div class="section-label">Tipos com ${l}</div><div class="types-grid">${typesHTML}</div></div>
    <div class="sep r" data-d="7"></div>
    <div class="section r" data-d="8">
      <div class="section-label">O outro lado</div>
      <div class="opp-block">
        <div class="opp-left">
          <div class="opp-letter">${d.opp}</div>
          <div><div class="opp-name">${d.oppName}</div><div class="opp-sub">${d.oppDesc}</div></div>
        </div>
        <a href="/pt/letters/${d.opp.toLowerCase()}" class="btn-outline">Explorar ${d.opp} →</a>
      </div>
    </div>
    <div class="cta-block r" data-d="9">
      <div class="cta-text">Descubra <em>as suas</em> letras<br>através de cenários reais.</div>
      <a href="/pt/" class="btn-gold">Fazer o teste →</a>
    </div>`;

  document.querySelectorAll('.r').forEach(el=>obs.observe(el));
}

const ov=document.getElementById('t-overlay');
function fadeIn(){ov.style.opacity='1';ov.animate([{opacity:1},{opacity:0}],{duration:550,delay:60,easing:'cubic-bezier(0.22,1,0.36,1)',fill:'forwards'});}
fadeIn();
window.addEventListener('pageshow',e=>{if(e.persisted)fadeIn();});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const h=a.getAttribute('href');
  if(!h||h.startsWith('#')||h.startsWith('http')||h.startsWith('javascript')||h.startsWith('mailto'))return;
  e.preventDefault();
  ov.animate([{opacity:0},{opacity:1}],{duration:320,easing:'cubic-bezier(0.76,0,0.24,1)',fill:'forwards'}).finished.then(()=>{window.location.href=h;});
});

const obs=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(!en.isIntersecting)return;
    setTimeout(()=>en.target.classList.add('in'),parseFloat(en.target.dataset.d||0)*70);
    obs.unobserve(en.target);
  });
},{threshold:0.155});

render();
</script>
