<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Tipo vs Tipo | 77 Scenarios</title>
  <meta name="description" id="page-desc" content="Descubra a real diferença cognitiva entre estes dois tipos de personalidade.">
  <meta property="og:title" content="Tipo vs Tipo — Comparações de MBTI | 77 Scenarios">
  <meta property="og:description" content="Compare dois tipos de personalidade MBTI lado a lado. 120 comparações detalhadas cobrindo funções cognitivas, exemplos famosos e principais diferenças.">
  <meta property="og:image" content="https://77scenarios.com/og-image.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0e10;
      --surface: #131820;
      --surface2: #1a2232;
      --border: #2a3848;
      --gold: #c9a84c;
      --gold-dim: #9a7e3a;
      --cream: #ede8df;
      --text-body: #c8c0b8;
      --text-muted: #7a8088;
      --fn-in-bg: #0f1d2e;
      --fn-in-text: #7bafd4;
      --fn-ex-bg: #1e1708;
      --fn-ex-text: #c9a84c;
      --max-w: 800px;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .vs-page {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 24px 100px;
    }

    /* ── Breadcrumb ──────────────────────────────────── */
    .vs-breadcrumb {
      padding: 20px 0 0;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .vs-breadcrumb a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .vs-breadcrumb a:hover { color: var(--gold); }
    .vs-breadcrumb span { margin: 0 6px; opacity: 0.4; }

    /* ── Hero ─────────────────────────────────────────── */
    .vs-hero {
      padding: 48px 0 44px;
      text-align: center;
    }

    .vs-types-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-bottom: 22px;
    }

    .vs-type-badge { text-align: center; }

    .vs-type-code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(52px, 10vw, 80px);
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 3px;
      line-height: 1;
    }

    .vs-type-role {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .vs-vs-word {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
      color: var(--text-muted);
      opacity: 0.5;
      flex-shrink: 0;
      padding-bottom: 24px;
    }

    .vs-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-style: italic;
      color: var(--text-muted);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .vs-rule {
      width: 48px;
      height: 1px;
      background: var(--gold);
      opacity: 0.4;
      margin: 24px auto;
    }

    /* ── Sections ─────────────────────────────────────── */
    .vs-section { margin-bottom: 60px; }

    .vs-section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Prose ────────────────────────────────────────── */
    .vs-prose p {
      font-size: 15.5px;
      line-height: 1.85;
      color: var(--text-body);
      margin-bottom: 18px;
    }
    .vs-prose p:last-child { margin-bottom: 0; }

    /* ── Functions ────────────────────────────────────── */
    .vs-fn-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .vs-fn-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);
    }

    .vs-fn-col-header {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-weight: 600;
      color: var(--cream);
      text-align: center;
      margin-bottom: 14px;
    }

    .vs-fn-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .vs-fn-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12.5px;
    }

    .vs-fn-item.introverted { background: var(--fn-in-bg); color: var(--fn-in-text); }
    .vs-fn-item.extroverted { background: var(--fn-ex-bg); color: var(--fn-ex-text); }

    .vs-fn-code { font-weight: 500; width: 26px; flex-shrink: 0; }
    .vs-fn-label { opacity: 0.75; flex: 1; }
    .vs-fn-rank { font-size: 10.5px; opacity: 0.45; white-space: nowrap; }

    /* ── Table ────────────────────────────────────────── */
    .vs-table {
      width: 100%;
      border-collapse: collapse;
    }

    .vs-table thead tr { background: var(--surface2); }

    .vs-table th {
      padding: 13px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .vs-table th:first-child {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 120px;
    }

    .vs-table th:not(:first-child) {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--gold);
    }

    .vs-table tbody tr { border-bottom: 1px solid var(--border); }
    .vs-table tbody tr:nth-child(even) { background: var(--surface); }
    .vs-table tbody tr:last-child { border-bottom: none; }

    .vs-table td {
      padding: 13px 16px;
      font-size: 14px;
      color: var(--text-body);
      vertical-align: top;
      line-height: 1.55;
    }

    .vs-table td:first-child {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    /* ── Overlap ──────────────────────────────────────── */
    .vs-overlap-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vs-overlap-item {
      display: flex;
      gap: 14px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14.5px;
      color: var(--text-body);
      line-height: 1.65;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);
    }

    .vs-overlap-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
      margin-top: 9px;
      opacity: 0.7;
    }

    /* ── Tell Apart ───────────────────────────────────── */
    .vs-tell-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vs-tell-item {
      padding: 20px 22px 20px 22px;
      border-left: 3px solid var(--gold);
      background: var(--surface);
      border-radius: 0 8px 8px 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);
    }

    .vs-tell-num {
      font-size: 10.5px;
      color: var(--gold);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 5px;
      opacity: 0.8;
    }

    .vs-tell-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 10px;
    }

    .vs-tell-body {
      font-size: 14.5px;
      color: var(--text-body);
      line-height: 1.8;
    }

    /* ── Famous ───────────────────────────────────────── */
    .vs-famous-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .vs-famous-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);
    }

    .vs-famous-col-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .vs-famous-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    .vs-famous-row:last-child { border-bottom: none; padding-bottom: 0; }

    .vs-famous-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      color: var(--gold);
    }

    .vs-famous-name { font-size: 13.5px; color: var(--cream); }
    .vs-famous-role { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }

    /* ── Quiz ─────────────────────────────────────────── */
    .vs-quiz {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px 28px 24px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);
    }

    .vs-quiz-intro {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .vs-quiz-q-num {
      font-size: 10.5px;
      color: var(--gold);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    .vs-quiz-q-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      color: var(--cream);
      line-height: 1.4;
      margin-bottom: 18px;
    }

    .vs-quiz-options {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .vs-quiz-option {
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface2);
      color: var(--text-body);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 300;
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
      transition: border-color 0.14s, background 0.14s;
      min-height: 48px;
    }

    .vs-quiz-option:hover { border-color: var(--gold-dim); background: rgba(201,168,76,0.06); }
    .vs-quiz-option.selected { border-color: var(--gold); background: #1e1608; color: var(--cream); }

    .vs-quiz-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
    }

    .vs-quiz-prog-bar {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .vs-quiz-prog-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      transition: width 0.3s ease;
      opacity: 0.6;
    }

    .vs-quiz-prog-text {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .vs-quiz-btn {
      padding: 10px 20px;
      background: var(--gold);
      color: #0c0e10;
      border: none;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.14s;
    }

    .vs-quiz-btn:hover { background: #d4b45e; }
    .vs-quiz-btn:disabled { opacity: 0.35; cursor: default; }

    /* Result */
    .vs-quiz-result {
      text-align: center;
      padding: 12px 0 8px;
    }

    .vs-quiz-result-type {
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px;
      font-weight: 600;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 6px;
    }

    .vs-quiz-result-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .vs-quiz-result-desc {
      font-size: 14.5px;
      color: var(--text-body);
      line-height: 1.75;
      max-width: 480px;
      margin: 0 auto 22px;
    }

    .vs-quiz-result-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .vs-quiz-result-link {
      display: inline-block;
      padding: 10px 22px;
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      border-radius: 4px;
      font-size: 12.5px;
      letter-spacing: 0.4px;
      transition: background 0.14s;
    }

    .vs-quiz-result-link:hover { background: rgba(201,168,76,0.1); }

    .vs-quiz-reset {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      margin-top: 14px;
      text-decoration: underline;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── CTA ──────────────────────────────────────────── */
    .vs-cta {
      text-align: center;
      padding: 50px 0 0;
      border-top: 1px solid var(--border);
    }

    .vs-cta-copy {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .vs-cta-btn {
      display: inline-block;
      padding: 13px 34px;
      background: var(--gold);
      color: #0c0e10;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.4px;
      transition: background 0.14s;
    }

    .vs-cta-btn:hover { background: #d4b45e; }

    /* ── Not found ────────────────────────────────────── */
    .vs-not-found {
      text-align: center;
      padding: 80px 0;
    }

    .vs-not-found h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      color: var(--cream);
      margin-bottom: 12px;
    }

    .vs-not-found p { color: var(--text-muted); margin-bottom: 24px; font-size: 15px; }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 600px) {
      .vs-fn-compare,
      .vs-famous-grid { grid-template-columns: 1fr; }

      .vs-type-code { font-size: 42px; }
      .vs-types-row { gap: 16px; }

      .vs-table th,
      .vs-table td { padding: 11px 12px; font-size: 13px; }

      .vs-table th:first-child,
      .vs-table td:first-child { width: 90px; white-space: normal; }

      .vs-tell-item { padding: 16px 16px 16px 18px; }
      .vs-quiz { padding: 22px 18px 20px; }
      .vs-quiz-q-text { font-size: 18px; }
    }
    /* ── Hub index page ───────────────────────────────── */
    .vs-hub { padding: 48px 0 0; }

    .vs-hub-header { margin-bottom: 40px; }

    .vs-hub-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 7vw, 56px);
      font-weight: 600;
      color: var(--cream);
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .vs-hub-title em { font-style: italic; color: var(--gold); }

    .vs-hub-desc {
      font-size: 15.5px;
      color: var(--text-muted);
      max-width: 560px;
      line-height: 1.7;
    }

    .vs-hub-section { margin-bottom: 48px; }

    .vs-hub-section-title {
      font-size: 10.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .vs-hub-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .vs-hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .vs-pair-card {
      display: block;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold-dim);
      border-radius: 8px;
      text-decoration: none;
      transition: border-color 0.2s,border-left-color 0.2s,transform 0.25s,box-shadow 0.25s;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);
    }
    .vs-pair-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,rgba(201,168,76,0.1),transparent 65%);
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    .vs-pair-card:hover {
      border-color: var(--gold-dim);
      border-left-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08),0 20px 50px rgba(0,0,0,0.55);
    }
    .vs-pair-card:hover::after { opacity: 1; }

    .vs-pair-card-types {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }
    .vs-pair-card-types .vt { color: var(--gold); }
    .vs-pair-card-types .vv { color: var(--cream); font-style: italic; font-size: 16px; font-weight: 400; }

    .vs-pair-card-tag {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      .vs-hub-grid { grid-template-columns: 1fr 1fr; }
      .vs-pair-card-types { font-size: 17px; }
    }

    /* ── Light mode ───────────────────────────────────── */
    body.light-mode {
      --surface: #f0f3f8;
      --surface2: #e8eef6;
      --border: #b0bcd0;
      --text-body: #1e2d4a;
      --text-muted: #706860;
    }
    body.light-mode .vs-fn-col,
    body.light-mode .vs-overlap-item,
    body.light-mode .vs-quiz,
    body.light-mode .vs-famous-col {
      box-shadow: 0 2px 10px rgba(30,60,100,0.08),0 1px 3px rgba(30,60,100,0.05);
    }
    body.light-mode .vs-tell-item {
      box-shadow: 0 2px 10px rgba(30,60,100,0.08);
    }
    body.light-mode .vs-fn-item.introverted { background: #d8eaf8; color: #1a4a70; }
    body.light-mode .vs-fn-item.extroverted { background: #f5eedc; color: #7a5010; }
    body.light-mode .vs-table thead tr { background: #e8eef6; }
    body.light-mode .vs-table tbody tr:nth-child(even) { background: #f0f3f8; }
    body.light-mode .vs-table td { border-bottom-color: #c8d4e0; }
    body.light-mode .vs-table th { border-bottom-color: #b0bcd0; }
    body.light-mode .vs-quiz-option.selected { background: rgba(201,168,76,0.12); color: #1e2d4a; }
    body.light-mode .vs-quiz-option:hover { background: rgba(201,168,76,0.07); }
    body.light-mode .vs-famous-avatar { background: #e8eef6; }
    body.light-mode .vs-rule { background: #b0bcd0; }
  </style>

var vsData = {};
  // Externalized to /data/vs-db.js

/* ============================================================

   ============================================================ */
function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

let slug = '';

/* ============================================================
   QUIZ
   ============================================================ */
function mountQuiz(quiz, typeA, typeB, container) {
  let current = 0;
  const answers = new Array(quiz.questions.length).fill(null);

  function renderQuestion() {
    const total = quiz.questions.length;
    const pct   = Math.round((current / total) * 100);
    const q     = quiz.questions[current];
    const isLast = current === total - 1;

    container.innerHTML = `
      <p class="vs-quiz-intro">5 perguntas específicas para esta combinação. Selecione a opção que melhor se adapta a você.</p>
      <div class="vs-quiz-prog-bar"><div class="vs-quiz-prog-fill" style="width:${pct}%"></div></div>
      <div class="vs-quiz-q-num">Pergunta ${current + 1} de ${total}</div>
      <div class="vs-quiz-q-text">${q.q}</div>
      <div class="vs-quiz-options">
        <button class="vs-quiz-option" data-score="${q.a.score}">${q.a.text}</button>
        <button class="vs-quiz-option" data-score="${q.b.score}">${q.b.text}</button>
      </div>
      <div class="vs-quiz-footer">
        <span class="vs-quiz-prog-text">${current + 1} / ${total}</span>
        <button class="vs-quiz-btn" id="quiz-next" disabled>${isLast ? 'Ver resultado' : 'Próxima'}</button>
      </div>
    `;

    container.querySelectorAll('.vs-quiz-option').forEach(btn => {
      btn.addEventListener('click', function () {
        container.querySelectorAll('.vs-quiz-option').forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        answers[current] = this.dataset.score;
        container.querySelector('#quiz-next').disabled = false;
      });
    });

    container.querySelector('#quiz-next').addEventListener('click', () => {
      if (answers[current] === null) return;
      current++;
      if (current >= total) renderResult();
      else renderQuestion();
    });
  }

  function renderResult() {
    const aCount = answers.filter(v => v === 'A').length;
    const bCount = answers.filter(v => v === 'B').length;
    let result;
    if (aCount > bCount)      result = quiz.resultA;
    else if (bCount > aCount) result = quiz.resultB;
    else                      result = quiz.resultTie;

    const typeSlug  = result.type !== '?' ? result.type.toLowerCase() : null;
    const typeLink  = typeSlug ? `/pt/types/${typeSlug}` : '/pt/';
    const linkLabel = typeSlug ? `Ler sobre ${result.type}` : 'Fazer o teste completo';

    container.innerHTML = `
      <div class="vs-quiz-result">
        <div class="vs-quiz-result-type">${result.type}</div>
        <div class="vs-quiz-result-label">${result.label}</div>
        <div class="vs-quiz-result-desc">${result.desc}</div>
        <div class="vs-quiz-result-links">
          <a class="vs-quiz-result-link" href="${typeLink}">${linkLabel}</a>
          <a class="vs-quiz-result-link" href="/pt/">Fazer o teste completo</a>
        </div>
        <button class="vs-quiz-reset">Refazer o quiz</button>
      </div>
    `;

    container.querySelector('.vs-quiz-reset').addEventListener('click', () => {
      current = 0;
      answers.fill(null);
      renderQuestion();
    });
  }

  renderQuestion();
}

/* ============================================================

   ============================================================ */
function renderPage(data) {
  const root = document.getElementById('vs-root');

  // SEO
  const titleText = `${data.typeA} vs ${data.typeB}: A Real Diferença | 77 Scenarios`;
  document.getElementById('page-title').textContent = titleText;
  document.getElementById('page-desc').setAttribute('content', data.metaDesc);

  // Canonical
  let canonical = document.querySelector('link[rel="canonical"]');
  if (!canonical) {
    canonical = document.createElement('link');
    canonical.rel = 'canonical';
    document.head.appendChild(canonical);
  }
  canonical.href = `https://77scenarios.com/pt/vs/${data.typeA.toLowerCase()}-${data.typeB.toLowerCase()}`;

  // Silently correct URL if user landed on a mirror slug (e.g. /vs/enfp-enfj -> /vs/enfj-enfp)
  const canonicalSlug = `${data.typeA.toLowerCase()}-${data.typeB.toLowerCase()}`;
  if (slug !== canonicalSlug) {
    window.history.replaceState(null, '', `/pt/vs/${canonicalSlug}`);
  }

  // OG tags
  function setMeta(prop, val, attr) {
    let el = document.querySelector(`meta[${attr||'property'}="${prop}"]`);
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr||'property', prop); document.head.appendChild(el); }
    el.setAttribute('content', val);
  }
  setMeta('og:title',       titleText);
  setMeta('og:description', data.metaDesc);
  setMeta('og:url',         `https://77scenarios.com/pt/vs/${data.typeA.toLowerCase()}-${data.typeB.toLowerCase()}`);
  setMeta('og:image',       'https://77scenarios.com/og-image.png');
  setMeta('twitter:card',   'summary_large_image', 'name');
  setMeta('twitter:title',  titleText, 'name');
  setMeta('twitter:description', data.metaDesc, 'name');

  // Functions HTML
  function fnColHTML(type, fns) {
    const rows = fns.map(f => {
      const meta = fnMeta[f.code];
      return `<div class="vs-fn-item ${meta.dir}">
        <span class="vs-fn-code">${f.code}</span>
        <span class="vs-fn-label">${meta.name}</span>
        <span class="vs-fn-rank">${f.rank}</span>
      </div>`;
    }).join('');
    return `<div class="vs-fn-col">
      <div class="vs-fn-col-header">${type}</div>
      <div class="vs-fn-stack">${rows}</div>
    </div>`;
  }

  // Table HTML
  const tableRows = data.tableRows.map(r => `<tr>
    <td>${r.label}</td>
    <td>${r.a}</td>
    <td>${r.b}</td>
  </tr>`).join('');

  // Overlap HTML
  const overlapItems = data.overlap.map(o => `<li class="vs-overlap-item">
    <div class="vs-overlap-dot"></div>
    <span>${o}</span>
  </li>`).join('');

  // Tell apart HTML
  const tellItems = data.tellApart.map((t, i) => `<div class="vs-tell-item">
    <div class="vs-tell-num">Ponto ${i + 1}</div>
    <div class="vs-tell-title">${t.title}</div>
    <div class="vs-tell-body">${t.body}</div>
  </div>`).join('');

  // Famous HTML
  function famousColHTML(type, people) {
    const rows = people.map(p => `<div class="vs-famous-row">
      <div class="vs-famous-avatar">${initials(p.name)}</div>
      <div>
        <div class="vs-famous-name">${p.name}</div>
        <div class="vs-famous-role">${p.role}</div>
      </div>
    </div>`).join('');
    return `<div class="vs-famous-col">
      <div class="vs-famous-col-title">${type}</div>
      ${rows}
    </div>`;
  }

  root.innerHTML = `
    <nav class="vs-breadcrumb">
      <a href="/pt/">Início</a><span>/</span><a href="/pt/vs">vs</a><span>/</span>
      <span>${data.typeA} vs ${data.typeB}</span>
    </nav>

    <header class="vs-hero">
      <div class="vs-types-row">
        <div class="vs-type-badge">
          <div class="vs-type-code">${data.typeA}</div>
          <div class="vs-type-role">${data.roleA}</div>
        </div>
        <div class="vs-vs-word">vs</div>
        <div class="vs-type-badge">
          <div class="vs-type-code">${data.typeB}</div>
          <div class="vs-type-role">${data.roleB}</div>
        </div>
      </div>
      <div class="vs-rule"></div>
      <p class="vs-tagline">${data.tagline}</p>
    </header>

    <section class="vs-section">
      <h2 class="vs-section-title">A Diferença Central</h2>
      <div class="vs-prose">${data.coreDiff}</div>
    </section>

    <section class="vs-section">
      <h2 class="vs-section-title">Funções Cognitivas</h2>
      <div class="vs-fn-compare">
        ${fnColHTML(data.typeA, data.functionsA)}
        ${fnColHTML(data.typeB, data.functionsB)}
      </div>
    </section>

    <section class="vs-section">
      <h2 class="vs-section-title">Lado a Lado</h2>
      <table class="vs-table">
        <thead><tr>
          <th></th>
          <th>${data.typeA}</th>
          <th>${data.typeB}</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </section>

    <section class="vs-section">
      <h2 class="vs-section-title">Onde se Sobrepõem</h2>
      <ul class="vs-overlap-list">${overlapItems}</ul>
    </section>

    <section class="vs-section">
      <h2 class="vs-section-title">Como Diferenciá-los</h2>
      <div class="vs-tell-list">${tellItems}</div>
    </section>

    <section class="vs-section">
      <h2 class="vs-section-title">Exemplos Famosos</h2>
      <div class="vs-famous-grid">
        ${famousColHTML(data.typeA, data.famousA)}
        ${famousColHTML(data.typeB, data.famousB)}
      </div>
    </section>

    <section class="vs-section">
      <h2 class="vs-section-title">Não tem Certeza de Qual Você É?</h2>
      <div class="vs-quiz" id="quiz-mount"></div>
    </section>

    <div class="vs-cta">
      <p class="vs-cta-copy">Ainda na dúvida? O teste completo usa 77 questões baseadas em cenários para lhe dar um resultado muito mais claro.</p>
      <a class="vs-cta-btn" href="/pt/">Fazer o teste 77 Scenarios</a>
    </div>
  `;

  // Mount quiz (after innerHTML so the element exists)
  mountQuiz(data.quiz, data.typeA, data.typeB, document.getElementById('quiz-mount'));

  // ── Schema: Article + FAQPage ──────────────────────────────────────────────
  const vsUrl = `https://77scenarios.com/pt/vs/${data.typeA.toLowerCase()}-${data.typeB.toLowerCase()}`;
  const faqSchema = {
    '@context': 'https://schema.org',
    '@graph': [
      {
        '@type': 'Article',
        '@id': vsUrl + '#article',
        'headline': `${data.typeA} vs ${data.typeB}: A Real Diferença`,
        'description': data.metaDesc,
        'url': vsUrl,
        'keywords': `${data.typeA}, ${data.typeB}, MBTI comparison, personality type difference, cognitive functions`,
        'articleSection': 'Comparações de Tipos de Personalidade',
        'inLanguage': 'pt-BR',
        'dateModified': '2026-05-19',
        'publisher': {
          '@type': 'Organization',
          '@id': 'https://77scenarios.com/#organization',
          'name': '77 Scenarios',
          'url': 'https://77scenarios.com'
        },
        'isPartOf': { '@type': 'WebSite', '@id': 'https://77scenarios.com/#website' }
      },
      {
        '@type': 'FAQPage',
        '@id': vsUrl + '#faq',
        'mainEntity': data.tellApart.map(function(item) {
          return {
            '@type': 'Question',
            'name': 'Como diferenciar ' + data.typeA + ' de ' + data.typeB + '? ' + item.title,
            'acceptedAnswer': {
              '@type': 'Answer',
              'text': item.body
            }
          };
        })
      }
    ]
  };
  // Inject or replace the vs schema script
  var existing = document.getElementById('vs-schema');
  if (!existing) {
    existing = document.createElement('script');
    existing.type = 'application/ld+json';
    existing.id = 'vs-schema';
    document.head.appendChild(existing);
  }
  existing.text = JSON.stringify(faqSchema);
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  const parts = window.location.pathname.split('/').filter(Boolean);
  const isPt = parts[0] === 'pt';
  slug = isPt ? (parts[2] || '') : (parts[1] || '');
  // Try canonical slug, then reversed (e.g. intj-infp stored as intj-infp)
  const reversedSlug = slug.split('-').length === 2 ? slug.split('-').reverse().join('-') : '';
  const data = vsData[slug] || vsData[reversedSlug] || null;
  const root = document.getElementById('vs-root');

  if (!slug) {
    renderIndex();
    return;
  }

  if (!data) {
    document.getElementById('page-title').textContent = 'Combinação Não Encontrada | 77 Scenarios';
    root.innerHTML = `
      <div class="vs-not-found">
        <h1>${slug.toUpperCase().replace(/-/g, ' vs ').replace(/\bvs\b/, 'vs')}</h1>
        <p>Esta combinação ainda não está disponível. Navegue por todas as comparações ou faça o teste completo para descobrir seu tipo.</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <a href="/pt/vs" class="vs-cta-btn">Todas as comparações</a>
          <a href="/pt/" class="vs-cta-btn" style="background:none;border:1px solid var(--gold);color:var(--gold);">Fazer o teste</a>
        </div>
      </div>
    `;
    return;
  }

  renderPage(data);
})();
