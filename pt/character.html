<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  a{color:inherit;text-decoration:none;}
  :root{--bg:#0c0e10;--surface:#13161a;--surface2:#1a1e24;--gold:#c9a84c;--gold-dim:#8a6d2e;--cream:#ede8df;--muted:#b5ada6;--border:#252a30;--radius:14px;}
  html,body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6;}
  #t-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#0c0e10;opacity:1;}
  .glow{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0;}
  .glow-1{width:600px;height:600px;top:-200px;left:-150px;background:radial-gradient(circle,rgba(201,168,76,0.07) 0%,transparent 70%);}
  .glow-2{width:400px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(120,180,160,0.05) 0%,transparent 70%);}

  /* ── PAGE LAYOUT ── */
  main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:56px 24px 96px;}
  .breadcrumb{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:32px;display:flex;align-items:center;gap:8px;}
  .breadcrumb a{color:var(--muted);transition:color 0.2s;}
  .breadcrumb a:hover{color:var(--gold);}
  .breadcrumb span{opacity:0.4;}

  /* ── HERO ── */
  .hero{display:flex;gap:32px;align-items:flex-start;margin-bottom:48px;}
  .hero-avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0;background:var(--surface2);}
  .hero-avatar-placeholder{width:120px;height:120px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;}
  .hero-avatar-placeholder span{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:var(--gold-dim);}
  .hero-info{flex:1;min-width:0;}
  .hero-type{font-family:'Cormorant Garamond',serif;font-size:64px;font-weight:300;color:var(--gold);line-height:1;margin-bottom:8px;}
  .hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5vw,42px);font-weight:300;color:var(--cream);line-height:1.1;margin-bottom:6px;}
  .hero-ctx{font-size:14px;color:var(--muted);margin-bottom:16px;}
  .hero-cat-badge{display:inline-block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);border-radius:20px;padding:3px 12px;background:rgba(201,168,76,0.07);}
  @media(max-width:560px){.hero{flex-direction:column;gap:20px;}.hero-avatar,.hero-avatar-placeholder{width:80px;height:80px;}.hero-avatar-placeholder span{font-size:26px;}.hero-type{font-size:48px;}}

  /* ── CONTENT SECTIONS ── */
  .section{margin-bottom:20px;background:#131820;border:1px solid #2a3848;border-radius:14px;padding:28px 32px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 4px 16px rgba(0,0,0,0.45);}
  .section-label{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #2e3a44;}
  .section p{font-size:15px;color:#c8c0b8;line-height:1.85;margin-bottom:16px;}
  .section p:last-child{margin-bottom:0;}
  .letter-block{margin-bottom:36px;}
  .letter-block:last-child{margin-bottom:0;}
  .letter-display{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2e3a44;}
  .letter-big{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:700;color:var(--gold);line-height:1;}
  .letter-word{font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold-dim);font-weight:500;}
  .letter-block p{font-size:15px;color:#c8c0b8;line-height:1.85;margin-bottom:16px;}
  .section h2{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--cream);margin-bottom:20px;line-height:1.2;}
  .section h3{font-size:14px;font-weight:500;color:var(--cream);margin-bottom:10px;margin-top:24px;letter-spacing:0.04em;}

  /* ── FUNCTION GRID ── */
  .fn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:8px;}
  .fn-card{background:#0f1620;border:1px solid #273444;border-radius:10px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 8px rgba(0,0,0,0.4);}
  .fn-card.dominant{border-color:var(--gold-dim);background:rgba(201,168,76,0.04);}
  .fn-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .fn-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--gold);margin-bottom:6px;}
  .fn-desc{font-size:12px;color:var(--muted);line-height:1.6;}

  /* ── VERDICT BOX ── */
  .verdict{background:#131820;border:1px solid #2a3848;border-left:4px solid var(--gold);border-radius:var(--radius);padding:24px 28px;margin-top:28px;margin-bottom:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 6px 20px rgba(0,0,0,0.5);}
  .verdict-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .verdict p{font-size:15px;color:var(--cream);line-height:1.8;}
  /* static light-mode overrides — fires before nav.js injection */
  body.light-mode .verdict{background:#1e2d4a!important;border-color:#2d4168!important;border-left-color:#c9a84c!important}
  body.light-mode .verdict-label{color:#c9a84c!important}
  body.light-mode .verdict p{color:#ffffff!important}
  body.light-mode .section p{color:#1e2d4a!important}
  body.light-mode .section h2,body.light-mode .section h3{color:#1e2d4a!important}
  body.light-mode .fn-card .fn-name *{color:#1e2d4a!important}
  body.light-mode .letter-big{color:#1e2d4a!important}
  body.light-mode .letter-word{color:#8a6d2e!important}

  /* ── KEYWORDS / TAGS ── */
  .tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .tag{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #2e3a44;color:var(--muted);background:var(--surface2);}

  /* ── RELATED ── */
  .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
  .related-card{background:#131820;border:1px solid #2a3848;border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color 0.2s,transform 0.25s,box-shadow 0.25s;text-decoration:none;display:block;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .related-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,0.07),transparent);opacity:0;transition:opacity 0.25s;pointer-events:none;}
  .related-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08),0 20px 50px rgba(0,0,0,0.55);}
  .related-card:hover::after{opacity:1;}
  .related-type{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--gold);margin-bottom:4px;}
  .related-name{font-size:13px;color:var(--cream);font-weight:400;margin-bottom:2px;line-height:1.3;}
  .related-ctx{font-size:11px;color:var(--muted);}
  .universe-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .actor-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .actor-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:var(--surface);border:1px solid #2e3a44;border-radius:8px;text-decoration:none;transition:border-color 0.15s,transform 0.15s;font-size:13px;color:var(--muted);}
  .actor-chip:hover{border-color:rgba(201,168,76,0.35);transform:translateY(-1px);}
  .actor-chip-label{font-size:11px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;margin-right:2px;}
  .actor-chip-name{color:var(--cream);}
  .universe-chip{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border:1px solid #2e3a44;border-radius:8px;text-decoration:none;transition:border-color 0.15s,transform 0.15s;flex-shrink:0;}
  .universe-chip:hover{border-color:rgba(201,168,76,0.35);transform:translateY(-1px);}
  .universe-chip-type{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:var(--gold);line-height:1;}
  .universe-chip-name{font-size:13px;color:var(--cream);line-height:1;}

  /* ── CTA ── */
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:48px;padding-top:32px;border-top:1px solid var(--border);}
  .cta-btn{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);background:transparent;padding:11px 20px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;text-decoration:none;display:inline-block;}
  .cta-btn:hover{background:rgba(201,168,76,0.1);}
  .cta-btn.sec{color:var(--muted);border-color:var(--border);}
  .cta-btn.sec:hover{color:var(--cream);border-color:var(--muted);}

  /* ── 404 ── */
  .not-found{text-align:center;padding:96px 0;}
  .not-found h1{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:var(--gold);margin-bottom:16px;}
  .not-found p{font-size:15px;color:var(--muted);margin-bottom:32px;}

  /* ── ANIMATIONS ── */
  .r{opacity:0;transform:translateY(18px);transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),transform 0.55s cubic-bezier(0.22,1,0.36,1);}
  .r.in{opacity:1;transform:none;}

  footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:32px;text-align:center;}
  footer p{font-size:12px;color:var(--muted);}
  footer a{color:var(--muted);transition:color 0.2s;}
  footer a:hover{color:var(--cream);}

  /* Reading progress bar */
  #reading-progress{position:fixed;top:56px;left:0;width:0%;height:2px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));z-index:199;transition:width 0.1s linear;pointer-events:none;}

  /* Light mode - character page specific card overrides */
  body.light-mode .section{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08),0 1px 3px rgba(30,60,100,0.05);}
  body.light-mode .section p{color:#1e2d4a;}
  body.light-mode .letter-block p{color:#1e2d4a;}
  body.light-mode .section-label{border-bottom-color:#b0bcd0;}
  body.light-mode .verdict{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08);}
  body.light-mode .fn-card{background:#e8eef6;border-color:#b0bcd0;box-shadow:0 1px 4px rgba(30,60,100,0.07);}
  body.light-mode .related-card{background:#f0f3f8;border-color:#b0bcd0;box-shadow:0 2px 10px rgba(30,60,100,0.08),0 1px 3px rgba(30,60,100,0.05);}
  body.light-mode .actor-chip,body.light-mode .universe-chip{background:#f0f3f8;border-color:#b0bcd0;}
  body.light-mode .tag{background:#e8eef6;border-color:#b0bcd0;}
</style>

<script>
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
</script>
<script>
/* ── RENDER ── */
function getPathSlug(){
  const parts=location.pathname.split('/').filter(Boolean);
  // expects /character/slug
  if(parts[0]==='character'&&parts[1])return parts[1];
  return null;
}

function renderPage(){
  const ps=getPathSlug();
  if(!ps){renderNotFound();return;}
  const p=people.filter(Boolean).find(x=>slug(x.name)===ps);
  if(!p){renderNotFound();return;}

  // ── SEO meta ──
  const title=`${p.name} MBTI Personality Type (${p.type}) · 77 Scenarios`;
  const desc=`${p.name} is ${p.type}. ${p.desc.slice(0,150).trim()}…`;
  const url=`https://77scenarios.com/character/${ps}`;
  document.getElementById('page-title').textContent=title;
  document.getElementById('page-desc').setAttribute('content',desc);
  document.getElementById('page-kw').setAttribute('content',(p.kw||[]).join(', ')+`, ${p.type} personality type, ${p.type} MBTI, cognitive functions ${p.type}`);
  document.getElementById('og-title').setAttribute('content',title);
  document.getElementById('og-desc').setAttribute('content',desc);
  document.getElementById('og-url').setAttribute('content',url);
  document.getElementById('canonical-url').setAttribute('href',url);
  const charImgUrl=`https://77scenarios.com/images/characters/${ps}.jpg`;
  document.querySelector('meta[property="og:image"]').setAttribute('content',charImgUrl);
  document.querySelector('meta[name="twitter:image"]').setAttribute('content',charImgUrl);

  // ── Schema ──
  const typeLabel = {'INTJ':'The Architect','INTP':'The Logician','ENTJ':'The Commander','ENTP':'The Debater','INFJ':'The Advocate','INFP':'The Mediator','ENFJ':'The Protagonist','ENFP':'The Campaigner','ISTJ':'The Logistician','ISFJ':'The Defender','ESTJ':'The Executive','ESFJ':'The Consul','ISTP':'The Virtuoso','ISFP':'The Adventurer','ESTP':'The Entrepreneur','ESFP':'The Entertainer'}[p.type]||p.type;
  const isFictional = ['Fiction','Film','Anime','Game','Animation'].includes(p.cat);
  const personType = isFictional ? 'Person' : (p.cat === 'Historical' ? 'Person' : 'Person');
  const schema={
    '@context':'https://schema.org',
    '@graph':[
      {
        '@type': personType,
        '@id': url + '#person',
        'name': p.name,
        'description': p.ctx,
        'image': charImgUrl,
        'url': url,
        'sameAs': [],
        'knowsAbout': [p.type, typeLabel, 'cognitive functions', 'MBTI personality type']
      },
      {
        '@type':'Article',
        '@id': url + '#article',
        'headline': `${p.name} - ${p.type} Personality Type Analysis`,
        'description': desc,
        'image': charImgUrl,
        'url': url,
        'about': { '@id': url + '#person' },
        'author': {
          '@type': 'Organization',
          '@id': 'https://77scenarios.com/#organization',
          'name': '77 Scenarios',
          'url': 'https://77scenarios.com'
        },
        'keywords': (p.kw||[]).join(', '),
        'articleSection': 'Personality Type Analysis',
        'inLanguage': 'en',
        'dateModified': '2026-05-19T00:00:00+00:00',
        'publisher': {
          '@type': 'Organization',
          '@id': 'https://77scenarios.com/#organization',
          'name': '77 Scenarios',
          'url': 'https://77scenarios.com'
        },
        'isPartOf': { '@type': 'WebSite', '@id': 'https://77scenarios.com/#website' }
      },
      {
        '@type': 'BreadcrumbList',
        'itemListElement': [
          { '@type': 'ListItem', 'position': 1, 'name': 'Home',    'item': 'https://77scenarios.com' },
          { '@type': 'ListItem', 'position': 2, 'name': 'Archive', 'item': 'https://77scenarios.com/archive' },
          { '@type': 'ListItem', 'position': 3, 'name': p.cat,     'item': `https://77scenarios.com/archive?cat=${encodeURIComponent(p.cat)}` },
          { '@type': 'ListItem', 'position': 4, 'name': p.name,    'item': url }
        ]
      }
    ]
  };
  document.getElementById('page-schema').textContent=JSON.stringify(schema);

  // ── Functions ──
  const stack=fnStack[p.type]||{fns:[],labels:[]};
  const fnCardsHTML=stack.fns.map((fn,i)=>`
    <div class="fn-card${i===0?' dominant':''}">
      <div class="fn-label">${stack.labels[i]}</div>
      <div class="fn-name">${fn} <span style="font-family:'DM Sans';font-size:13px;color:var(--muted);font-weight:300;">${fnFullName[fn]||''}</span></div>
      <div class="fn-desc">${fnDesc[fn]||''}</div>
    </div>`).join('');

  // ── Related (same type, different entries) ──
  const related=people.filter(Boolean).filter(x=>x.type===p.type&&slug(x.name)!==ps).sort(()=>Math.random()-0.5).slice(0,6);
  const relatedHTML=related.map(r=>`
    <a class="related-card" href="/pt/character/${slug(r.name)}">
      <div class="related-type">${r.type}</div>
      <div class="related-name">${r.name}</div>
      <div class="related-ctx">${r.ctx}</div>
    </a>`).join('');

  // ── Same universe characters ──
  const normCtx=c=>c.split('(')[0].split(',')[0].trim().toLowerCase();
  const universeChars=people.filter(Boolean).filter(x=>normCtx(x.ctx)===normCtx(p.ctx)&&slug(x.name)!==ps&&!x.knownFor&&!x.playedBy);
  const universeHTML=universeChars.length?`
    <div class="section-label" style="margin-bottom:12px;">Also from ${p.ctx.split('(')[0].trim()}</div>
    <div class="universe-strip">
      ${universeChars.map(u=>`<a class="universe-chip" href="/pt/character/${slug(u.name)}"><span class="universe-chip-type">${u.type}</span><span class="universe-chip-name">${u.name.split('/')[0].trim()}</span></a>`).join('')}
    </div>`:'';

  // ── Played by / Known for ──
  const playedByPerson=p.playedBy?people.filter(Boolean).find(x=>slug(x.name)===p.playedBy):null;
  const knownForChar=p.knownFor?people.filter(Boolean).find(x=>slug(x.name)===p.knownFor):null;
  const actorStripHTML=(playedByPerson||knownForChar)?`
    <div class="actor-strip">
      ${playedByPerson?`<a class="actor-chip" href="/pt/character/${p.playedBy}"><span class="actor-chip-label">Played by</span><span class="actor-chip-name">${playedByPerson.name} (${playedByPerson.type})</span></a>`:''}
      ${knownForChar?`<a class="actor-chip" href="/pt/character/${p.knownFor}"><span class="actor-chip-label">Known for</span><span class="actor-chip-name">${knownForChar.name}</span></a>`:''}
    </div>`:'';

  // ── Avatar ──
  const avatarHTML=`<img class="hero-avatar" id="hero-avatar" alt="${p.name}" style="opacity:0;transition:opacity 0.3s;">`;

  // ── Keywords / tags ──
  const tagsHTML=(p.kw&&p.kw.length)?`<div class="tag-row">${p.kw.map(k=>`<span class="tag">${k}</span>`).join('')}</div>`:'';

  // ── Full body HTML ──
  document.getElementById('page-body').innerHTML=`
    <div class="breadcrumb r" data-d="0">
      <a href="/pt/archive">Archive</a>
      <span>/</span>
      <span>${p.cat}</span>
      <span>/</span>
      <span>${p.name}</span>
    </div>

    const img=document.getElementById('hero-avatar');

    function updateOgImage(src){
      const full=src.startsWith('http')?src:`https://77scenarios.com${src}`;
      const om=document.querySelector('meta[property="og:image"]');
      const tm=document.querySelector('meta[name="twitter:image"]');
      if(om)om.setAttribute('content',full);
      if(tm)tm.setAttribute('content',full);
      try{
        const s=JSON.parse(document.getElementById('page-schema').textContent);
        if(s['@graph']){const per=s['@graph'].find(n=>n['@id']&&n['@id'].endsWith('#person'));if(per){per.image=full;document.getElementById('page-schema').textContent=JSON.stringify(s);}}
      }catch(e){}
    }

    function tryWikipedia(){
      if(p.wiki){
        fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.wiki))
          .then(r=>r.ok?r.json():null)
          .then(data=>{
            const img2=document.getElementById('hero-avatar');
            if(!img2)return;
            const src=data&&data.thumbnail&&data.thumbnail.source;
            if(src){img2.src=src;img2.onload=function(){img2.style.opacity='1';};updateOgImage(src);}
            else{img2.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;}
          })
          .catch(()=>{
            const img2=document.getElementById('hero-avatar');
            if(img2)img2.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;
          });
      } else {
        img.outerHTML=`<div class="hero-avatar-placeholder"><span>${p.type.slice(0,1)}</span></div>`;
      }
    }

    if(img){
      const tryJpg=new Image();
      tryJpg.onload=function(){img.src=jpgSrc;img.onload=function(){img.style.opacity='1';};updateOgImage(jpgSrc);};
      tryJpg.onerror=function(){
        const tryGif=new Image();
        tryGif.onload=function(){img.src=gifSrc;img.onload=function(){img.style.opacity='1';};updateOgImage(gifSrc);};
        tryGif.onerror=function(){tryWikipedia();};
        tryGif.src=gifSrc;
      };
      tryJpg.src=jpgSrc;
    }
  }

/* ── EXPANDED CONTENT ──────────────────────────────────────────────
   Deterministic, character-aware content generation.
   Uses p.name, p.type, p.ctx, p.desc and per-type lookup tables
   to produce content that feels specific to this character and world,
   not just the generic MBTI type. Zero API calls, zero latency.
   ─────────────────────────────────────────────────────────────── */
function loadExpandedContent(p){
  const name=p.name.split('/')[0].trim();
  const type=p.type;
  const ctx=p.ctx||'their source material';
  const stack=fnStack[type]||{fns:['?','?','?','?'],labels:[]};
  const dom=stack.fns[0]||'?';
  const aux=stack.fns[1]||'?';
  const ter=stack.fns[2]||'?';
  const inf=stack.fns[3]||'?';
  const sl=p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

  /* ── Character-specific Journey + Mistype content ── */
  // Externalized to /data/char-content-{lang}.js

  /* ── Per-type: what this cognitive stack looks like in practice ── */
  const typeProfile={
    INTJ:`${name} opera a partir de um modelo interno privado que a maioria das pessoas ao seu redor nunca vê completamente. A função dominante é Ni (Intuição Introvertida) – um processo de síntese de padrões que trabalha sob a superfície, reunindo observações em convicções de longo alcance que chegam completas em vez de argumentadas. ${name} frequentemente sabe para onde algo está indo antes de qualquer outra pessoa e age com base nesse conhecimento sem precisar explicá-lo, porque o processo Ni não é facilmente externalizado. Te (Pensamento Extravertido) como auxiliar canaliza a visão em estrutura, sistemas e ação decisiva: o modelo produz um plano, o plano produz resultados, e os resultados são avaliados em relação ao modelo e não em relação ao que os outros esperavam. O resultado é um personagem que parece seguro, independente e difícil de redirecionar – porque geralmente é. A vulnerabilidade é a Se inferior (Sensação Extravertida): ${name} pode ser pego de surpresa por realidades físicas do momento presente que o modelo não levou em conta, ou tornar-se perigosamente desapegado do mundo imediato ao viver inteiramente dentro da arquitetura interna.`,
    INTP:`A mente de ${name} é um instrumento de precisão. Ti (Pensamento Introvertido) é a função dominante – constrói estruturas lógicas internas rigorosas que são mais importantes para ${name} do que o consenso externo, aprovação social ou sabedoria recebida. A estrutura é primária; todo o resto é entrada para ser testada em relação a ela. Ne (Intuição Extravertida) como auxiliar gera as possibilidades, alternativas e ângulos que o Ti analisa com total rigor. O resultado é um personagem que é infinitamente curioso, genuinamente difícil de satisfazer com respostas simples e profundamente desconfortável com conclusões que não podem ser totalmente justificadas. A Fe inferior (Sentimento Extravertido) é o sinal revelador: em momentos de estresse ou profundidade genuína, ${name} revela uma necessidade de conexão e reconhecimento que entra em clara tensão com seu desapego habitual – a função que raramente usa, de repente fazendo exigências que a função dominante não está equipada para atender.`,
    ENTJ:`${name} lidera por padrão – não por ego, mas por Te (Pensamento Extravertido) dominante, a função que analisa cada situação para ver o que precisa ser organizado, quem é capaz de fazê-lo e qual sistema produzirá o melhor resultado. Ni (Intuição Introvertida) como auxiliar fornece a visão de longo alcance que torna o comando de ${name} mais do que mera gestão: eles estão se movendo em direção a algo específico e abrangente, e as pessoas ao seu redor devem acompanhar o ritmo. A combinação produz um personagem que é estrategicamente inteligente, visivelmente confiante e capaz de construir instituições que duram mais do que sua participação. O ponto fraco é a Fi inferior (Sentimento Introvertido): ${name} pode passar por cima do que as pessoas realmente valorizam e precisam, não por crueldade, mas por uma dificuldade real em dar ao sentimento pessoal o mesmo peso que o resultado estratégico que o Te está otimizando.`,
    ENTP:`${name} funciona com base na Ne (Intuição Extravertida) – a geração constante de ângulos, possibilidades, argumentos e conexões que ninguém mais fez ainda. Cada conversa é uma oportunidade para encontrar o limite de uma ideia; cada posição definida é algo a ser testado contra suas próprias contradições. Ti (Pensamento Introvertido) fornece o rigor analítico que impede que as ideias de ${name} sejam apenas divertidas: a Ne gera a hipótese, o Ti a avalia, e a combinação produz alguém que é estimulante, intelectualmente formidável e ocasionalmente exaustivo. A Si inferior (Sensação Introvertida) é a sombra: ${name} pode ser notavelmente ruim com o mundano, a rotina e o passado como referência – preferindo a próxima ideia ao último compromisso, e pagando um preço recorrente por isso.`,
    INFJ:`${name} mantém duas coisas simultaneamente que a maioria das pessoas não consegue: uma visão de longo alcance de como as coisas deveriam ser e uma sensibilidade precisa de como as pessoas realmente se sentem agora. Ni (Intuição Introvertida) é a função dominante – trabalha sob a superfície, sintetizando observações e padrões em convicções que chegam completas e são difíceis de desalojar uma vez formadas. Fe (Sentimento Extravertido) é a auxiliar – garante que a visão seja sempre mantida em relação às pessoas, não apenas a princípios abstratos. A combinação produz alguém que é ao mesmo tempo visionário e profundamente empático, muitas vezes ao ponto da exaustão. A Se inferior (Sensação Extravertida) é onde ${name} é mais vulnerável: a realidade física imediata e o momento presente podem emboscá-lo de maneiras que o reconhecimento de padrões de longo alcance nunca modelou.`,
    INFP:`A vida interior de ${name} é a realidade primária. Fi (Sentimento Introvertido) é a função dominante – um sistema de valores profundamente pessoal que ${name} usa para avaliar tudo, silenciosa e constantemente. Não é visível na superfície, razão pela qual ${name} é frequentemente interpretado incorretamente como passivo ou vago: a intensidade é inteiramente interna. Ne (Intuição Extravertida) como auxiliar gera as possibilidades, conexões e enquadramentos alternativos que permitem a ${name} imaginar como as coisas poderiam ser, em vez de apenas como são. A Te inferior (Pensamento Extravertido) é o ponto fraco consistente: a execução, estrutura, responsabilidade externa e a tradução da visão interior em resultados concretos são onde ${name} perde terreno e onde o crescimento, quando vem, é mais visível.`,
    ENFJ:`${name} lê o ambiente antes de entrar nele. Fe (Sentimento Extravertido) é a função dominante – uma sintonia social e emocional tão precisa que ${name} frequentemente sabe o que as pessoas precisam antes que elas mesmas consigam articular. Ni (Intuição Introvertida) como auxiliar significa que essa sintonia é estratégica e empática: ${name} está trabalhando em direção a algo específico, e o calor humano é ao mesmo tempo genuíno e direcional. O resultado é um personagem inspirador, relacionalmente perceptivo e capaz de mover grupos em direção a uma visão compartilhada. A Ti inferior (Pensamento Introvertido) é o ponto fraco: ${name} pode ser notavelmente inconsistente em sua lógica interna, racionalizando decisões que são prioritariamente emocionais, e tornando-se defensivo quando essas racionalizações são examinadas de perto.`,
    ENFP:`${name} é movido pela Ne (Intuição Extravertida) – um entusiasmo perpétuo pelo que poderia ser, quais conexões ninguém mais fez ainda e quais possibilidades o momento atual contém. Fi (Sentimento Introvertido) como auxiliar ancora isso em valores pessoais genuínos: ${name} não está apenas interessado em possibilidades – ele se importa com quais realmente importam. O resultado é um personagem caloroso, criativamente generoso e capaz de real profundidade – mas que luta com a lacuna entre o entusiasmo e a execução, e entre a visão e a estrutura necessária para realizá-la. A Si inferior (Sensação Introvertida) é a responsabilidade recorrente: ${name} tende a desvalorizar o passado, o estabelecido, a rotina e o acumulado – e paga por isso regularmente.`,
    ISTJ:`${name} é construído em torno da Si (Sensação Introvertida) – uma biblioteca interna abrangente de experiências acumuladas, precedentes e procedimentos estabelecidos. O que funcionou antes é o guia mais confiável para o que funcionará agora, e ${name} confia nessa biblioteca acima de quase qualquer outra coisa. Te (Pensamento Extravertido) como auxiliar traduz isso em ação clara: deveres definidos, expectativas mensuráveis e responsabilidade inequívoca. O resultado é alguém confiável, minucioso e profundamente digno de confiança – a pessoa que ainda estará lá quando todos os outros já tiverem partido. A Ne inferior (Intuição Extravertida) é onde ${name} se sente menos confortável: diante da novidade, ambiguidade e mudança, ele pode se tornar rígido ou catastrofizar de maneiras que parecem desproporcionais para observadores externos.`,
    ISFJ:`${name} é orientado para as pessoas em seu mundo com uma consistência que pode ser invisível precisamente porque nunca para. Si (Sensação Introvertida) como função dominante significa que ${name} mantém registros internos detalhados do que as pessoas precisam, o que lhes foi prometido e o que as normas estabelecidas de cuidado exigem. Fe (Sentimento Extravertido) como auxiliar direciona tudo isso para fora em acomodação, atenção e manutenção da harmonia. O resultado é alguém cujo cuidado é estrutural em vez de performático – disponível antes de ser necessário, sustentado muito depois de ter sido reconhecido. A Ne inferior (Intuição Extravertida) é onde a sombra habita: ${name} pode catastrofizar sobre possibilidades futuras, resistir a mudanças além do necessário ou se acomodar a ponto de anular a si mesmo quando a Ne não consegue gerar alternativas.`,
    ESTJ:`${name} impõe estrutura em cada situação em que entra – não por desejo de controle, mas porque a Te (Pensamento Extravertido) dominante não funciona de forma eficiente na desordem. Si (Sensação Introvertida) como auxiliar ancora a organização no precedente: ${name} não reinventa a roda; ele aplica o que comprovadamente funciona, melhora onde necessário e o mantém contra a entropia que a revisão constante introduz. O resultado é alguém confiável, eficaz e às vezes inflexível da maneira específica como qualquer sistema ajustado para confiabilidade se torna inflexível. A Fi inferior (Sentimento Introvertido) é o que ${name} mais luta para acessar: valores pessoais, exceções individuais e todo o peso de como alguém realmente se sente em vez do que deveria fazer na situação dada.`,
    ESFJ:`${name} mantém o tecido social de seu mundo unido através de uma atenção relacional que nunca se desliga totalmente. Fe (Sentimento Extravertido) é a função dominante – ${name} está continuamente lendo o registro emocional de cada situação e ajustando seu comportamento de acordo. Si (Sensação Introvertida) como auxiliar ancora essa sintonia na continuidade: ${name} honra o que foi prometido, valoriza a tradição e mantém as normas de cuidado porque essas normas são o que faz as pessoas se sentirem acolhidas e seguras. A Ti inferior (Pensamento Introvertido) é o ponto fraco consistente: a consistência lógica interna não é a preocupação principal de ${name}, e ele pode ficar genuinamente surpreso – e defensivo – quando a lógica que produziu uma ação de cuidado é examinada de perto.`,
    ISTP:`${name} pensa em sistemas e age no mundo físico. Ti (Pensamento Introvertido) é a função dominante – uma estrutura lógica interna precisa que ${name} constrói e refina constantemente, geralmente em silêncio. Se (Sensação Extravertida) como auxiliar significa que essa estrutura está sempre em contato com a realidade concreta: ${name} não é um teórico, mas alguém que aplica sua lógica ao que está acontecendo exatamente agora, com suas mãos, seu corpo ou ambos. A Fe inferior (Sentimento Extravertido) é onde ${name} fica mais exposto: situações emocionais, vulnerabilidade, o registro social de uma sala – estas exigem uma função que ele raramente usa, e a raridade se mostra nos momentos em que ela é necessária.`,
    ISFP:`${name} age com base no sentimento pessoal no momento presente. Fi (Sentimento Introvertido) é a função dominante – um sistema de valores profundo e privado a partir do qual ${name} geralmente não articula, mas age consistentemente. Se (Sensação Extravertida) como auxiliar significa que o sentimento está sempre fundamentado no mundo real, físico e imediato: ${name} não é abstrato ou teórico sobre o que importa, ele é focado no presente de uma forma que produz ações diretas, corporificadas e muitas vezes impossíveis de explicar totalmente. A Te inferior (Pensamento Extravertido) é o sinal revelador: estrutura externa, planejamento de longo prazo e o tipo de responsabilidade sistemática que outros tipos acham natural são onde ${name} perde terreno de forma consistente.`,
    ESTP:`${name} lê a situação imediata mais rápido do que qualquer um ao seu redor. Se (Sensação Extravertida) é a função dominante – engajamento total e alerta com o que está realmente acontecendo agora, processado e executado antes que a maioria das pessoas termine de avaliar. Ti (Pensamento Introvertido) como auxiliar fornece a precisão analítica que torna ${name} mais do que meramente reativo: eles são rápidos, são precisos e estão operando com uma estrutura lógica que a velocidade torna invisível. A Ni inferior (Intuição Introvertida) é o ponto cego consistente: consequências de longo prazo, padrões que só emergem com o tempo e a forma das coisas daqui a anos são onde ${name} subestima com mais frequência.`,
    ESFP:`${name} é inteiramente presente. Se (Sensação Extravertida) é a função dominante – ${name} se engaja com o mundo imediato com mais abertura e menos defensiva do que quase qualquer outro tipo. Fi (Sentimento Introvertido) como auxiliar significa que esse engajamento é fundamentado em um calor pessoal genuíno: ${name} se importa, e o cuidado é visível e específico em vez de performático. A Ni inferior (Intuição Introvertida) é onde ${name} mais luta: visão de longo alcance, padrões abstratos que ainda não se manifestaram e consequências que ainda não são visíveis são as áreas onde ${name} tem mais probabilidade de ser genuinamente pego de surpresa.`,

    ENFP:{alt:'ENTP ou INFP',conf:`${name} pode parecer tão focado em argumentos quanto um ENTP ou tão ancorado em valores quanto um INFP`,tell:`Ne-Fi é a parceria de assinatura: ${name} gera possibilidades (Ne) ancoradas em calor pessoal e valores (Fi) – o ENTP combina Ne com Ti para análise, o INFP inverte a ordem com Fi dominante. O calor humano e o idealismo são ambos genuínos e presentes`},

    ISFJ:{alt:'ISTJ ou INFJ',conf:`${name} pode parecer tão procedimentalmente confiável quanto um ISTJ ou tão silenciosamente perceptivo quanto um INFJ`,tell:`Si-Fe é a combinação que define: a orientação em direção às pessoas passa pela lente de normas estabelecidas e cuidado acumulado – a Fe do ISTJ é substituída por Te (orientada a resultados), o INFJ lidera com Ni, não Si. O cuidado é baseado no registro acumulado, não na visão estratégica`},
    ESTJ:{alt:'ENTJ ou ISTJ',conf:`${name} pode parecer tão estrategicamente ambicioso quanto um ENTJ ou tão silenciosamente zeloso quanto um ISTJ`,tell:`Te-Si é o diagnóstico: organização externa baseada em precedentes – a Si do ENTJ é substituída por Ni (movida por visão), o Te do ISTJ é auxiliar e não dominante, o que significa que ${name} inicia a estrutura onde o ISTJ mantém a estrutura existente`},
    ESFJ:{alt:'ENFJ ou ISFJ',conf:`${name} pode parecer tão carismaticamente relacional quanto um ENFJ ou tão silenciosamente dedicado quanto um ISFJ`,tell:`Fe-Si é a combinação: sintonia social baseada em normas estabelecidas e continuidade – a Si do ENFJ é substituída por Ni (visão estratégica), a Fe do ISFJ é auxiliar e não dominante, de modo que ${name} lidera para fora de forma relacional onde o ISFJ trabalha dentro das estruturas relacionais existentes`},
    ISTP:{alt:'ISTJ ou ESTP',conf:`${name} pode parecer tão orientado ao dever quanto um ISTJ ou tão audaciosamente focado em ação quanto um ESTP`,tell:`Ti-Se é o sinal revelador: a estrutura lógica interna é o motor e Se é o que a mantém em contato com a realidade – o ISTJ lidera com Si (baseado em precedentes), o ESTP inverte a ordem com Se dominante e Ti auxiliar. A estrutura vem primeiro; o engajamento físico serve a ela`},
    ISFP:{alt:'INFP ou ISTP',conf:`${name} pode parecer tão movido por ideias quanto um INFP ou tão fisicamente tático quanto um ISTP`,tell:`Fi-Se é a combinação: os valores são do momento presente e corporificados, não abstratos e voltados para o futuro (Ne do INFP) – e o engajamento físico é a serviço do sentimento em vez da análise lógica (Ti do ISTP). O corpo e o valor são a mesma expressão`},
    ESTP:{alt:'ENTP ou ISTP',conf:`${name} pode parecer tão conceitualmente aguçado quanto um ENTP ou tão focado em estruturas internas quanto um ISTP`,tell:`Se dominante é o que define tudo: o engajamento primário é com a realidade física imediata, lida e executada em tempo real – o ENTP lidera com Ne (ideias e possibilidades), o ISTP inverte a ordem com Ti primário e Se secundário. A leitura situacional é primária`},
    ESFP:{alt:'ENFP ou ESTP',conf:`${name} pode parecer tão focado em ideias quanto um ENFP ou tão taticamente aguçado quanto um ESTP`,tell:`Se-Fi é a assinatura: o engajamento dominante é físico e no momento presente, ancorado não por lógica (Ti do ESTP) ou possibilidade abstrata (Ne do ENFP), mas por um calor pessoal genuíno no momento imediato. A presença e o calor chegam juntos`},
  };

  const tp=typeProfile[type]||`${name} opera através da pilha de funções ${type}, com ${dom} (${fnFullName[dom]}) como o motor de cada grande decisão.`;
  const mt=mistypeProfile[type]||{alt:'outros tipos',conf:`comportamentos superficiais podem apontar para outros caminhos`,tell:`a pilha de funções completa, examinada ao longo dos momentos decisivos de ${name}, é o que define o tipo`};
  const cc=charContent[sl];

  // ── Who They Are ──
  const whoEl=document.getElementById('who-they-are-text');
  if(whoEl) whoEl.outerHTML=`
    <p>${name} é ${type}. O tipo é definido por uma hierarquia de funções cognitivas - não uma lista de traços, mas uma pilha ordenada de processos mentais que determina como alguém percebe o mundo e toma decisões. Para ${name}, essa pilha lidera com ${dom} (${fnFullName[dom]}) e é apoiada por ${aux} (${fnFullName[aux]}). Compreender essa ordem explica não apenas o que ${name} faz, mas o porquê - e por que eles respondem da forma que respondem sob pressão, nos relacionamentos e nos pontos de virada de seu arco.</p>
    <p>${tp}</p>
    <p>O que torna ${name} um exemplo convincente de ${type} não é o fato de demonstrarem cada item da descrição do tipo, mas sim que a pilha de funções se sustenta sob pressão. Nos momentos que definem sua história em ${ctx} - as decisões sob estresse, as falhas de julgamento, os raros momentos de crescimento genuíno - o padrão é consistente. A função dominante é o que ${name} busca primeiro. A função inferior é o que os pega de surpresa.</p>
  `;

  // ── Journey ──
  const journeyEl=document.getElementById('journey-text');
  const journeyH=document.getElementById('journey-heading');
  if(journeyH) journeyH.textContent=`${name}: O que o Perfil ${type} Explica`;
  if(journeyEl){
    if(cc&&cc.journey){
      journeyEl.outerHTML=`<div id="journey-text">${cc.journey}</div>`;
    } else {
      journeyEl.outerHTML=`
        <p>Em ${ctx}, o perfil ${type} de ${name} não é incidental à história - é a arquitetura de cada escolha significativa que tomam. O ${dom} dominante (${fnFullName[dom]}) é o que ${name} mais confia e busca primeiro. É a fonte de sua competência característica, a razão pela qual são eficazes quando são eficazes, e a função que define como abordam cada situação importante.</p>
        <p>A função inferior, ${inf} (${fnFullName[inf]}), é o outro lado da moeda. É a função menos desenvolvida na pilha de ${name} - aquela que surge sob estresse, em momentos de vulnerabilidade genuína ou nos pontos de virada de seu arco onde a competência que a função dominante fornece é de repente insuficiente. Onde ${name} falha, onde é surpreendido, onde está genuinamente fora de seu elemento: esses momentos quase sempre envolvem a função inferior rompendo a estrutura que normalmente a contém.</p>
        <p>A função terciária, ${ter} (${fnFullName[ter]}), opera em segundo plano. É o que ${name} usa quando a dominante está sob tensão - um suporte parcial que pode fazê-los parecer um tipo diferente para observadores casuais. A aparente flexibilidade, o calor ou estrutura ocasional que parecem fora do personagem: isso é a terciária em ação. Reconhecê-la como terciária, e não como dominante, é parte de ler a pilha de funções corretamente ao longo de todo o arco de ${name} em ${ctx}.</p>
      `;
    }
  }

  // ── Mistype ──
  /* ── Letter breakdown section ── */
  const lettersSection=document.getElementById('letters-section');
  const lettersEl=document.getElementById('letters-text');
  const lettersH=document.getElementById('letters-heading');
  if(cc&&cc.letters&&lettersSection&&lettersEl){
    lettersSection.style.display='';
    if(lettersH) lettersH.textContent=`${name}: ${type} Letra por Letra`;
    lettersEl.innerHTML=cc.letters;
  } else if(lettersSection){
    lettersSection.style.display='none';
  }

  const mistypeEl=document.getElementById('mistype-text');
  const mistypeH=document.getElementById('mistype-heading');
  if(mistypeH) mistypeH.textContent=`Por que ${name} é ${type}, não ${mt.alt}`;
  if(mistypeEl){
    if(cc&&cc.mistype){
      mistypeEl.outerHTML=`<div id="mistype-text">${cc.mistype}</div>`;
    } else {
      mistypeEl.outerHTML=`
        <p>${name} às vezes é classificado como ${mt.alt}. A confusão é compreensível: ${mt.conf}. Mas a correspondência de traços em nível superficial é como os erros de digitação se acumulam. A pilha de funções cognitivas é o que os resolve.</p>
        <p>O diagnóstico principal é a função dominante. Para ${name}, é ${dom} (${fnFullName[dom]}). Cada grande decisão na história de ${name} em ${ctx} pode ser rastreada de volta a essa função operando primeiro - a confiança, os pontos cegos característicos, a textura específica de como ${name} triunfa e como falha. O padrão se mapeia consistentemente para uma pilha liderada por ${dom}, não para as alternativas.</p>
        <p>A evidência decisiva: ${mt.tell}. Uma vez que você acompanha o comportamento de ${name} não em momentos casuais, mas nos momentos que o definem - as decisões com apostas mais altas, as falhas mais características, os instintos que surgem sob pressão genuína -, a leitura de ${type} é consistente, e as leituras alternativas exigiriam ignorar grande parte do que realmente está lá.</p>
      `;
    }
  }
}

function renderNotFound(){
  document.getElementById('page-body').innerHTML=`
    <div class="not-found r">
      <h1>404</h1>
      <p>Nenhum personagem encontrado nesta URL. Eles podem ter sido renomeados ou removidos.</p>
      <a class="cta-btn" href="/pt/archive">Navegar pelo Arquivo</a>
    </div>`;
  requestAnimationFrame(()=>document.querySelector('.not-found')?.classList.add('in'));
}

// ── Page transition ──
window.addEventListener('DOMContentLoaded',()=>{
  renderPage();
  const ov=document.getElementById('t-overlay');
  if(ov){requestAnimationFrame(()=>{ov.style.transition='opacity 0.45s ease';ov.style.opacity='0';});}
});

// ── Intercept internal links for smooth transition ──
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const href=a.getAttribute('href');
  if(!href||href.startsWith('http')||href.startsWith('#')||href.startsWith('mailto:'))return;
  e.preventDefault();
  const ov=document.getElementById('t-overlay');
  if(ov){ov.style.transition='opacity 0.3s ease';ov.style.opacity='1';}
  setTimeout(()=>window.location.href=href,300);
});
</script>
<script>
(function(){
  var bar = document.getElementById('reading-progress');
  if(!bar) return;
  window.addEventListener('scroll', function(){
    var doc = document.documentElement;
    var pct = doc.scrollHeight <= doc.clientHeight ? 0 : (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
    bar.style.width = Math.min(100, pct) + '%';
  }, {passive:true});
})();
</script>
