<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0c0e10;--surface:#13161a;--surface2:#1a1e24;--gold:#c9a84c;--gold-dim:#8a6d2e;--cream:#ede8df;--muted:#ccc6bf;--border:#252a30;--radius:14px;}
  html,body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:400;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6;}
  #t-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#0c0e10;opacity:1;}
  .glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;}
  .glow-1{width:600px;height:600px;top:-200px;left:-150px;background:radial-gradient(circle,rgba(201,168,76,0.07) 0%,transparent 70%);}
  .glow-2{width:400px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(120,180,160,0.05) 0%,transparent 70%);}
  main{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:72px 32px 96px;}

  /* REVEAL */
  .r{opacity:0;transform:translateY(24px);transition:opacity 0.65s cubic-bezier(0.22,1,0.36,1),transform 0.65s cubic-bezier(0.22,1,0.36,1);}
  .r.in{opacity:1;transform:none;}

  .page-eyebrow{font-size:12px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:12px;}
  .page-eyebrow::before{content:'';display:block;height:1px;width:24px;background:var(--gold-dim);}

  h1{font-family:'Cormorant Garamond',serif;font-size:clamp(40px,7vw,68px);font-weight:300;line-height:0.95;letter-spacing:-0.02em;color:var(--cream);margin-bottom:16px;}
  h1 em{font-style:italic;color:var(--gold);}
  .page-sub{font-size:17px;color:var(--cream);opacity:0.88;line-height:1.75;max-width:520px;margin-bottom:72px;}

  .section{margin-bottom:56px;}
  .section-label{font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .section-label::after{content:'';display:block;flex:1;height:1px;background:var(--border);}

  .body-text{font-size:16px;line-height:1.95;color:#cdc7c0;}
  .body-text+.body-text{margin-top:18px;}

  /* Scoring diagram */
  .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px;}
  @media(max-width:520px){.score-grid{grid-template-columns:1fr;}}
  @media(max-width:600px){main{padding:40px 16px 72px;}}
  .score-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;}
  .score-dim{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  .score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .score-letters{display:flex;gap:10px;}
  .score-letter{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--cream);}
  .score-letter.dim{color:var(--muted);}
  .score-count{font-size:12px;color:var(--muted);letter-spacing:0.06em;}
  .score-bar-track{height:4px;background:var(--border);border-radius:4px;overflow:hidden;}
  .score-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));}

  /* Timeline */
  .timeline{position:relative;padding-left:28px;margin-top:28px;}
  .timeline::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--border);}
  .tl-item{position:relative;margin-bottom:32px;}
  .tl-item:last-child{margin-bottom:0;}
  .tl-dot{position:absolute;left:-32px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--gold);}
  .tl-year{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .tl-text{font-size:15px;line-height:1.8;color:#cdc7c0;}

  /* Verdict boxes */
  .verdict-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px;}
  @media(max-width:520px){.verdict-grid{grid-template-columns:1fr;}}

  .verdict-box.good{border-left:2px solid var(--gold);}
  .verdict-box.caution{border-left:2px solid #6b5a3a;}
  .verdict-title{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:14px;}
  .verdict-box.good .verdict-title{color:var(--gold);}
  .verdict-box.caution .verdict-title{color:#8a7040;}
  .verdict-box ul{list-style:none;}
  .verdict-box ul li{font-size:14px;color:#cdc7c0;line-height:1.75;padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
  .verdict-box ul li:last-child{border-bottom:none;}
  .verdict-box.good ul li::before{content:'↑';color:var(--gold-dim);flex-shrink:0;}
  .verdict-box.caution ul li::before{content:'↓';color:#6b5a3a;flex-shrink:0;}

  .callout{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--gold-dim);border-radius:var(--radius);padding:24px 28px;margin-top:28px;}
  .callout-text{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;font-style:italic;color:var(--cream);line-height:1.55;}

  .btn-gold:hover{background:var(--cream);transform:translateY(-2px);}

  /* Auth form */
  .auth-wrap{max-width:440px;margin:0 auto;padding:60px 24px 120px;}
  .auth-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3rem);font-weight:600;color:var(--cream);line-height:1.15;margin-bottom:8px;}
  .auth-title em{color:var(--gold);font-style:italic;}
  .auth-sub{color:var(--cream);opacity:0.88;font-size:0.95rem;margin-bottom:40px;line-height:1.6;}
  .auth-form{display:flex;flex-direction:column;gap:16px;}
  .field-wrap{display:flex;flex-direction:column;gap:6px;}
  .field-label{color:var(--muted);font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase;}
  .field-input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--cream);font-size:16px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;}
  .field-input:focus{border-color:var(--gold-dim);}
  .field-input::placeholder{color:var(--muted);opacity:0.5;}
  .auth-btn{margin-top:8px;background:var(--gold);color:#0c0e10;font-family:'DM Sans',sans-serif;font-weight:600;font-size:0.9rem;letter-spacing:0.06em;text-transform:uppercase;border:none;border-radius:60px;padding:16px 28px;cursor:pointer;transition:all 0.25s;}
  .auth-btn:hover{background:var(--cream);transform:translateY(-2px);}
  .auth-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .auth-switch{text-align:center;margin-top:24px;color:var(--muted);font-size:0.9rem;}

  .auth-msg{padding:12px 16px;border-radius:8px;font-size:0.9rem;text-align:center;display:none;}

<h1 class="sr-only">Criar Conta · 77 Scenarios</h1>

<div class="glow glow-2"></div>

<main>
  <div class="auth-wrap">
    <div class="auth-title r" data-d="0">Crie uma<br><em>conta.</em></div>
    <p class="auth-sub r" data-d="1">Salve seus resultados e acompanhe como seu tipo muda ao longo do tempo.</p>

    <div id="auth-msg" class="auth-msg"></div>

    <div class="auth-form r" data-d="2">
      <div class="field-wrap">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field-wrap">
        <label class="field-label" for="password">Senha</label>
        <input class="field-input" type="password" id="password" placeholder="Pelo menos 8 caracteres" autocomplete="new-password">
      </div>
      <button class="auth-btn" id="signup-btn" onclick="handleSignup()">Criar conta</button>
    </div>

    <p class="auth-switch r" data-d="3">Já tem uma conta? <a href="/pt/login">Entrar →</a></p>
  </div>
</main>


<script>
const ov=document.getElementById('t-overlay');
function fadeIn(){ov.style.opacity='1';ov.animate([{opacity:1},{opacity:0}],{duration:550,delay:60,easing:'cubic-bezier(0.22,1,0.36,1)',fill:'forwards'});}
fadeIn();
window.addEventListener('pageshow',e=>{if(e.persisted)fadeIn();});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const h=a.getAttribute('href');
  if(!h||h.startsWith('#')||h.startsWith('http')||h.startsWith('javascript')||h.startsWith('mailto'))return;
  e.preventDefault();
  ov.animate([{opacity:0},{opacity:1}],{duration:320,easing:'cubic-bezier(0.76,0,0.24,1)',fill:'forwards'}).finished.then(()=>{window.location.href=h;});
});
const obs=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(!en.isIntersecting)return;
    setTimeout(()=>en.target.classList.add('in'),parseFloat(en.target.dataset.d||0)*80);
    obs.unobserve(en.target);
  });
},{threshold:0.155});
document.querySelectorAll('.r').forEach(el=>obs.observe(el));
</script>

<script>
const { createClient } = supabase;
const sb = createClient('https://rttomfnfyjjssdqfzkaj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dG9tZm5meWpqc3NkcWZ6a2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5ODcwMjEsImV4cCI6MjA4ODU2MzAyMX0.0qBogK8xywL77IFYj4IywZIhHyKjbvbVmXYvG6wAZGw');
window._navSb = sb;

sb.auth.getSession().then((({ data }) => {
  if (data.session) window.location.href = '/pt/profile';
}));

function msg(text, type) {
  const el = document.getElementById('auth-msg');
  el.textContent = text;
  el.className = 'auth-msg ' + type + ' show';
}

async function handleSignup() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('signup-btn');
  if (!email || !password) { msg('Por favor, preencha todos os campos.', 'error'); return; }
  if (password.length < 8) { msg('A senha deve ter pelo menos 8 caracteres.', 'error'); return; }
  btn.disabled = true;
  btn.textContent = 'Criando conta...';
  const { data: signUpData, error } = await sb.auth.signUp({ email, password });
  if (error) {
    msg(error.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Criar conta';
  } else {
    // If email confirmation is disabled and user is immediately logged in,
    // create the profile row now. If confirmation is required, settings.html
    // handles profile creation via upsert on first save.
    if (signUpData?.user) {
      await sb.from('profiles').upsert({ id: signUpData.user.id }).throwOnError().catch(() => {});
    }
    msg('Conta criada. Verifique seu e-mail para confirmar.', 'success');
    btn.textContent = 'Concluído';
  }
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSignup();
});
</script>
