<script>
const types=['INFP','ENFP','INFJ','ENFJ','INTJ','ENTJ','INTP','ENTP','ISFP','ESFP','ISTP','ESTP','ISFJ','ESFJ','ISTJ','ESTJ'];
const typeData={
  INFP:{name:'The Mediator',tagline:'Deep ideals, quiet fire'},
  ENFP:{name:'The Champion',tagline:'Restless possibility, magnetic energy'},
  INFJ:{name:'The Counselor',tagline:'Rare vision, quiet resolve'},
  ENFJ:{name:'The Teacher',tagline:'Charisma with purpose'},
  INTJ:{name:'The Architect',tagline:'Strategic mind, relentless standard'},
  ENTJ:{name:'The Commander',tagline:'Vision, control, momentum'},
  INTP:{name:'The Thinker',tagline:'Curious, precise, quietly unconventional'},
  ENTP:{name:'The Visionary',tagline:'Sharp, provocative, relentlessly curious'},
  ISFP:{name:'The Artist',tagline:'Present, free, deeply feeling'},
  ESFP:{name:'The Performer',tagline:'Alive, generous, contagiously present'},
  ISTP:{name:'The Craftsman',tagline:'Cool head, skilled hands'},
  ESTP:{name:'The Dynamo',tagline:'Bold, perceptive, always in motion'},
  ISFJ:{name:'The Protector',tagline:'Quiet care, fierce loyalty'},
  ESFJ:{name:'The Caregiver',tagline:'Community, warmth, unstoppable care'},
  ISTJ:{name:'The Inspector',tagline:'Duty, precision, integrity'},
  ESTJ:{name:'The Director',tagline:'Order, results, accountability'},
};
const matrix=[
  [3,4,4,5,3,5,3,3,3,2,2,1,3,2,2,1],
  [4,3,5,4,5,3,4,4,3,3,2,2,2,2,1,1],
  [4,5,3,4,4,3,4,5,3,2,2,2,3,2,2,1],
  [5,4,4,4,3,3,4,3,5,4,3,3,4,3,2,2],
  [3,5,4,3,3,4,4,5,2,1,3,2,2,1,3,2],
  [5,3,3,3,4,2,5,4,2,2,3,3,2,2,3,4],
  [3,4,4,4,4,5,3,4,2,2,3,3,2,3,2,5],
  [3,4,5,3,5,4,4,3,2,2,3,3,2,2,2,3],
  [3,3,3,5,2,2,2,2,3,4,4,4,4,5,3,3],
  [2,3,2,4,1,2,2,2,4,3,4,4,5,4,5,3],
  [2,2,2,3,3,3,3,3,4,4,3,4,3,5,4,5],
  [1,2,2,3,2,3,3,3,4,4,4,2,5,4,5,4],
  [3,2,3,4,2,2,2,2,4,5,3,5,4,4,4,4],
  [2,2,2,3,1,2,3,2,5,4,5,4,4,3,4,4],
  [2,1,2,2,3,3,2,2,3,5,4,5,4,4,4,4],
  [1,1,1,2,2,4,5,3,3,3,5,4,4,4,4,3],
];
const scoreLabels={1:'Pense bem nessa',2:'Pode funcionar, mas não é ideal',3:'Unilateral ou desequilibrada',4:'Boas chances de funcionar',5:'Muitas vezes uma combinação ideal'};
/* pairDesc & pairingData are loaded externally from /data/compat-db-pt.js (cached immutable). */

function getPairingData(a,b){
  const types=['INFP','ENFP','INFJ','ENFJ','INTJ','ENTJ','INTP','ENTP','ISFP','ESFP','ISTP','ESTP','ISFJ','ESFJ','ISTJ','ESTJ'];
  const ai=types.indexOf(a),bi=types.indexOf(b);
  const slug=ai<=bi?`${a.toLowerCase()}-${b.toLowerCase()}`:`${b.toLowerCase()}-${a.toLowerCase()}`;
  return pairingData[slug]||null;
}

function getDesc(a,b){
  if(a===b) return pairDesc[`${a}-${a}`]||null;
  return pairDesc[`${a}-${b}`]||pairDesc[`${b}-${a}`]||null;
}
function getScore(a,b){const ai=types.indexOf(a),bi=types.indexOf(b);if(ai===-1||bi===-1)return null;return matrix[ai][bi];}
function codeHtml(t){return t.split('').map((l,i)=>(i%2===1)?`<span class="hi">${l}</span>`:l).join('');}
function canonicalSlug(a,b){const ai=types.indexOf(a),bi=types.indexOf(b);return ai<=bi?`${a.toLowerCase()}-${b.toLowerCase()}`:`${b.toLowerCase()}-${a.toLowerCase()}`;}
function getRelated(a,b){
  const othersA=types.filter(t=>t!==b);
  const forA=othersA.map(t=>({other:t,score:getScore(a,t)})).sort((x,y)=>y.score-x.score).slice(0,5);
  const forB=a===b?[]:types.filter(t=>t!==a).map(t=>({other:t,score:getScore(b,t)})).sort((x,y)=>y.score-x.score).slice(0,5);
  return {forA,forB};
}

function render(){
  const path=window.location.pathname;
  const match=path.match(/\/compatibility\/([a-zA-Z]{4})-([a-zA-Z]{4})$/);
  if(!match){document.getElementById('content').innerHTML='<p style="color:var(--muted);margin-top:40px;">Combinação não encontrada. <a href="/pt/compatibility" style="color:var(--gold)">Veja a tabela completa →</a></p>';return;}
  const a=match[1].toUpperCase(),b=match[2].toUpperCase();
  if(!typeData[a]||!typeData[b]){document.getElementById('content').innerHTML='<p style="color:var(--muted);margin-top:40px;">Tipo não reconhecido. <a href="/pt/compatibility" style="color:var(--gold)">Veja a tabela completa →</a></p>';return;}
  const score=getScore(a,b),isSame=a===b,desc=getDesc(a,b)||'',slug=canonicalSlug(a,b);
  const canonical=`https://77scenarios.com/compatibility/${slug}`;
  const pairLabel=isSame?`${a} + ${a}`:`${a} & ${b}`;
  const title=isSame?`Compatibilidade de ${a} + ${a} no Myers-Briggs | 77 Scenarios`:`Compatibilidade de ${a} e ${b} no Myers-Briggs: ${scoreLabels[score]} | 77 Scenarios`;
  const metaDesc=`Compatibilidade de ${pairLabel} no Myers-Briggs: ${scoreLabels[score]}. ${desc.slice(0,130)} Descubra como esses dois tipos de personalidade se relacionam.`;
  document.title=title;
  const bcPair=document.getElementById('bc-pair'); if(bcPair) bcPair.textContent=pairLabel;
  document.getElementById('page-title').textContent=title;
  document.getElementById('page-desc').setAttribute('content',metaDesc);
  document.getElementById('canonical-url').setAttribute('href',canonical);
  const setMeta=(prop,val,attr='property')=>{let m=document.querySelector(`meta[${attr}="${prop}"]`);if(!m){m=document.createElement('meta');m.setAttribute(attr,prop);document.head.appendChild(m);}m.setAttribute('content',val);};
  setMeta('og:title',title);setMeta('og:description',metaDesc);setMeta('og:url',canonical);
  setMeta('twitter:title',title,'name');setMeta('twitter:description',metaDesc,'name');
  const compImgUrl=`https://77scenarios.com/images/types/${a}.jpg`;
  setMeta('og:image',compImgUrl);setMeta('twitter:image',compImgUrl,'name');
  setMeta('keywords',`compatibilidade ${a} ${b}, relacionamento ${a} e ${b}, MBTI ${a} ${b}, compatibilidade Myers-Briggs ${a} ${b}, conselhos de relacionamento ${a} ${b}, ${isSame?a+' mesmo tipo':a+' atração '+b}, compatibilidade de tipos de personalidade`,'name');
  document.getElementById('pair-schema').textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article","headline":`Compatibilidade ${pairLabel}`,"description":metaDesc,"url":canonical,"publisher":{"@type":"Organization","name":"77 Scenarios","url":"https://77scenarios.com"}});
  const {forA,forB}=getRelated(a,b);
  const relPillsA=forA.map(({other,score:s})=>`<a href="/pt/compatibility/${canonicalSlug(a,other)}" class="related-pill"><span class="score-dot dot-${s}"></span>${a} &amp; ${other}</a>`).join('');
  const relPillsB=isSame?'':forB.map(({other,score:s})=>`<a href="/pt/compatibility/${canonicalSlug(b,other)}" class="related-pill"><span class="score-dot dot-${s}"></span>${b} &amp; ${other}</a>`).join('');

  // FAQ schema
  const faqItems=[
    {q:`Os tipos ${a} e ${b} são compatíveis?`,a:`${pairLabel}: ${scoreLabels[score]}. ${desc.slice(0,200)}`},
    {q:`O que ${a} e ${b} têm em comum?`,a:`${a} (${typeData[a].name}) and ${b} (${b===a?typeData[a].name:typeData[b].name}) share certain cognitive and relational tendencies. ${desc}`},
    {q:`${a} e ${b} podem ter um relacionamento bem-sucedido?`,a:`${score>=4?`Sim – ${pairLabel} é uma das combinações de MBTI mais naturalmente compatíveis. `:(score>=3?`Com esforço, a combinação ${pairLabel} pode dar certo. `:`A combinação ${pairLabel} enfrenta diferenças estruturais reais. `)}${desc.slice(0,150)}`},
  ];
  let faqEl2=document.getElementById('pair-faq-schema');
  if(!faqEl2){faqEl2=document.createElement('script');faqEl2.id='pair-faq-schema';faqEl2.type='application/ld+json';document.head.appendChild(faqEl2);}
  faqEl2.textContent=JSON.stringify({"@context":"https://schema.org","@type":"FAQPage","mainEntity":faqItems.map(({q,a:ans})=>({'@type':'Question','name':q,'acceptedAnswer':{'@type':'Answer','text':ans}}))});

  // Breadcrumb schema
  let bcEl2=document.getElementById('pair-bc-schema');
  if(!bcEl2){bcEl2=document.createElement('script');bcEl2.id='pair-bc-schema';bcEl2.type='application/ld+json';document.head.appendChild(bcEl2);}
  bcEl2.textContent=JSON.stringify({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Início","item":"https://77scenarios.com"},{"@type":"ListItem","position":2,"name":"Compatibilidade","item":"https://77scenarios.com/compatibility"},{"@type":"ListItem","position":3,"name":`Compatibilidade ${pairLabel}`,"item":canonical}]});

  const pd = getPairingData(a,b);
  const draw = pd ? pd.draw : '';
  const brings_a = pd ? pd.brings_a : [];
  const brings_b = pd ? pd.brings_b : null;
  const friction = pd ? pd.friction : [];
  const tips_arr = pd ? pd.tips : [];
  const func_note = pd ? pd.func_note : '';
  const growth_a = pd ? pd.growth_a : '';
  const growth_b = pd ? pd.growth_b : '';

  document.getElementById('content').innerHTML=`
    <div class="pair-hero r" data-d="1">
      <div class="pair-eyebrow">Compatibilidade Myers-Briggs</div>
      <div class="pair-heading"><a href="/pt/types/${a.toLowerCase()}" class="pair-type-link">${codeHtml(a)}</a><span class="amp">${isSame?'+':'&amp;'}</span><a href="/pt/types/${b.toLowerCase()}" class="pair-type-link">${codeHtml(b)}</a></div>
      <div class="pair-names">${typeData[a].name}${isSame?'':' &amp; '+typeData[b].name}</div>
    </div>
    <div class="score-block r" data-d="2">
      <div class="score-label-text sc${score}">${scoreLabels[score]}</div>
      <div class="score-bar-track"><div class="score-bar-fill" id="score-bar"></div></div>
      <div class="score-legend"><span>Pense bem nessa</span><span>Combinação ideal</span></div>
    </div>
    ${draw?`<div class="draw-block r" data-d="2b"><p class="draw-text">${draw}</p></div>`:''}
    <div class="section r" data-d="3">
      <div class="section-label">Dinâmica de Relacionamento ${a}${isSame?' do Mesmo Tipo':' &amp; '+b}</div>
      <p class="body-text">${desc}</p>
    </div>
    ${brings_a.length?`
    <div class="section r" data-d="3b">
      <div class="section-label">O que cada um traz</div>
      <div class="brings-grid">
        <div class="brings-card">
          <div class="brings-type">${a} contribui</div>
          <ul class="brings-list">
            ${brings_a.map(x=>`<li>${x}</li>`).join('')}
          </ul>
        </div>
        ${brings_b?`<div class="brings-card">
          <div class="brings-type">${b} contribui</div>
          <ul class="brings-list">
            ${brings_b.map(x=>`<li>${x}</li>`).join('')}
          </ul>
        </div>`:''}
      </div>
    </div>`:''}
    ${friction.length?`
    <div class="section r" data-d="4">
      <div class="section-label">Onde surgem os atritos</div>
      <div class="friction-list">
        ${friction.map(f=>`<div class="friction-item"><p>${f}</p></div>`).join('')}
      </div>
    </div>`:''}
    ${tips_arr.length?`
    <div class="section r" data-d="4b">
      <div class="section-label">Como fazer dar certo</div>
      <div class="tips-list">
        ${tips_arr.map((t,i)=>`<div class="tip-item"><div class="tip-num">${i+1}</div><p class="tip-text">${t}</p></div>`).join('')}
      </div>
    </div>`:''}
    ${func_note?`
    <div class="section r" data-d="4c">
      <div class="section-label">Dinâmica das funções cognitivas</div>
      <div class="func-box"><p>${func_note}</p></div>
    </div>`:''}
    ${(growth_a||growth_b)?`
    <div class="section r" data-d="4d">
      <div class="section-label">Potencial de crescimento</div>
      <div class="growth-grid">
        ${growth_a?`<div class="growth-card"><div class="growth-type">${a} cresce em direção a</div><p class="growth-text">${growth_a}</p></div>`:''}
        ${growth_b?`<div class="growth-card"><div class="growth-type">${isSame?'Ambos crescem em direção a':b+' cresce em direção a'}</div><p class="growth-text">${growth_b}</p></div>`:''}
      </div>
    </div>`:''}
    <div class="type-pair-cards r" data-d="5">
      <a href="/pt/types/${a.toLowerCase()}" class="type-pair-card">
        <div class="tpc-code">${codeHtml(a)}</div>
        <div class="tpc-name">${typeData[a].name}</div>
        <div class="tpc-tagline">${typeData[a].tagline}</div>
        <span class="tpc-arrow">Perfil completo →</span>
      </a>
      ${isSame?'':`<a href="/pt/types/${b.toLowerCase()}" class="type-pair-card">
        <div class="tpc-code">${codeHtml(b)}</div>
        <div class="tpc-name">${typeData[b].name}</div>
        <div class="tpc-tagline">${typeData[b].tagline}</div>
        <span class="tpc-arrow">Perfil completo →</span>
      </a>`}
    </div>
    ${relPillsA||relPillsB?`<div class="section r" data-d="5">
      <div class="section-label">Combinações relacionadas</div>
      <div style="display:flex;flex-direction:column;gap:16px;">
        ${relPillsA?`<div><div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">${a} com outros</div><div class="related-grid">${relPillsA}</div></div>`:''}
        ${relPillsB?`<div><div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">${b} com outros</div><div class="related-grid">${relPillsB}</div></div>`:''}
      </div>
    </div>`:''}
    <div class="section r" data-d="5b">
      <div class="section-label">Perguntas Frequentes de Compatibilidade MBTI ${pairLabel}</div>
      <div class="faq-list">
        <div class="faq-item">
          <div class="faq-q">Os tipos Myers-Briggs ${a} e ${isSame?a:b} são compatíveis?</div>
          <div class="faq-a">${scoreLabels[score]}: ${desc.slice(0,200)}</div>
        </div>
        <div class="faq-item">
          <div class="faq-q">O que faz com que ${a} e ${isSame?a:b} se atraiam?</div>
          <div class="faq-a">${desc}</div>
        </div>
        <div class="faq-item">
          <div class="faq-q">${a} e ${isSame?a:b} podem ter um relacionamento bem-sucedido?</div>
          <div class="faq-a">${score>=4?'Esta é uma das combinações de MBTI mais naturalmente compatíveis. ':score>=3?'Esta combinação pode funcionar bem com autoconsciência e comunicação. ':score>=2?'Esta combinação pode funcionar, mas enfrenta desafios estruturais. ':'Esta combinação enfrenta diferenças estruturais que exigem um esforço real. '}A compatibilidade depende, em última análise, do crescimento individual, da comunicação e de valores compartilhados — não apenas do tipo de personalidade.</div>
        </div>
      </div>
    </div>
    <p class="note r" data-d="6">A compatibilidade é baseada em pesquisas de satisfação de relacionamento e na teoria das funções cognitivas. Cada relacionamento é único. Uma boa combinação não é uma garantia e uma combinação difícil não é uma sentença. <a href="/pt/compatibility">Veja a tabela de compatibilidade completa →</a></p>
    <div class="cta-block r" data-d="7">
      <div class="cta-text">Não tem certeza do seu tipo?<br><em>Deixe os cenários decidirem.</em></div>
      <a href="/pt/" class="btn-gold">Fazer o teste →</a>
    </div>`;
  setTimeout(()=>{const bar=document.getElementById('score-bar');if(bar)bar.className=`score-bar-fill sf${score}`;},150);
  document.querySelectorAll('.r').forEach(el=>obs.observe(el));
}

const obs=new IntersectionObserver(entries=>{entries.forEach(en=>{if(!en.isIntersecting)return;const d=parseFloat(en.target.dataset.d||0);setTimeout(()=>en.target.classList.add('in'),d*80);obs.unobserve(en.target);});},{threshold:0.1});
document.querySelectorAll('.r').forEach(el=>obs.observe(el));
render();
</script>
<script>const ov=document.getElementById('t-overlay');
function fadeIn(){ov.style.opacity='1';ov.animate([{opacity:1},{opacity:0}],{duration:550,delay:60,easing:'cubic-bezier(0.22,1,0.36,1)',fill:'forwards'});}
fadeIn();
window.addEventListener('pageshow',e=>{if(e.persisted)fadeIn();});
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const href=a.getAttribute('href');if(!href||href.startsWith('#')||href.startsWith('mailto')||a.target==='_blank')return;e.preventDefault();ov.style.opacity='0';ov.animate([{opacity:0},{opacity:1}],{duration:300,easing:'ease-in',fill:'forwards'}).onfinish=()=>{window.location=href;};});
</script>

(function(){
  var bar = document.getElementById('reading-progress');
  if(!bar) return;
  window.addEventListener('scroll', function(){
    var doc = document.documentElement;
    var pct = doc.scrollHeight <= doc.clientHeight ? 0 : (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
    bar.style.width = Math.min(100, pct) + '%';
  }, {passive:true});
})();
