<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0e10;--surface:#13161a;--surface2:#1a1e24;--gold:#c9a84c;--gold-dim:#8a6d2e;--cream:#ede8df;--muted:#ccc6bf;--border:#252a30;--radius:14px;}
html,body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:400}
main{max-width:740px;margin:0 auto;padding:48px 28px 96px}
.preview-title{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;margin-bottom:8px}
.preview-title em{color:var(--gold);font-style:italic}
.section-label{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin:28px 0 18px}
.preview-note{font-size:13px;color:var(--gold-dim);margin-bottom:28px;letter-spacing:0.04em}
.result-card{background:#131820;border:1px solid #2a3848;border-radius:12px;padding:24px 28px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:inset 0 1px 0 rgba(255,255,255,0.04),0 2px 8px rgba(0,0,0,0.35);transition:border-color 0.2s,box-shadow 0.2s;}
  .result-card:hover{border-color:var(--gold-dim);box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 8px 24px rgba(0,0,0,0.5);}
  .result-type{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;color:var(--gold);letter-spacing:0.05em;}
  .result-meta{color:var(--muted);font-size:0.94rem;margin-top:4px;}
  .result-bars{display:flex;flex-direction:column;gap:8px;min-width:160px;}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--muted);}
  .bar-track{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 0.6s ease;}
  .bar-letters{display:flex;justify-content:space-between;width:32px;font-size:0.94rem;color:var(--muted);}
  .result-link{color:var(--gold);text-decoration:none;font-size:0.94rem;white-space:nowrap;}
  .result-ctas{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .result-cta-btn{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:20px;padding:6px 14px;transition:border-color 0.2s,color 0.2s;}
  .result-cta-btn:hover{border-color:var(--gold-dim);color:var(--cream);}
  body.light-mode .result-cta-btn{color:#4a5568;border-color:#d0d7e3;}
  body.light-mode .result-cta-btn:hover{border-color:#c9a84c;color:#1e2d4a;}
  .result-link:hover{text-decoration:underline;}
  /* ── Expandable rich result panel ── */
  .result-expand{flex-basis:100%;width:100%;margin-top:14px;padding-top:14px;border:none;border-top:1px solid var(--border);background:none;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;}
  .result-expand:hover{color:var(--cream);}
  .result-expand .chev{transition:transform 0.25s ease;font-size:13px;}
  .result-expand.open .chev{transform:rotate(180deg);}
  .rp-detail{flex-basis:100%;width:100%;margin-top:18px;}
  .rp-intro{font-size:0.95rem;line-height:1.7;color:var(--muted);}
  .rp-rarity{display:inline-block;font-size:12px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:30px;padding:5px 14px;margin-top:16px;}
  .rp-section{margin-top:26px;}
  .rp-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
  .rp-fn-row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);}
  .rp-fn-row:last-child{border-bottom:none;}
  .rp-fn-rank{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);width:66px;flex-shrink:0;padding-top:4px;}
  .rp-fn-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:var(--cream);margin-bottom:2px;}
  .rp-fn-name span{font-style:normal;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--gold);margin-left:6px;letter-spacing:0.05em;}
  .rp-fn-desc{font-size:0.88rem;line-height:1.55;color:var(--muted);}
  .rp-fn-count{font-size:11px;color:var(--gold-dim);margin-top:5px;}
  .rp-moment{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .rp-moment-scene{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:9px;}
  .rp-moment-choice{font-size:0.95rem;font-style:italic;line-height:1.6;color:var(--cream);margin-bottom:11px;}
  .rp-moment-read{font-size:0.85rem;line-height:1.55;color:var(--muted);padding-top:11px;border-top:1px solid var(--border);}
  .rp-moment-read b{color:var(--gold);font-weight:500;}
  .rp-neighbour{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:border-color 0.2s;}
  .rp-neighbour:hover{border-color:var(--gold-dim);}
  .rp-neighbour-ax{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
  .rp-neighbour-txt{font-size:0.88rem;color:var(--muted);}
  .rp-neighbour-txt b{color:var(--cream);font-weight:500;}
  .rp-neighbour-arrow{color:var(--muted);flex-shrink:0;}
  .rp-neighbour:hover .rp-neighbour-arrow{color:var(--gold);}
  body.light-mode .rp-intro,body.light-mode .rp-fn-desc,body.light-mode .rp-moment-read,body.light-mode .rp-neighbour-txt,body.light-mode .rp-fn-rank,body.light-mode .rp-label{color:#4a6080!important;}
  body.light-mode .rp-fn-name,body.light-mode .rp-moment-choice,body.light-mode .rp-neighbour-txt b{color:#1e2d4a!important;}
  body.light-mode .rp-fn-name span,body.light-mode .rp-moment-scene,body.light-mode .rp-neighbour-ax,body.light-mode .rp-rarity,body.light-mode .rp-moment-read b,body.light-mode .result-expand{color:#8a6d2e!important;}
  body.light-mode .rp-moment,body.light-mode .rp-neighbour{background:#f5f7fa!important;border-color:#d0d7e3!important;}
</style></head><body>
<main>
<div class="preview-title">Your <em>results.</em></div>
<div class="preview-note">PREVIEW · mock data · first card has a saved snapshot (expandable), second is an old result (fallback)</div>
<div class="section-label">Result history</div>
<div id="results-container"></div>
</main>
<script>
const typeNames = {
  INTJ:'The Architect',INTP:'The Thinker',ENTJ:'The Commander',ENTP:'The Debater',
  INFJ:'The Advocate',INFP:'The Mediator',ENFJ:'The Protagonist',ENFP:'The Campaigner',
  ISTJ:'The Logistician',ISFJ:'The Defender',ESTJ:'The Executive',ESFJ:'The Consul',
  ISTP:'The Virtuoso',ISFP:'The Adventurer',ESTP:'The Entrepreneur',ESFP:'The Entertainer'
};

function pct(a, b) {
  const total = (a||0) + (b||0);
  return total ? Math.round((a||0) / total * 100) : 50;
}

function fmt(date) {
  return new Date(date).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderDetail(d){
  if(!d) return '';
  let html = '';
  if(d.description) html += `<div class="rp-intro">${esc(d.description)}</div>`;
  if(d.rarity != null) html += `<div><span class="rp-rarity">${d.rarity<=4?'Rare &middot; ':''}~${esc(d.rarity)}% of people share this type</span></div>`;
  if(Array.isArray(d.stack) && d.stack.length){
    html += `<div class="rp-section"><div class="rp-label">How this mind is wired</div>`;
    html += d.stack.map((s,i)=>{
      const c = (i<2 && s.count>0) ? `<div class="rp-fn-count">Fired ${esc(s.count)} time${s.count===1?'':'s'} in this test</div>` : '';
      return `<div class="rp-fn-row"><div class="rp-fn-rank">${esc(s.rank)}</div><div><div class="rp-fn-name">${esc(s.name)}<span>${esc(s.fn)}</span></div><div class="rp-fn-desc">${esc(s.desc)}</div>${c}</div></div>`;
    }).join('');
    html += `</div>`;
  }
  if(Array.isArray(d.moments) && d.moments.length){
    html += `<div class="rp-section"><div class="rp-label">Defining moments${d.modeLabel?' &middot; '+esc(d.modeLabel):''}</div>`;
    html += d.moments.map(m=>{
      const read = m.fn ? `That instinct is <b>${esc(m.fnName)} (${esc(m.fn)})</b> &mdash; ${esc(m.fnDesc)}.` : '';
      return `<div class="rp-moment"><div class="rp-moment-scene">${esc(m.scene||'A moment')}</div><div class="rp-moment-choice">&ldquo;${esc(m.choice)}&rdquo;</div>${read?`<div class="rp-moment-read">${read}</div>`:''}</div>`;
    }).join('');
    html += `</div>`;
  }
  if(Array.isArray(d.neighbours) && d.neighbours.length){
    html += `<div class="rp-section"><div class="rp-label">Your closest neighbouring types</div>`;
    html += d.neighbours.map(n=>`<a class="rp-neighbour" href="${esc(n.href)}"><div><div class="rp-neighbour-ax">${esc(n.axisLabel)} &middot; ${esc(n.pct)}%</div><div class="rp-neighbour-txt">How <b>${esc(n.type)}</b> and <b>${esc(n.neighbour)}</b> diverge</div></div><div class="rp-neighbour-arrow">&rarr;</div></a>`).join('');
    html += `</div>`;
  }
  return html;
}

function toggleDetail(btn){
  const panel = btn.nextElementSibling;
  if(!panel) return;
  const open = panel.style.display === 'block';
  panel.style.display = open ? 'none' : 'block';
  btn.classList.toggle('open', !open);
  const lbl = btn.querySelector('.lbl');
  if(lbl) lbl.textContent = open ? 'Full breakdown' : 'Hide breakdown';
}

function renderCard(r) {
  const ep = pct(r.ei_e, r.ei_i);
  const sp = pct(r.sn_s, r.sn_n);
  const tp = pct(r.tf_t, r.tf_f);
  const jp = pct(r.jp_j, r.jp_p);
  const t = r.personality_type;
  const detailHtml = r.details ? renderDetail(r.details) : '';
  const expand = detailHtml
    ? `<button class="result-expand" onclick="toggleDetail(this)"><span class="chev">&#9662;</span><span class="lbl">Full breakdown</span></button><div class="rp-detail" style="display:none">${detailHtml}</div>`
    : '';
  return `
    <div class="result-card">
      <div>
        <div class="result-type">${t}</div>
        <div class="result-meta">${typeNames[t] || ''} &nbsp;·&nbsp; ${fmt(r.created_at)}</div>
      </div>
      <div class="result-bars">
        <div class="bar-row">
          <div class="bar-letters"><span>E</span><span>I</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${ep}%"></div></div>
          <span>${ep}%</span>
        </div>
        <div class="bar-row">
          <div class="bar-letters"><span>S</span><span>N</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${sp}%"></div></div>
          <span>${sp}%</span>
        </div>
        <div class="bar-row">
          <div class="bar-letters"><span>T</span><span>F</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${tp}%"></div></div>
          <span>${tp}%</span>
        </div>
        <div class="bar-row">
          <div class="bar-letters"><span>J</span><span>P</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${jp}%"></div></div>
          <span>${jp}%</span>
        </div>
      </div>
      <a class="result-link" href="/types/${t.toLowerCase()}">View ${t} profile →</a>
      <div class="result-ctas">
        <a class="result-cta-btn" href="/archive?q=${t}">${t} characters →</a>
        <a class="result-cta-btn" href="/compatibility">Compatibility →</a>
        <a class="result-cta-btn" href="/">Retake test →</a>
      </div>
      ${expand}
    </div>`;
}



const mockResults = [{
  personality_type:'INTJ', created_at:'2026-05-20T10:00:00Z',
  ei_e:6, ei_i:13, sn_s:5, sn_n:14, tf_t:10, tf_f:9, jp_j:11, jp_p:8,
  details:{
    v:1, type:'INTJ', name:'The Architect', tagline:'Strategic mind, relentless standard',
    description:'You already have a better plan. You see structural flaws others walk past, hold yourself to an impossible standard, and build systems, visions, and long games.',
    mode:'myth', modeLabel:'the mythic lens', rarity:2.1,
    spectrum:[{pole:'I',label:'Introvert',loseLabel:'Extravert',pct:68,pos:0},{pole:'N',label:'Intuitive',loseLabel:'Sensing',pct:74,pos:1},{pole:'T',label:'Thinking',loseLabel:'Feeling',pct:53,pos:2},{pole:'J',label:'Judging',loseLabel:'Perceiving',pct:58,pos:3}],
    neighbours:[{type:'INTJ',neighbour:'INFJ',axisLabel:'Thinking vs Feeling',pct:53,href:'/vs/intj-infj'},{type:'INTJ',neighbour:'INTP',axisLabel:'Judging vs Perceiving',pct:58,href:'/vs/intj-intp'}],
    stack:[{rank:'Dominant',fn:'Ni',name:'Introverted Intuition',desc:'You sense where things are heading and the single pattern underneath the noise.',count:14},{rank:'Auxiliary',fn:'Te',name:'Extraverted Thinking',desc:'You organise the outer world into systems, plans, and measurable results.',count:9},{rank:'Tertiary',fn:'Fi',name:'Introverted Feeling',desc:'You navigate by a private compass of values and what feels true to you.',count:3},{rank:'Inferior',fn:'Se',name:'Extraverted Sensing',desc:'You live in the immediate present and act on what is in front of you.',count:2}],
    moments:[{scene:'The Photograph',choice:'Someone who did not know yet what was coming. You can read it in their face.',fn:'Ni',fnName:'Introverted Intuition',fnDesc:'you sense where things are heading and the single pattern underneath the noise'},{scene:'The Verdict',choice:'You state the decision plainly and move on.',fn:'Te',fnName:'Extraverted Thinking',fnDesc:'you organise the outer world into systems, plans, and measurable results'},{scene:'The Good News',choice:'You sit down. You need to be alone with it before you can say a word.',fn:'Ni',fnName:'Introverted Intuition',fnDesc:'you sense where things are heading and the single pattern underneath the noise'}]
  }
},{
  personality_type:'ENFP', created_at:'2026-04-02T10:00:00Z',
  ei_e:13, ei_i:6, sn_s:5, sn_n:14, tf_t:8, tf_f:11, jp_j:7, jp_p:12,
  details:null
}];
document.getElementById('results-container').innerHTML = mockResults.map(renderCard).join('');

</script>
</body></html>
