<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0c0e10;--surface:#13161a;--surface2:#1a1e24;--gold:#c9a84c;--gold-dim:#8a6d2e;--cream:#ede8df;--muted:#ccc6bf;--border:#252a30;--radius:14px;}
  html,body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:400;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6;}
  #t-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#0c0e10;opacity:1;}
  .glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;}
  .glow-1{width:600px;height:600px;top:-200px;left:-150px;background:radial-gradient(circle,rgba(201,168,76,0.07) 0%,transparent 70%);}
  .glow-2{width:400px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(120,180,160,0.05) 0%,transparent 70%);}


  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:56px 32px 96px;}
  @media(max-width:600px){main{padding:40px 16px 80px;}}
  /* ── Mobile: move vote col to bottom row ── */
  @media(max-width:520px){.thread-wrapper{display:flex;flex-direction:column;}
  .thread-wrapper .vote-col{
  position:static;width:100%;flex-direction:row;
  border-right:none;border-top:1px solid var(--border);
  padding:8px 16px;justify-content:flex-start;gap:16px;
  order:2;
  }
  .thread-wrapper .thread-item{
  padding:16px;order:1;
  border-bottom-left-radius:0;border-bottom-right-radius:0;
  }
  .thread-wrapper .vote-btn{min-height:36px;padding:6px 10px;}
  }

  .r{opacity:0;transform:translateY(24px);transition:opacity 0.65s cubic-bezier(0.22,1,0.36,1),transform 0.65s cubic-bezier(0.22,1,0.36,1);}
  .r.in{opacity:1;transform:none;}

  /* Page header */
  .forum-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px;gap:16px;flex-wrap:wrap;}
  .forum-eyebrow{font-size:0.84rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px;}
  .forum-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3rem);font-weight:600;color:var(--cream);line-height:1.05;}
  .forum-title em{color:var(--gold);font-style:italic;}

  /* Vote buttons */
  .vote-col{position:absolute;left:0;top:0;bottom:0;width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-right:1px solid var(--border);padding:12px 0;}
  .vote-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:10px 8px;font-size:14px;line-height:1;transition:color 0.15s;display:flex;align-items:center;justify-content:center;border-radius:4px;min-height:44px;}
  .vote-btn:hover{color:var(--gold);}
  .vote-btn.up.active{color:var(--gold);}
  .vote-btn.down.active{color:#e07070;}
  .vote-score{font-size:0.94rem;font-weight:500;color:var(--cream);min-width:20px;text-align:center;}

  /* New thread button */
  .btn-primary{background:var(--gold);color:#0c0e10;border:none;padding:10px 22px;border-radius:8px;font-size:0.96rem;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:opacity 0.15s;font-family:'DM Sans',sans-serif;white-space:nowrap;}
  .btn-primary:hover{opacity:0.88;}
  .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px 22px;border-radius:8px;font-size:0.96rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:border-color 0.15s,color 0.15s;font-family:'DM Sans',sans-serif;}
  .btn-secondary:hover{border-color:var(--gold-dim);color:var(--cream);}

  /* Categories */
  .cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;}
  .cat-pill{background:transparent;border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:1rem;letter-spacing:0.06em;color:var(--muted);cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
  .cat-pill:hover{border-color:var(--gold-dim);color:var(--cream);}
  .cat-pill.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.07);}

  /* Tags */
  .thread-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .tag-chip{background:rgba(201,168,76,0.08);border:1px solid var(--gold-dim);border-radius:14px;padding:3px 10px;font-size:0.84rem;letter-spacing:0.04em;color:var(--gold);cursor:pointer;transition:background 0.15s,border-color 0.15s;line-height:1.4;}
  .tag-chip:hover{background:rgba(201,168,76,0.18);border-color:var(--gold);}
  .active-tag-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .active-tag-bar .active-tag-label{font-size:0.92rem;color:var(--muted);}
  .active-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,0.12);border:1px solid var(--gold);border-radius:16px;padding:4px 12px;font-size:0.92rem;color:var(--gold);}
  .active-tag button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:1rem;line-height:1;padding:0;}
  /* Tag input field */
  .tag-input-wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(8,12,18,0.8);border:1px solid #2a3848;border-radius:8px;padding:8px 10px;min-height:46px;transition:border-color 0.15s;}
  .tag-input-wrap:focus-within{border-color:var(--gold-dim);}
  .tag-input-wrap input{background:none;border:none;outline:none;color:var(--cream);font-size:1rem;font-family:'DM Sans',sans-serif;flex:1;min-width:120px;padding:4px;}
  .tag-pending{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,0.1);border:1px solid var(--gold-dim);border-radius:14px;padding:3px 10px;font-size:0.88rem;color:var(--gold);}
  .tag-pending button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:0.95rem;line-height:1;padding:0;}
  .tag-hint{font-size:0.84rem;color:var(--muted);margin-top:6px;}
  body.light-mode .tag-chip{background:rgba(201,168,76,0.12);border-color:#a8893a;color:#8a6d2e;}
  body.light-mode .tag-chip:hover{background:rgba(201,168,76,0.22);border-color:#8a6d2e;}
  body.light-mode .thread-item .tag-chip{background:rgba(255,255,255,0.14)!important;border-color:rgba(255,255,255,0.3)!important;color:#ffffff!important;}
  body.light-mode .active-tag{background:rgba(201,168,76,0.14);border-color:#a8893a;color:#8a6d2e;}
  body.light-mode .active-tag button{color:#8a6d2e;}
  body.light-mode .active-tag-bar .active-tag-label{color:#4a6080;}
  body.light-mode .tag-input-wrap{background:#ffffff;border-color:#d0d7e3;}
  body.light-mode .tag-input-wrap input{color:#1e2d4a;}
  body.light-mode .tag-pending{background:rgba(201,168,76,0.12);border-color:#a8893a;color:#8a6d2e;}
  body.light-mode .tag-pending button{color:#8a6d2e;}
  body.light-mode .tag-hint{color:#4a6080;}

  /* Image attach */
  .img-attach{margin-top:12px;}
  .img-attach-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .img-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:0.92rem;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color 0.15s,color 0.15s;font-family:'DM Sans',sans-serif;}
  .img-btn:hover{border-color:var(--gold-dim);color:var(--cream);}
  .img-url-input{background:rgba(8,12,18,0.8);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--cream);font-size:0.92rem;font-family:'DM Sans',sans-serif;flex:1;min-width:160px;outline:none;transition:border-color 0.15s;}
  .img-url-input:focus{border-color:var(--gold-dim);}
  .img-preview{position:relative;display:inline-block;margin-top:12px;max-width:100%;}
  .img-preview img{max-width:280px;max-height:220px;border-radius:10px;border:1px solid var(--border);display:block;}
  .img-preview-remove{position:absolute;top:6px;right:6px;background:rgba(8,12,18,0.85);border:1px solid var(--border);border-radius:6px;color:var(--cream);cursor:pointer;font-size:0.9rem;line-height:1;padding:4px 8px;}
  .img-preview-remove:hover{color:#e07070;border-color:#e07070;}
  .img-status{font-size:0.86rem;color:var(--muted);margin-top:8px;}
  .post-image{margin-top:14px;}
  .post-image img{max-width:100%;max-height:520px;border-radius:10px;border:1px solid var(--border);display:block;cursor:zoom-in;}
  .reply-image{margin-top:10px;}
  .reply-image img{max-width:100%;max-height:360px;border-radius:8px;border:1px solid var(--border);display:block;cursor:zoom-in;}
  .img-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9998;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
  .img-lightbox.open{display:flex;}
  .img-lightbox img{max-width:96vw;max-height:96vh;border-radius:8px;}

  /* Thread list */
  .thread-list{display:flex;flex-direction:column;gap:2px;}
  .thread-item{background:#131820;border:1px solid #2a3848;border-radius:10px;padding:20px 24px 20px 68px;cursor:pointer;transition:border-color 0.2s,transform 0.25s,box-shadow 0.25s;text-decoration:none;display:block;color:inherit;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .thread-item::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,0.07),transparent);opacity:0;transition:opacity 0.25s;pointer-events:none;}
  .thread-item:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08),0 20px 50px rgba(0,0,0,0.55);}
  .thread-item:hover::after{opacity:1;}
  .thread-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px;}
  .thread-cat-badge{font-size:0.92rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-dim);flex-shrink:0;margin-top:2px;}
  .thread-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;color:var(--cream);line-height:1.3;flex:1;}
  .thread-meta{display:flex;align-items:center;gap:16px;font-size:1rem;color:var(--muted);}
  .thread-meta-author{color:var(--gold-dim);}
  .thread-replies{display:flex;align-items:center;gap:4px;}
  .thread-pinned{color:var(--gold);font-size:0.84rem;letter-spacing:0.1em;text-transform:uppercase;}

  /* Empty state */
  .empty-state{text-align:center;padding:64px 24px;color:var(--muted);}
  .empty-state-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--cream);margin-bottom:10px;}

  /* Loading */
  .loading-row{background:#131820;border:1px solid #2a3848;border-radius:10px;padding:20px 24px 20px 68px;position:relative;overflow:hidden;}
  .loading-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:52px;border-right:1px solid var(--border);}
  .loading-row::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.04) 50%,transparent 100%);
  background-size:200% 100%;
  animation:shimmer 1.6s ease infinite;
  }
  .sk-line{height:10px;border-radius:5px;background:rgba(255,255,255,0.06);margin-bottom:10px;}
  .sk-line.wide{width:68%;}
  .sk-line.narrow{width:38%;}
  .sk-line.short{width:22%;height:8px;margin-bottom:0;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  body.light-mode .loading-row{background:#f4f5f7;border-color:#d0d7e3;}
  body.light-mode .loading-row::before{border-right-color:#d0d7e3;}
  body.light-mode .loading-row::after{background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.6) 50%,transparent 100%);background-size:200% 100;}
  body.light-mode .sk-line{background:rgba(0,0,0,0.07);}

  /* Modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:500;align-items:center;justify-content:center;padding:24px;}
  .modal-bg.open{display:flex;}
  .modal{background:#131820;border:1px solid #2a3848;border-radius:16px;width:100%;max-width:580px;padding:36px;position:relative;}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--cream);margin-bottom:24px;}
  .modal-close{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
  .modal-close:hover{color:var(--cream);}
  .form-field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .form-label{font-size:1rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
  .form-input,.form-select,.form-textarea{background:rgba(8,12,18,0.8);border:1px solid #2a3848;border-radius:8px;padding:12px 14px;color:var(--cream);font-size:1rem;font-family:'DM Sans',sans-serif;width:100%;transition:border-color 0.15s;outline:none;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--gold-dim);}
  .form-textarea{resize:vertical;min-height:140px;line-height:1.6;}
  .form-select option{background:#13161a;}
  .form-error{font-size:0.92rem;color:#e07070;margin-top:-12px;margin-bottom:8px;display:none;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}

  /* Thread delete button */
  .thread-delete-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:color 0.15s,background 0.15s;z-index:2;}
  .thread-delete-btn:hover{color:#e07070;background:rgba(224,112,112,0.1);}

  /* Auth notice */
  .auth-notice{background:#131820;border:1px solid #2a3848;border-radius:10px;padding:20px 24px;text-align:center;color:var(--muted);font-size:1rem;margin-bottom:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 2px 14px rgba(0,0,0,0.45);}
  .auth-notice a{color:var(--gold);text-decoration:none;}
  .auth-notice a:hover{text-decoration:underline;}
</style>

<body>
<div id="t-overlay"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<h1 class="sr-only">Forum - 77 Scenarios</h1>

<main>
  <div class="forum-header r">
    <div>
      <div class="forum-eyebrow">Community</div>
      <div class="forum-title">The <em>forum.</em></div>
    </div>
    <button class="btn-primary" id="new-thread-btn" onclick="handleNewThread()">New thread <span>+</span></button>
  </div>

  <div id="auth-notice" class="auth-notice r" style="display:none;">
    <a href="/login">Sign in</a> or <a href="/signup">create an account</a> to start a thread or reply.
  </div>


  <div class="cat-bar r" style="margin-bottom:12px;">
    <button class="sort-pill cat-pill active" onclick="setSort(this,'hot')">🔥 Hot</button>
    <button class="sort-pill cat-pill" onclick="setSort(this,'top')">⬆ Top</button>
    <button class="sort-pill cat-pill" onclick="setSort(this,'new')">✦ New</button>
  </div>

  <div class="cat-bar r">
    <button class="cat-pill active" data-cat="all" onclick="filterCat(this,'all')">All</button>
    <button class="cat-pill" data-cat="general" onclick="filterCat(this,'general')">General</button>
    <button class="cat-pill" data-cat="type_discussion" onclick="filterCat(this,'type_discussion')">Type Discussion</button>
    <button class="cat-pill" data-cat="relationships" onclick="filterCat(this,'relationships')">Relationships</button>
    <button class="cat-pill" data-cat="cognitive_functions" onclick="filterCat(this,'cognitive_functions')">Cognitive Functions</button>
    <button class="cat-pill" data-cat="ask_the_forum" onclick="filterCat(this,'ask_the_forum')">Ask the Forum</button>
    <button class="cat-pill" data-cat="off_topic" onclick="filterCat(this,'off_topic')">Off Topic</button>

  async function loadThreads(reset = true) {
    if (reset) {
      page = 0;

      .range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

    if (currentCat !== 'all') query = query.eq('category', currentCat);
    if (currentTag) query = query.contains('tags', [currentTag]);

    if (sortMode === 'top') {
      query = query.order('is_pinned', { ascending: false }).order('vote_score', { ascending: false });
    } else if (sortMode === 'new') {
      query = query.order('is_pinned', { ascending: false }).order('created_at', { ascending: false });
    } else {
      // hot: pinned first, then last activity
      query = query.order('is_pinned', { ascending: false }).order('last_activity_at', { ascending: false });
    }

    const { data, error } = await query;
    if (error) {
      // DataCloneError is an internal Supabase BroadcastChannel issue - retry once silently
      if (error.message && error.message.includes('DataClone')) {
        await new Promise(r => setTimeout(r, 300));
        const retry = await query;

  // ── Image attach helper (shared) ──
  // Creates a picker bound to a container; tracks selected image (file or url).
  // Call ImgPicker.create(containerId) then ImgPicker.resolve(containerId) at submit
  // to get a public URL (uploads pending file first). Returns null if none.
  const ImgPicker = (function () {
    const state = {}; // containerId -> { file, url, objectUrl }
    const MAX_BYTES = 5 * 1024 * 1024;
    const OK_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];

    function html(id) {
      return `
        <div class="img-attach-controls">
          <button type="button" class="img-btn" onclick="ImgPicker.pickFile('${id}')">🖼 Add image</button>
          <input type="text" class="img-url-input" id="${id}-imgurl" placeholder="or paste an image URL">
          <input type="file" id="${id}-imgfile" accept="image/*" style="display:none">
        </div>
        <div id="${id}-imgpreview"></div>
        <div class="img-status" id="${id}-imgstatus" style="display:none"></div>`;
    }

    function create(containerId) {
      const c = document.getElementById(containerId);
      if (!c) return;
      c.innerHTML = html(containerId);
      state[containerId] = { file: null, url: null, objectUrl: null };
      const fileInput = document.getElementById(`${containerId}-imgfile`);
      fileInput.addEventListener('change', () => onFile(containerId, fileInput.files[0]));
      const urlInput = document.getElementById(`${containerId}-imgurl`);
      urlInput.addEventListener('change', () => onUrl(containerId, urlInput.value.trim()));
      urlInput.addEventListener('blur', () => onUrl(containerId, urlInput.value.trim()));
    }

    function pickFile(containerId) {
      document.getElementById(`${containerId}-imgfile`).click();
    }

    function status(containerId, msg, isErr) {
      const el = document.getElementById(`${containerId}-imgstatus`);
      if (!el) return;
      if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
      el.style.display = 'block';
      el.textContent = msg;
      el.style.color = isErr ? '#e07070' : 'var(--muted)';
    }

    function onFile(containerId, file) {
      const s = state[containerId];
      if (!file) return;
      if (!OK_TYPES.includes(file.type)) { status(containerId, 'Use JPG, PNG, GIF or WebP.', true); return; }
      if (file.size > MAX_BYTES) { status(containerId, 'Image must be under 5 MB.', true); return; }
      clearUrlField(containerId);
      s.url = null;
      s.file = file;
      if (s.objectUrl) URL.revokeObjectURL(s.objectUrl);
      s.objectUrl = URL.createObjectURL(file);
      showPreview(containerId, s.objectUrl);
      status(containerId, '');
    }

    function onUrl(containerId, url) {
      const s = state[containerId];
      if (!url) { if (!s.file) clearPreview(containerId); return; }
      if (!/^https?:\/\/.+/i.test(url)) { status(containerId, 'Enter a valid http(s) image URL.', true); return; }
      s.file = null;
      if (s.objectUrl) { URL.revokeObjectURL(s.objectUrl); s.objectUrl = null; }
      s.url = url;
      showPreview(containerId, url);
      status(containerId, '');
    }

    function showPreview(containerId, src) {
      const p = document.getElementById(`${containerId}-imgpreview`);
      p.innerHTML = `<div class="img-preview"><img src="${src}" alt="preview" onerror="ImgPicker.previewError('${containerId}')"><button type="button" class="img-preview-remove" onclick="ImgPicker.remove('${containerId}')">✕</button></div>`;
    }

    function previewError(containerId) {
      status(containerId, 'Could not load that image.', true);
      clearPreview(containerId);
      state[containerId].url = null;
    }

    function clearPreview(containerId) {
      const p = document.getElementById(`${containerId}-imgpreview`);
      if (p) p.innerHTML = '';
    }

    function clearUrlField(containerId) {
      const u = document.getElementById(`${containerId}-imgurl`);
      if (u) u.value = '';
    }

    function remove(containerId) {
      const s = state[containerId];
      if (s.objectUrl) { URL.revokeObjectURL(s.objectUrl); }
      state[containerId] = { file: null, url: null, objectUrl: null };
      clearPreview(containerId);
      clearUrlField(containerId);
      const f = document.getElementById(`${containerId}-imgfile`);
      if (f) f.value = '';
      status(containerId, '');
    }

    // Returns a public URL (string) or null. Uploads pending file to storage.
    async function resolve(containerId) {
      const s = state[containerId];
      if (!s) return null;
      if (s.url) return s.url;
      if (!s.file) return null;
      if (!currentUser) return null;
      status(containerId, 'Uploading image…');
      const ext = (s.file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
      const path = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await sb.storage.from('forum-images').upload(path, s.file, { upsert: false, contentType: s.file.type });
      if (error) { status(containerId, 'Upload failed: ' + (error.message || 'error'), true); throw error; }
      const { data } = sb.storage.from('forum-images').getPublicUrl(path);
      status(containerId, '');
      return data.publicUrl;
    }

    function reset(containerId) { remove(containerId); }

    return { create, pickFile, remove, resolve, reset, previewError };
  })();
  window.ImgPicker = ImgPicker;

    // Delete button for own threads

  }

  async function handleVote(threadId, replyId, v) {
    if (!currentUser) { window.location.href = '/login'; return; }
    const isThread = threadId !== null;
    const key = isThread ? threadId : replyId;

    // Guard against concurrent double-clicks
    const btns = isThread
      ? document.querySelectorAll(`.vote-btn[data-id="${key}"]`)
      : document.querySelectorAll(`.vote-btn[data-rid="${key}"]`);
    if (btns.length && btns[0].dataset.voting) return;
    btns.forEach(b => b.dataset.voting = '1');

    const existing = userVotes[key];
    const scoreEl = isThread ? document.getElementById(`vs-${key}`) : null;
    const currentScore = parseInt(scoreEl?.textContent || '0');

    // Optimistic update — instant feedback before DB round-trip
    const newVote = existing === v ? null : v;
    let scoreDelta = 0;
    if (existing === v) { scoreDelta = -v; delete userVotes[key]; }
    else { scoreDelta = v - (existing || 0); userVotes[key] = v; }
    if (scoreEl) scoreEl.textContent = currentScore + scoreDelta;
    btns.forEach(btn => btn.classList.toggle('active', userVotes[key] === parseInt(btn.dataset.v)));

    try {
      const col = isThread ? 'thread_id' : 'reply_id';
      if (existing) await sb.from('forum_votes').delete().eq('user_id', currentUser.id).eq(col, key);
      if (newVote !== null) {
        const payload = { user_id: currentUser.id, vote: newVote };
        if (isThread) payload.thread_id = key; else payload.reply_id = key;
        const { error } = await sb.from('forum_votes').insert(payload);
        if (error) throw error;
      }
      // Sync actual score from DB (handles server-side trigger recomputation)
      if (isThread) {
        const { data } = await sb.from('forum_threads').select('vote_score').eq('id', key).single();
        if (data && scoreEl) scoreEl.textContent = data.vote_score;
      }
    } catch (e) {
      // Revert optimistic update on error
      if (existing) userVotes[key] = existing; else delete userVotes[key];
      if (scoreEl) scoreEl.textContent = currentScore;
      btns.forEach(btn => btn.classList.toggle('active', userVotes[key] === parseInt(btn.dataset.v)));
      console.error('Vote error:', errStr(e));
    } finally {
      btns.forEach(b => delete b.dataset.voting);
    }
  }

  async function deleteThread(id) {

  async function submitThread() {
    const title = document.getElementById('thread-title').value.trim();
    const body = document.getElementById('thread-body').value.trim();
    const cat = document.getElementById('thread-cat').value;
    let valid = true;
    if (title.length < 3) { document.getElementById('title-error').style.display = 'block'; valid = false; }
    else document.getElementById('title-error').style.display = 'none';
    if (body.length < 10) { document.getElementById('body-error').style.display = 'block'; valid = false; }
    else document.getElementById('body-error').style.display = 'none';
    if (!valid) return;

    const btn = document.getElementById('submit-thread-btn');
    btn.disabled = true; btn.textContent = 'Posting…';

    let imageUrl = null;
    try { imageUrl = await ImgPicker.resolve('thread-img-attach'); }
    catch (e) { btn.disabled = false; btn.innerHTML = 'Post thread →'; return; }

    const { data: profile } = await sb.from('profiles').select('username').eq('id', currentUser.id).single();
    const username = profile?.username || 'Anonymous';

    const { data, error } = await sb.from('forum_threads').insert({
      title, body, category: cat, tags: pendingTags, image_url: imageUrl, user_id: currentUser.id, author_username: username
    }).select('id').single();

    if (error) {
      document.getElementById('thread-post-error').style.display = 'block';
      document.getElementById('thread-post-error').textContent = 'Error: ' + errStr(error);
      btn.disabled = false; btn.innerHTML = 'Post thread →';
      return;
    }
    closeModal();
    window.location.href = `/forum-thread?id=${data.id}`;
  }

  // ── Tags ──
  function normTag(s) {
    return s.trim().toLowerCase().replace(/[^a-z0-9 -]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 24);
  }

  function renderPendingTags() {
    const wrap = document.getElementById('tag-input-wrap');
    wrap.querySelectorAll('.tag-pending').forEach(el => el.remove());
    const input = document.getElementById('tag-input');
    pendingTags.forEach(tag => {
      const chip = document.createElement('span');
      chip.className = 'tag-pending';
      chip.innerHTML = `${escHtml(tag)} <button type="button" title="Remove">✕</button>`;
      chip.querySelector('button').onclick = () => { pendingTags = pendingTags.filter(t => t !== tag); renderPendingTags(); };
      wrap.insertBefore(chip, input);
    });
    input.style.display = pendingTags.length >= 5 ? 'none' : '';
  }

  function addPendingTag() {
    const input = document.getElementById('tag-input');
    const t = normTag(input.value);
    if (t && pendingTags.length < 5 && !pendingTags.includes(t)) pendingTags.push(t);
    input.value = '';
    renderPendingTags();
  }

  function setupTagInput() {
    const input = document.getElementById('tag-input');
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addPendingTag(); }
      else if (e.key === 'Backspace' && input.value === '' && pendingTags.length) { pendingTags.pop(); renderPendingTags(); }
    });
    input.addEventListener('blur', () => { if (input.value.trim()) addPendingTag(); });
  }

  function filterTag(tag) {
    currentTag = tag;
    renderActiveTagBar();
    loadThreads();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function clearTagFilter() {
    currentTag = null;
    renderActiveTagBar();
    loadThreads();
  }

  function renderActiveTagBar() {
    let bar = document.getElementById('active-tag-bar');
    if (!currentTag) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'active-tag-bar';
      bar.className = 'active-tag-bar';
      const list = document.getElementById('thread-list');
      list.parentNode.insertBefore(bar, list);
    }
    bar.innerHTML = `<span class="active-tag-label">Filtering by tag:</span>
      <span class="active-tag">#${escHtml(currentTag)} <button title="Clear" onclick="clearTagFilter()">✕</button></span>`;
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function timeAgo(ts) {
    const diff = Date.now() - new Date(ts).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    if (d < 30) return `${d}d ago`;
    return formatDate(ts);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }const ro = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); ro.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.r').forEach(el => ro.observe(el));

  const ov = document.getElementById('t-overlay');
  window.addEventListener('pageshow', () => {
    requestAnimationFrame(() => { ov.style.transition = 'opacity 0.45s ease'; ov.style.opacity = '0'; });
  });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('mailto') || a.target === '_blank') return;
    if (new URL(a.href, location.origin).origin !== location.origin) return;
    e.preventDefault();
    ov.style.transition = 'opacity 0.3s ease'; ov.style.opacity = '1';
    setTimeout(() => { window.location.href = href; }, 310);
  });

  setupTagInput();
  const urlTag = new URLSearchParams(location.search).get('tag');
  if (urlTag) { currentTag = normTag(urlTag); renderActiveTagBar(); }
  initAuth().then(() => loadThreads());

</script>
